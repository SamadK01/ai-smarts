<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#07080d" />
    </linearGradient>

    <!-- Signature Coral & Gold Gradient (AI Smarts Flame) -->
    <linearGradient id="brainGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="45%" stop-color="#ff7548" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Cyan Quantum Synapse Gradient -->
    <linearGradient id="synapseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#2a3044" stroke-width="1.5" />

  <!-- Ambient Glow Behind Brain -->
  <circle cx="32" cy="32" r="16" fill="#ff7548" opacity="0.22" filter="url(#glow)" />

  <!-- Stylized Neural Brain & Quantum Spark Emblem -->
  <!-- Left Hemisphere Lobes -->
  <path d="M 27 18 C 22 18 17 21 17 26 C 17 28.5 18 30.5 19.5 32 C 18 33.5 17 35.5 17 38 C 17 43 22 46 27 46 C 28.5 46 30 45.5 31 44.5 L 31 19.5 C 30 18.5 28.5 18 27 18 Z"
        fill="url(#brainGrad)" />

  <!-- Right Hemisphere Lobes -->
  <path d="M 37 18 C 42 18 47 21 47 26 C 47 28.5 46 30.5 44.5 32 C 46 33.5 47 35.5 47 38 C 47 43 42 46 37 46 C 35.5 46 34 45.5 33 44.5 L 33 19.5 C 34 18.5 35.5 18 37 18 Z"
        fill="url(#brainGrad)" />

  <!-- Neural Synapse Grooves / Fissures -->
  <path d="M 21 27 C 24 26 27 28 30 28" fill="none" stroke="#090a0f" stroke-width="2" stroke-linecap="round" />
  <path d="M 43 27 C 40 26 37 28 34 28" fill="none" stroke="#090a0f" stroke-width="2" stroke-linecap="round" />
  <path d="M 21 37 C 24 38 27 36 30 36" fill="none" stroke="#090a0f" stroke-width="2" stroke-linecap="round" />
  <path d="M 43 37 C 40 38 37 36 34 36" fill="none" stroke="#090a0f" stroke-width="2" stroke-linecap="round" />

  <!-- Central Synaptic Nodes -->
  <circle cx="21" cy="27" r="1.8" fill="#ffffff" />
  <circle cx="43" cy="27" r="1.8" fill="#ffffff" />
  <circle cx="21" cy="37" r="1.8" fill="#ffffff" />
  <circle cx="43" cy="37" r="1.8" fill="#ffffff" />

  <!-- Central Quantum Spark / Diamond Core (Intelligence & Spark) -->
  <path d="M 32 23 L 34.5 30.5 L 42 32 L 34.5 33.5 L 32 41 L 29.5 33.5 L 22 32 L 29.5 30.5 Z"
        fill="#ffffff" filter="url(#glow)" />
  <circle cx="32" cy="32" r="2.2" fill="#00f0ff" />
</svg>
