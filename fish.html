<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catch the Fish — AI Smarts</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Funnel+Display:wght@700;800&display=swap');*{box-sizing:border-box}html,body,canvas{margin:0;width:100%;height:100%}body{overflow:hidden;background:#03131d;color:#eff4e8;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none;font:11px 'DM Mono',monospace}.hud>*{position:absolute}.home{top:20px;left:22px;color:#eff4e8;text-decoration:none;pointer-events:auto}.home:before{content:'← ';color:#ffbf60}.score{top:20px;right:22px;color:#9baeb4}.score b{color:#f7dc7d;font-weight:400}.title{left:50%;top:45%;transform:translate(-50%,-50%);text-align:center;transition:opacity .5s}.title.hide{opacity:0}.title h1{margin:0;font:800 clamp(52px,9vw,115px)/.82 'Funnel Display',sans-serif;letter-spacing:-.07em}.title em{font-style:normal;color:#69e6df}.title p,.hint{color:#a8bbc0;font:14px Arial}.hint{bottom:18px;left:0;right:0;text-align:center;font:11px 'DM Mono',monospace;color:#91a4aa}@media(max-width:600px){.home{left:15px;top:15px}.score{right:15px;top:15px}.title h1{font-size:61px}.hint{padding:0 25px;line-height:1.4}}</style></head><body><canvas id="ocean"></canvas><div class="hud"><a class="home" href="index.html">all experiments</a><div class="score">catch <b id="score">0</b> · streak <b id="streak">0</b></div><section class="title" id="title"><h1>Catch the<br><em>fish.</em></h1><p>Cast your glowing lure near a fish.<br>Hold and drag to reel it in.</p></section><p class="hint">tap the water to cast · move your lure near a fish · drag back to reel</p></div><script>
const c=document.querySelector('#ocean'),x=c.getContext('2d'),title=document.querySelector('#title'),score=document.querySelector('#score'),streak=document.querySelector('#streak');let W,H,dpr,fish=[],bubbles=[],lure=null,drag=false,points=0,combo=0,started=false,last=0;const R=(a,b)=>a+Math.random()*(b-a);function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);if(!fish.length)for(let i=0;i<11;i++)spawn()}addEventListener('resize',resize);function spawn(){fish.push({x:R(0,W),y:R(H*.27,H*.92),z:R(.45,1.3),v:R(.35,.85)*(Math.random()<.5?-1:1),h:Math.floor(R(165,215)),tail:R(0,6),caught:false})}function p(e){return{x:e.clientX,y:e.clientY}}function cast(e){let q=p(e);started=true;title.classList.add('hide');lure={x:q.x,y:q.y,tx:q.x,ty:q.y,hooked:null};drag=true;c.setPointerCapture(e.pointerId)}c.addEventListener('pointerdown',cast);c.addEventListener('pointermove',e=>{if(!drag||!lure)return;let q=p(e);lure.tx=q.x;lure.ty=q.y});c.addEventListener('pointerup',()=>drag=false);function circle(a,b,r,col){x.fillStyle=col;x.beginPath();x.arc(a,b,r,0,7);x.fill()}function drawFish(f,t){let s=22*f.z,dir=Math.sign(f.v),bob=Math.sin(t*.003+f.tail)*4*f.z;x.save();x.translate(f.x,f.y+bob);x.scale(dir,1);let g=x.createLinearGradient(-s,0,s,0);g.addColorStop(0,`hsl(${f.h},75%,30%)`);g.addColorStop(.5,`hsl(${f.h},82%,${52+f.z*12}%)`);g.addColorStop(1,`hsl(${f.h+20},80%,62%)`);x.fillStyle=g;x.beginPath();x.ellipse(0,0,s*1.15,s*.57,0,0,7);x.fill();x.fillStyle=`hsl(${f.h+25},70%,55%)`;x.beginPath();x.moveTo(-s,0);x.lineTo(-s*1.7,-s*.72);x.lineTo(-s*1.5,0);x.lineTo(-s*1.7,s*.72);x.closePath();x.fill();circle(s*.55,-s*.15,Math.max(1.5,s*.1),'#06131d');x.restore()}function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;let bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#07566c');bg.addColorStop(.35,'#073245');bg.addColorStop(1,'#02121d');x.fillStyle=bg;x.fillRect(0,0,W,H);for(let i=0;i<8;i++){x.fillStyle=`rgba(116,237,224,${.018+i*.004})`;x.beginPath();x.ellipse(W*(.1+i*.14),H*.05+i*22,W*.38,18,0,0,7);x.fill()}for(let i=0;i<3;i++){let gx=W*(.22+i*.31),g=x.createLinearGradient(gx,0,gx+90,H);g.addColorStop(0,'rgba(190,255,225,.12)');g.addColorStop(1,'rgba(70,220,210,0)');x.fillStyle=g;x.beginPath();x.moveTo(gx,0);x.lineTo(gx+22,0);x.lineTo(gx+180,H);x.lineTo(gx-70,H);x.closePath();x.fill()}fish.forEach(f=>{f.x+=f.v*f.z*45*dt;if(f.x<-80||f.x>W+80)f.v*=-1;if(lure&&!f.caught&&Math.hypot(f.x-lure.x,f.y-lure.y)<35*f.z){f.caught=true;lure.hooked=f;combo++;points++;score.textContent=points;streak.textContent=combo}if(f.caught&&lure){f.x+=(lure.x-f.x)*.16;f.y+=(lure.y-f.y)*.16;if(lure.y<70){fish=fish.filter(a=>a!==f);lure=null;setTimeout(spawn,850)}}drawFish(f,t)});if(lure){lure.x+=(lure.tx-lure.x)*.13;lure.y+=(lure.ty-lure.y)*.13;x.strokeStyle='rgba(238,255,242,.55)';x.lineWidth=1;x.beginPath();x.moveTo(W*.5,0);x.lineTo(lure.x,lure.y);x.stroke();circle(lure.x,lure.y,8,'#fff3a8');circle(lure.x,lure.y,18,'rgba(255,231,117,.16)')}for(let i=0;i<22;i++){let bx=(i*71+t*.015)%W,by=H-(i*93+t*.025)%(H*.8);circle(bx,by,1.5,'rgba(173,243,240,.24)')}requestAnimationFrame(loop)}resize();requestAnimationFrame(loop);
</script></body></html>
