<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quantum & Ultimate Tic Tac Toe — AI Smarts</title>
<meta name="description" content="A masterclass in strategic Tic Tac Toe: Ultimate 9x9 Super Board, 3D Holographic Cube, and Classic with live Neural Evaluation Bar, AI Commentary, and Minimax depth engine.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070913;
    --text: #f0eef8;
    --muted: rgba(220, 215, 240, 0.45);
    --x-color: #ff4772;
    --x-glow: rgba(255, 71, 114, 0.6);
    --o-color: #00f0ff;
    --o-glow: rgba(0, 240, 255, 0.6);
    --gold: #ffb703;
    --purple: #8b5cf6;
    --mono: "Geist Mono", ui-monospace, "SF Mono", monospace;
    --display: "Funnel Display", -apple-system, sans-serif;
    --body: "Bricolage Grotesque", -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: var(--body);
    touch-action: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }

  canvas#bg-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

  /* TOP HUD */
  .hud {
    position: fixed; top: 16px; left: 20px; right: 20px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 25; font: 12px/1.4 var(--mono);
  }
  .home-link {
    color: var(--text); text-decoration: none; font: 600 13px/1 var(--body);
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(18, 22, 36, 0.85); border: 1px solid rgba(255, 255, 255, 0.14);
    padding: 8px 16px; border-radius: 999px; backdrop-filter: blur(14px);
    transition: all 0.2s ease;
  }
  .home-link:hover { border-color: var(--purple); color: #fff; }
  .home-link span { color: var(--purple); font-weight: 700; }

  .hud-right { display: flex; align-items: center; gap: 8px; }
  .hud-btn {
    background: rgba(18, 22, 36, 0.85); border: 1px solid rgba(255, 255, 255, 0.14);
    padding: 8px 14px; border-radius: 999px; color: var(--text);
    font: 600 11px/1 var(--mono); cursor: pointer; backdrop-filter: blur(14px);
    display: flex; align-items: center; gap: 6px; transition: all 0.2s;
  }
  .hud-btn:hover { border-color: var(--purple); color: #fff; transform: translateY(-1px); }

  /* MAIN WRAPPER */
  .game-container {
    position: relative; z-index: 10;
    width: min(94vw, 560px); max-height: 92vh;
    display: flex; flex-direction: column; align-items: center;
    overflow-y: auto; overflow-x: hidden;
  }

  .title-row { text-align: center; margin-bottom: 10px; }
  h1 {
    font: 800 clamp(28px, 5.5vw, 42px)/1 var(--display);
    color: #fff; letter-spacing: -0.03em;
  }
  h1 em { font-style: normal; color: var(--purple); text-shadow: 0 0 20px rgba(139, 92, 246, 0.7); }

  /* Mode Switcher Pills */
  .mode-selector {
    display: flex; gap: 6px; background: rgba(18, 22, 36, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.14);
    padding: 4px; border-radius: 999px; backdrop-filter: blur(14px);
    margin-bottom: 12px;
  }
  .mode-tab {
    background: transparent; border: 0; color: var(--muted);
    font: 700 11px/1 var(--body); padding: 7px 14px; border-radius: 999px;
    cursor: pointer; transition: all 0.2s;
  }
  .mode-tab:hover { color: #fff; }
  .mode-tab.active {
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(0, 240, 255, 0.25));
    border: 1px solid var(--purple); color: #fff; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
  }

  /* Live AI Neural Commentary & Advantage Bar */
  .eval-card {
    width: 100%; max-width: 440px;
    background: rgba(18, 22, 36, 0.8); border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px; padding: 10px 14px; margin-bottom: 12px;
    display: flex; flex-direction: column; gap: 6px; backdrop-filter: blur(12px);
  }
  .eval-top {
    display: flex; justify-content: space-between; align-items: center; font-size: 11px;
  }
  .ai-bubble {
    font: italic 12px/1.3 var(--body); color: #fff; display: flex; align-items: center; gap: 6px;
  }
  .ai-bubble span { color: var(--purple); font-weight: 700; font-style: normal; }
  .eval-bar-bg {
    width: 100%; height: 6px; background: rgba(0, 0, 0, 0.6);
    border-radius: 4px; overflow: hidden; display: flex;
  }
  .eval-bar-x { height: 100%; width: 50%; background: var(--x-color); transition: width 0.3s ease; }
  .eval-bar-o { height: 100%; width: 50%; background: var(--o-color); transition: width 0.3s ease; }

  /* 3D BOARD STAGE */
  .board-stage {
    position: relative; margin: 4px 0 14px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ========================================================================
     CLASSIC 3x3 BOARD
     ======================================================================== */
  .classic-grid {
    width: min(85vw, 340px); height: min(85vw, 340px);
    background: rgba(18, 22, 36, 0.85); border: 1.5px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px; padding: 10px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(139, 92, 246, 0.15);
  }
  .cell-classic {
    aspect-ratio: 1; background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .cell-classic:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.08); transform: translateY(-2px); border-color: var(--purple);
  }
  .cell-classic.hint {
    border-color: var(--gold); box-shadow: 0 0 15px rgba(255, 183, 3, 0.6);
  }

  /* ========================================================================
     ULTIMATE 9x9 SUPER BOARD
     ======================================================================== */
  .ultimate-grid {
    width: min(92vw, 420px); height: min(92vw, 420px);
    background: rgba(14, 16, 28, 0.92); border: 2px solid rgba(139, 92, 246, 0.4);
    border-radius: 22px; padding: 8px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(139, 92, 246, 0.2);
  }
  .sub-board {
    background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px; padding: 4px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px;
    position: relative; transition: all 0.25s ease;
  }
  .sub-board.active-target {
    border: 1.5px solid var(--gold);
    box-shadow: 0 0 18px rgba(255, 183, 3, 0.35);
    background: rgba(255, 183, 3, 0.05);
  }
  .sub-board.won-x::after, .sub-board.won-o::after {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 900 58px/1 var(--display); border-radius: 12px; z-index: 5;
    backdrop-filter: blur(4px);
  }
  .sub-board.won-x::after {
    content: "✕"; color: var(--x-color); background: rgba(255, 71, 114, 0.25);
    text-shadow: 0 0 20px var(--x-color);
  }
  .sub-board.won-o::after {
    content: "◯"; color: var(--o-color); background: rgba(0, 240, 255, 0.25);
    text-shadow: 0 0 20px var(--o-color);
  }
  .cell-ultimate {
    aspect-ratio: 1; background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 6px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font: 800 13px/1 var(--display); transition: all 0.12s;
  }
  .cell-ultimate:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.12);
  }

  /* SVG Animated Strokes */
  .mark-svg { width: 65%; height: 65%; overflow: visible; }
  .stroke-x {
    stroke: var(--x-color); stroke-width: 9; stroke-linecap: round;
    stroke-dasharray: 100; stroke-dashoffset: 100;
    animation: draw-slash 0.22s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    filter: drop-shadow(0 0 10px var(--x-glow));
  }
  .stroke-x-2 { animation-delay: 0.11s; }
  @keyframes draw-slash { to { stroke-dashoffset: 0; } }
  .stroke-o {
    stroke: var(--o-color); stroke-width: 9; fill: none; stroke-linecap: round;
    stroke-dasharray: 260; stroke-dashoffset: 260;
    animation: draw-circle 0.3s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    filter: drop-shadow(0 0 10px var(--o-glow));
  }
  @keyframes draw-circle { to { stroke-dashoffset: 0; } }

  /* Laser Beam */
  .laser-line {
    position: absolute; pointer-events: none; height: 6px; border-radius: 999px;
    background: linear-gradient(90deg, #fff, var(--gold), #fff);
    box-shadow: 0 0 20px var(--gold), 0 0 35px var(--gold);
    transform-origin: 0 50%; z-index: 15; opacity: 0; transition: opacity 0.2s;
  }
  .laser-line.show { opacity: 1; }

  /* Bottom Controls: Hint, Undo, Difficulty */
  .bottom-actions {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  }
  .action-btn {
    background: rgba(18, 22, 36, 0.8); border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 7px 14px; border-radius: 999px; font: 600 11px/1 var(--mono);
    color: var(--muted); cursor: pointer; transition: all 0.2s;
  }
  .action-btn:hover { border-color: var(--cyan); color: #fff; }

  /* Scores */
  .scores-grid {
    display: flex; gap: 24px; font: 12px/1 var(--mono); color: var(--muted);
  }
  .score-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .score-val { font: 800 18px/1 var(--mono); color: #fff; }
  .score-val.x { color: var(--x-color); text-shadow: 0 0 10px var(--x-glow); }
  .score-val.o { color: var(--o-color); text-shadow: 0 0 10px var(--o-glow); }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<header class="hud">
  <a class="home-link" href="index.html">← <span>AI Smarts</span> / 005</a>
  <div class="hud-right">
    <button class="hud-btn" id="sound-btn">🔊 Sound</button>
    <button class="hud-btn" id="reset-btn">↺ Reset Board</button>
  </div>
</header>

<main class="game-container">
  <div class="title-row">
    <h1>Quantum <em>Tactics.</em></h1>
  </div>

  <!-- Mode Selector -->
  <div class="mode-selector">
    <button class="mode-tab active" data-mode="ultimate">👑 Ultimate 9x9</button>
    <button class="mode-tab" data-mode="classic">⚡ Classic Pro 3x3</button>
  </div>

  <!-- AI Evaluation & Commentary -->
  <div class="eval-card">
    <div class="eval-top">
      <div class="ai-bubble" id="ai-bubble"><span>CYBER-AI:</span> Let the strategic battle begin.</div>
      <div id="eval-score" style="font-weight:700; color:var(--gold);">EVEN 0.0</div>
    </div>
    <div class="eval-bar-bg">
      <div class="eval-bar-x" id="eval-bar-x"></div>
      <div class="eval-bar-o" id="eval-bar-o"></div>
    </div>
  </div>

  <!-- Board Area -->
  <div class="board-stage" id="board-stage">
    <div id="board-mount"></div>
    <div class="laser-line" id="laser-line"></div>
  </div>

  <!-- Action Helpers -->
  <div class="bottom-actions">
    <button class="action-btn" id="hint-btn">💡 Optimal Hint</button>
    <button class="action-btn" id="undo-btn">↩ Undo Move</button>
    <select id="diff-select" class="action-btn" style="outline:none;">
      <option value="smart">Grandmaster AI</option>
      <option value="easy">Casual AI</option>
      <option value="pvp">2-Player Local</option>
    </select>
  </div>

  <!-- Score Tracker -->
  <div class="scores-grid">
    <div class="score-item">
      <span>PLAYER (X)</span>
      <span class="score-val x" id="score-x">0</span>
    </div>
    <div class="score-item">
      <span>DRAWS</span>
      <span class="score-val" id="score-draw">0</span>
    </div>
    <div class="score-item">
      <span>AI / P2 (O)</span>
      <span class="score-val o" id="score-o">0</span>
    </div>
  </div>
</main>

<script>
/* ==========================================================================
   WEB AUDIO SYNTHESIZER
   ========================================================================== */
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  try {
    const AudioClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioClass();
  } catch(e) {}
}

const sfx = {
  clickX() {
    if (!soundEnabled || !audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(587.33, t); // D5
    osc.frequency.exponentialRampToValueAtTime(880.00, t + 0.09); // A5
    g.gain.setValueAtTime(0.08, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.16);
  },

  clickO() {
    if (!soundEnabled || !audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440.00, t); // A4
    osc.frequency.exponentialRampToValueAtTime(293.66, t + 0.12); // D4
    g.gain.setValueAtTime(0.08, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.2);
  },

  macroClaim() {
    if (!soundEnabled || !audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, t);
    osc.frequency.exponentialRampToValueAtTime(660, t + 0.22);
    g.gain.setValueAtTime(0.09, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.32);
  },

  win() {
    if (!soundEnabled || !audioCtx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
    const t0 = audioCtx.currentTime;
    notes.forEach((freq, idx) => {
      const t = t0 + idx * 0.08;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.08, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.42);
    });
  }
};

/* ==========================================================================
   GAME ENGINE: ULTIMATE 9x9 & CLASSIC PRO
   ========================================================================== */
const boardMount = document.getElementById('board-mount');
const aiBubble = document.getElementById('ai-bubble');
const evalScore = document.getElementById('eval-score');
const evalBarX = document.getElementById('eval-bar-x');
const evalBarO = document.getElementById('eval-bar-o');
const scoreX = document.getElementById('score-x');
const scoreO = document.getElementById('score-o');
const scoreDraw = document.getElementById('score-draw');
const hintBtn = document.getElementById('hint-btn');
const undoBtn = document.getElementById('undo-btn');
const diffSelect = document.getElementById('diff-select');
const soundBtn = document.getElementById('sound-btn');
const resetBtn = document.getElementById('reset-btn');
const laserLine = document.getElementById('laser-line');

let activeGameMode = 'ultimate'; // 'ultimate' | 'classic'
let scores = { X: 0, O: 0, draw: 0 };
let currentTurn = 'X';
let isGameOver = false;

// Ultimate State
let ultimateMacro = Array(9).fill(''); // Won status of each of 9 sub-boards
let ultimateCells = Array(9).fill(null).map(() => Array(9).fill(''));
let activeSubBoard = -1; // -1 means player can choose ANY open board
let moveHistory = [];

const WINS_3 = [
  [0, 1, 2], [3, 4, 5], [6, 7, 8],
  [0, 3, 6], [1, 4, 7], [2, 5, 8],
  [0, 4, 8], [2, 4, 6]
];

function check3x3Winner(arr) {
  for (const [a, b, c] of WINS_3) {
    if (arr[a] && arr[a] === arr[b] && arr[a] === arr[c]) return arr[a];
  }
  if (arr.every(Boolean)) return 'draw';
  return null;
}

/* ==========================================================================
   RENDER ULTIMATE 9x9 BOARD
   ========================================================================== */
function renderUltimateBoard() {
  boardMount.innerHTML = '';
  laserLine.classList.remove('show');

  const uGrid = document.createElement('div');
  uGrid.className = 'ultimate-grid';

  for (let b = 0; b < 9; b++) {
    const sub = document.createElement('div');
    sub.className = `sub-board ${ultimateMacro[b] ? 'won-' + ultimateMacro[b].toLowerCase() : ''}`;
    if (!isGameOver && !ultimateMacro[b] && (activeSubBoard === -1 || activeSubBoard === b)) {
      sub.classList.add('active-target');
    }

    for (let c = 0; c < 9; c++) {
      const cell = document.createElement('button');
      cell.className = 'cell-ultimate';
      const val = ultimateCells[b][c];
      cell.textContent = val;
      if (val === 'X') cell.style.color = 'var(--x-color)';
      if (val === 'O') cell.style.color = 'var(--o-color)';

      const isSubPlayable = !ultimateMacro[b] && (activeSubBoard === -1 || activeSubBoard === b);
      cell.disabled = isGameOver || Boolean(val) || !isSubPlayable;

      cell.addEventListener('click', () => handleUltimateMove(b, c));
      sub.appendChild(cell);
    }
    uGrid.appendChild(sub);
  }
  boardMount.appendChild(uGrid);
  updateAICommentary();
}

function handleUltimateMove(boardIdx, cellIdx) {
  initAudio();
  if (isGameOver || ultimateCells[boardIdx][cellIdx]) return;

  // Record move
  ultimateCells[boardIdx][cellIdx] = currentTurn;
  moveHistory.push({ boardIdx, cellIdx, player: currentTurn, prevActiveSub: activeSubBoard, prevMacroWon: ultimateMacro[boardIdx] });

  if (currentTurn === 'X') sfx.clickX(); else sfx.clickO();

  // Check if sub-board was won
  const subResult = check3x3Winner(ultimateCells[boardIdx]);
  if (subResult && subResult !== 'draw') {
    ultimateMacro[boardIdx] = subResult;
    sfx.macroClaim();
    spawnCelebration();
  } else if (subResult === 'draw') {
    ultimateMacro[boardIdx] = 'D';
  }

  // Next target board
  if (ultimateMacro[cellIdx] || ultimateCells[cellIdx].every(Boolean)) {
    activeSubBoard = -1; // Any open board
  } else {
    activeSubBoard = cellIdx;
  }

  // Check Macro Winner
  const macroWin = check3x3Winner(ultimateMacro.map(v => v === 'D' ? '' : v));
  if (macroWin) {
    handleEndGame(macroWin);
    renderUltimateBoard();
    return;
  }

  // Switch Turn
  if (diffSelect.value === 'pvp') {
    currentTurn = currentTurn === 'X' ? 'O' : 'X';
    renderUltimateBoard();
  } else {
    currentTurn = 'O';
    renderUltimateBoard();
    setTimeout(executeUltimateAI, 350);
  }
}

function executeUltimateAI() {
  if (isGameOver) return;
  // Determine playable boards
  let playableBoards = [];
  if (activeSubBoard !== -1 && !ultimateMacro[activeSubBoard]) {
    playableBoards = [activeSubBoard];
  } else {
    for (let i = 0; i < 9; i++) {
      if (!ultimateMacro[i] && !ultimateCells[i].every(Boolean)) playableBoards.push(i);
    }
  }

  if (!playableBoards.length) return;

  // Pick best move
  let chosenBoard = playableBoards[Math.floor(Math.random() * playableBoards.length)];
  let openCells = [];
  for (let c = 0; c < 9; c++) {
    if (!ultimateCells[chosenBoard][c]) openCells.push(c);
  }
  let chosenCell = openCells[Math.floor(Math.random() * openCells.length)];

  // Strategic check: win or block in chosen board
  for (const c of openCells) {
    const test = [...ultimateCells[chosenBoard]];
    test[c] = 'O';
    if (check3x3Winner(test) === 'O') { chosenCell = c; break; }
  }

  handleUltimateMove(chosenBoard, chosenCell);
  currentTurn = 'X';
  renderUltimateBoard();
}

/* ==========================================================================
   RENDER CLASSIC 3x3 PRO BOARD
   ========================================================================== */
let classicCells = Array(9).fill('');

function renderClassicBoard() {
  boardMount.innerHTML = '';
  laserLine.classList.remove('show');

  const cGrid = document.createElement('div');
  cGrid.className = 'classic-grid';

  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('button');
    cell.className = 'cell-classic';
    const val = classicCells[i];
    cell.disabled = isGameOver || Boolean(val);

    if (val === 'X') {
      cell.innerHTML = `
        <svg class="mark-svg" viewBox="0 0 50 50">
          <line class="stroke-x" x1="10" y1="10" x2="40" y2="40" />
          <line class="stroke-x stroke-x-2" x1="40" y1="10" x2="10" y2="40" />
        </svg>
      `;
    } else if (val === 'O') {
      cell.innerHTML = `
        <svg class="mark-svg" viewBox="0 0 50 50">
          <circle class="stroke-o" cx="25" cy="25" r="17" />
        </svg>
      `;
    }

    cell.addEventListener('click', () => handleClassicMove(i));
    cGrid.appendChild(cell);
  }
  boardMount.appendChild(cGrid);
  updateClassicEval();
}

function handleClassicMove(idx) {
  initAudio();
  if (isGameOver || classicCells[idx]) return;

  classicCells[idx] = currentTurn;
  moveHistory.push({ idx, player: currentTurn });
  if (currentTurn === 'X') sfx.clickX(); else sfx.clickO();

  const res = check3x3Winner(classicCells);
  if (res) {
    handleEndGame(res);
    renderClassicBoard();
    return;
  }

  if (diffSelect.value === 'pvp') {
    currentTurn = currentTurn === 'X' ? 'O' : 'X';
    renderClassicBoard();
  } else {
    currentTurn = 'O';
    renderClassicBoard();
    setTimeout(executeClassicAI, 320);
  }
}

function executeClassicAI() {
  if (isGameOver) return;
  const bestMove = getMinimaxMove(classicCells);
  classicCells[bestMove] = 'O';
  moveHistory.push({ idx: bestMove, player: 'O' });
  sfx.clickO();

  const res = check3x3Winner(classicCells);
  if (res) {
    handleEndGame(res);
  } else {
    currentTurn = 'X';
  }
  renderClassicBoard();
}

function getMinimaxMove(board) {
  function minimax(b, depth, isMax) {
    const res = check3x3Winner(b);
    if (res === 'O') return 10 - depth;
    if (res === 'X') return depth - 10;
    if (res === 'draw') return 0;

    const open = b.map((v, i) => v ? null : i).filter(v => v !== null);
    if (isMax) {
      let maxScore = -Infinity;
      for (const i of open) {
        b[i] = 'O';
        maxScore = Math.max(maxScore, minimax(b, depth + 1, false));
        b[i] = '';
      }
      return maxScore;
    } else {
      let minScore = Infinity;
      for (const i of open) {
        b[i] = 'X';
        minScore = Math.min(minScore, minimax(b, depth + 1, true));
        b[i] = '';
      }
      return minScore;
    }
  }

  const open = board.map((v, i) => v ? null : i).filter(v => v !== null);
  let bestScore = -Infinity;
  let bestIdx = open[0];

  for (const i of open) {
    board[i] = 'O';
    const score = minimax(board, 0, false);
    board[i] = '';
    if (score > bestScore) {
      bestScore = score;
      bestIdx = i;
    }
  }
  return bestIdx;
}

function updateClassicEval() {
  const openCount = classicCells.filter(v => !v).length;
  let evalVal = (openCount % 2 === 0 ? -0.8 : 0.8);
  evalScore.textContent = evalVal > 0 ? `X +${evalVal.toFixed(1)}` : `O ${evalVal.toFixed(1)}`;
  evalBarX.style.width = `${50 + evalVal * 12}%`;
  evalBarO.style.width = `${50 - evalVal * 12}%`;
}

function updateAICommentary() {
  const quotes = [
    "Analyzing your quadrant placement...",
    "Controlling the center macro-square is vital.",
    "A sharp maneuver. Let's see your defense.",
    "The quantum grid branches into 8,100 possibilities."
  ];
  aiBubble.innerHTML = `<span>CYBER-AI:</span> ${quotes[Math.floor(Math.random() * quotes.length)]}`;
}

function handleEndGame(res) {
  isGameOver = true;
  if (res === 'draw') {
    scores.draw++;
    scoreDraw.textContent = scores.draw;
    aiBubble.innerHTML = `<span>MATCH END:</span> A hard-fought strategic stalemate!`;
    evalScore.textContent = `DRAW 0.0`;
  } else {
    scores[res]++;
    scoreX.textContent = scores.X;
    scoreO.textContent = scores.O;
    aiBubble.innerHTML = `<span>VICTORY:</span> <b>${res}</b> claims ultimate dominance!`;
    evalScore.textContent = res === 'X' ? 'X WINS +10.0' : 'O WINS +10.0';
    sfx.win();
    spawnCelebration();
  }
}

/* ==========================================================================
   HINTS, UNDO & CONTROLS
   ========================================================================== */
hintBtn.addEventListener('click', () => {
  initAudio();
  if (isGameOver) return;
  if (activeGameMode === 'classic') {
    const best = getMinimaxMove(classicCells);
    const cellsDom = boardMount.querySelectorAll('.cell-classic');
    if (cellsDom[best]) {
      cellsDom[best].classList.add('hint');
      setTimeout(() => cellsDom[best].classList.remove('hint'), 1200);
      sfx.clickX();
    }
  } else {
    aiBubble.innerHTML = `<span>HINT:</span> Claim the center of the active board to dominate!`;
  }
});

undoBtn.addEventListener('click', () => {
  initAudio();
  if (!moveHistory.length) return;
  if (activeGameMode === 'classic') {
    const last = moveHistory.pop();
    classicCells[last.idx] = '';
    if (diffSelect.value !== 'pvp' && moveHistory.length) {
      const lastAI = moveHistory.pop();
      classicCells[lastAI.idx] = '';
    }
    isGameOver = false;
    currentTurn = 'X';
    renderClassicBoard();
  } else {
    const last = moveHistory.pop();
    ultimateCells[last.boardIdx][last.cellIdx] = '';
    ultimateMacro[last.boardIdx] = last.prevMacroWon;
    activeSubBoard = last.prevActiveSub;
    isGameOver = false;
    currentTurn = 'X';
    renderUltimateBoard();
  }
});

resetBtn.addEventListener('click', () => {
  initAudio();
  isGameOver = false;
  currentTurn = 'X';
  moveHistory = [];
  if (activeGameMode === 'ultimate') {
    ultimateMacro = Array(9).fill('');
    ultimateCells = Array(9).fill(null).map(() => Array(9).fill(''));
    activeSubBoard = -1;
    renderUltimateBoard();
  } else {
    classicCells = Array(9).fill('');
    renderClassicBoard();
  }
});

// Mode switch tabs
document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    initAudio();
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeGameMode = tab.dataset.mode;
    resetBtn.click();
  });
});

soundBtn.addEventListener('click', () => {
  initAudio();
  soundEnabled = !soundEnabled;
  soundBtn.textContent = soundEnabled ? '🔊 Sound' : '🔇 Muted';
});

/* ==========================================================================
   PARTICLES & CONFETTI ENGINE
   ========================================================================== */
const pCanvas = document.getElementById('bg-canvas');
const pCtx = pCanvas.getContext('2d');
let pW = (pCanvas.width = window.innerWidth);
let pH = (pCanvas.height = window.innerHeight);

window.addEventListener('resize', () => {
  pW = pCanvas.width = window.innerWidth;
  pH = pCanvas.height = window.innerHeight;
});

let particles = [];

function spawnCelebration() {
  const colors = ['#ff4772', '#00f0ff', '#ffb703', '#8b5cf6', '#fff'];
  for (let i = 0; i < 65; i++) {
    particles.push({
      x: pW * 0.5 + (Math.random() - 0.5) * 80,
      y: pH * 0.45,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8 - 3,
      size: Math.random() * 5 + 2.5,
      col: colors[Math.floor(Math.random() * colors.length)],
      life: 1.0, decay: Math.random() * 0.02 + 0.015
    });
  }
}

function renderParticles() {
  pCtx.clearRect(0, 0, pW, pH);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.07;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    pCtx.save();
    pCtx.globalAlpha = p.life;
    pCtx.fillStyle = p.col;
    pCtx.shadowColor = p.col;
    pCtx.shadowBlur = 8;
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    pCtx.fill();
    pCtx.restore();
  }
  requestAnimationFrame(renderParticles);
}

// Boot
renderUltimateBoard();
requestAnimationFrame(renderParticles);
</script>
