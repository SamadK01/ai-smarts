<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic Tac Toe — AI Smarts</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Funnel+Display:wght@700;800&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#292451,#0a0b13 68%);color:#f1eee8;font-family:Arial}.home{position:fixed;top:20px;left:22px;color:#f1eee8;text-decoration:none;font:11px 'DM Mono',monospace}.home:before{content:'← ';color:#bca7ff}.game{width:min(92vw,520px);text-align:center}.eyebrow,.score,button{font:11px 'DM Mono',monospace}.eyebrow{color:#bca7ff;letter-spacing:.14em}.game h1{font:800 clamp(48px,8vw,85px)/.85 'Funnel Display',sans-serif;letter-spacing:-.08em;margin:14px 0 14px}.game h1 em{font-style:normal;color:#bca7ff}.status{height:24px;color:#bfc1cb;font-size:14px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(82vw,380px);margin:24px auto}.cell{aspect-ratio:1;border:1px solid #ffffff1c;border-radius:8px;background:#ffffff09;color:#f1eee8;font:800 clamp(45px,9vw,80px)/1 'Funnel Display',sans-serif;cursor:pointer;transition:.18s}.cell:hover:not(:disabled){background:#ffffff18}.cell:focus-visible{outline:2px solid #bca7ff;outline-offset:2px}.cell.x{color:#ff9a81}.cell.o{color:#aee7e0}.cell.win{background:#bca7ff2b;box-shadow:0 0 24px #bca7ff3d}.controls{display:flex;justify-content:center;gap:9px}.controls button{border:1px solid #ffffff2b;border-radius:99px;padding:10px 13px;background:#ffffff0d;color:#ece9e2;cursor:pointer}.controls button.active{border-color:#bca7ff;background:#bca7ff;color:#161226}.score{display:flex;justify-content:center;gap:18px;color:#9ea1ac;margin-top:25px}.score b{color:#f1eee8;font-weight:400}@media(max-width:600px){.home{top:15px;left:15px}.game{padding:0 14px}.board{margin:20px auto}}</style></head><body><a class="home" href="index.html">all experiments</a><main class="game"><p class="eyebrow">CLASSIC / 005</p><h1>Tic Tac <em>Toe.</em></h1><p class="status" id="status" aria-live="polite">Your turn — choose a square</p><div class="board" id="board" role="grid" aria-label="Tic Tac Toe board"></div><div class="controls"><button id="easy" type="button">easy AI</button><button id="hard" class="active" type="button">smart AI</button><button id="reset" type="button">new round</button></div><div class="score"><span>you <b id="you">0</b></span><span>draw <b id="draw">0</b></span><span>AI <b id="ai">0</b></span></div></main><script>const board=document.querySelector('#board'),status=document.querySelector('#status'),you=document.querySelector('#you'),ai=document.querySelector('#ai'),draw=document.querySelector('#draw');let cells=Array(9).fill(''),busy=false,hard=true,scores={you:0,ai:0,draw:0};const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function winner(a){for(const w of wins)if(a[w[0]]&&a[w[0]]===a[w[1]]&&a[w[1]]===a[w[2]])return[a[w[0]],w];return a.every(Boolean)?['draw',[]]:null}function paint(){board.innerHTML='';cells.forEach((v,i)=>{let b=document.createElement('button');b.className=`cell ${v==='X'?'x':v==='O'?'o':''}`;b.textContent=v;b.disabled=!!v||busy;b.setAttribute('role','gridcell');b.setAttribute('aria-label',`row ${Math.floor(i/3)+1}, column ${i%3+1}${v?', '+v:''}`);b.onclick=()=>move(i);board.append(b)});let w=winner(cells);if(w&&w[1].length)w[1].forEach(i=>board.children[i].classList.add('win'))}function finish(w){busy=true;if(w[0]==='X'){scores.you++;status.textContent='You win!'}else if(w[0]==='O'){scores.ai++;status.textContent='AI wins!'}else{scores.draw++;status.textContent='A draw — nice game.'}you.textContent=scores.you;ai.textContent=scores.ai;draw.textContent=scores.draw;paint()}function move(i){if(busy||cells[i])return;cells[i]='X';let w=winner(cells);paint();if(w)return finish(w);busy=true;status.textContent='AI is thinking…';setTimeout(()=>{let empty=cells.map((v,i)=>v?'':i).filter(v=>v!==''),pick=hard?best(cells,'O').i:empty[Math.floor(Math.random()*empty.length)];cells[pick]='O';busy=false;w=winner(cells);paint();if(w)finish(w);else status.textContent='Your turn — choose a square'},360)}function best(a,player){let w=winner(a);if(w)return{score:w[0]==='O'?10:w[0]==='X'?-10:0};let open=a.map((v,i)=>v?'':i).filter(v=>v!==''),res=[];for(let i of open){a[i]=player;let q=best(a,player==='O'?'X':'O');res.push({i,score:q.score});a[i]=''}return player==='O'?res.reduce((p,q)=>q.score>p.score?q:p):res.reduce((p,q)=>q.score<p.score?q:p)}function reset(){cells=Array(9).fill('');busy=false;status.textContent='Your turn — choose a square';paint()}document.querySelector('#reset').onclick=reset;document.querySelector('#easy').onclick=()=>{hard=false;document.querySelector('#easy').classList.add('active');document.querySelector('#hard').classList.remove('active');reset()};document.querySelector('#hard').onclick=()=>{hard=true;document.querySelector('#hard').classList.add('active');document.querySelector('#easy').classList.remove('active');reset()};paint();</script></body></html>
