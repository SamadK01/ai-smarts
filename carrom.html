<style>
  :root {
    --bg: #07090f;
    --board: #f1dfbe;
    --border-wood: #2c1208;
    --gold: #ffbe3b;
    --amber: #e69224;
    --text: #f0f4f8;
    --muted: rgba(240, 244, 248, 0.55);
    --panel: rgba(12, 16, 26, 0.88);
    --border: rgba(230, 184, 74, 0.28);
    --mono: "Geist Mono", ui-monospace, monospace;
    --display: "Funnel Display", sans-serif;
    --body: "Bricolage Grotesque", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: var(--body); touch-action: none;
  }

  #canvas-container {
    position: fixed; inset: 0; width: 100%; height: 100%;
    cursor: grab; z-index: 1;
  }
  #canvas-container:active { cursor: grabbing; }

  /* TOP HUD */
  .hud-top {
    position: fixed; top: 16px; left: 20px; right: 20px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 30; pointer-events: none;
  }
  .hud-top > * { pointer-events: auto; }

  .brand-group { display: flex; align-items: center; gap: 12px; }
  .home-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--border);
    padding: 8px 16px; border-radius: 999px; color: var(--text);
    text-decoration: none; font: 600 13px/1 var(--body);
    backdrop-filter: blur(16px); transition: all 0.2s;
  }
  .home-btn:hover { border-color: var(--gold); color: #fff; transform: translateY(-1px); }
  .home-btn span { color: var(--gold); font-weight: 700; }

  .club-tag {
    background: var(--panel); border: 1px solid var(--border);
    padding: 7px 16px; border-radius: 999px; backdrop-filter: blur(16px);
    display: flex; align-items: center; gap: 8px; font: 500 11px/1 var(--mono); color: var(--muted);
  }
  .club-tag b { color: var(--gold); font-weight: 700; }

  /* GAME MODE TABS */
  .mode-tabs {
    display: flex; gap: 6px; background: var(--panel);
    border: 1px solid var(--border); padding: 5px; border-radius: 999px;
    backdrop-filter: blur(16px);
  }
  .mode-tab {
    background: transparent; border: 0; color: var(--muted);
    font: 600 11px/1 var(--body); padding: 7px 15px; border-radius: 999px;
    cursor: pointer; transition: all 0.2s;
  }
  .mode-tab:hover { color: #fff; }
  .mode-tab.active {
    background: linear-gradient(135deg, rgba(230, 184, 74, 0.3), rgba(198, 146, 40, 0.15));
    border: 1px solid var(--gold); color: #fff; box-shadow: 0 0 14px rgba(230, 184, 74, 0.3);
  }

  /* TOP MATCH SCOREBOARD */
  .score-banner {
    position: fixed; top: 76px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border);
    padding: 8px 22px; border-radius: 999px; backdrop-filter: blur(16px);
    display: flex; align-items: center; gap: 18px; z-index: 25;
    font: 600 12px/1 var(--mono); box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  .score-val { color: var(--gold); font-weight: 700; font-size: 14px; }
  .pieces-summary { display: flex; align-items: center; gap: 12px; }
  .piece-pill { display: flex; align-items: center; gap: 5px; font-size: 11px; }
  .p-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .p-white { background: #fdfaf2; border: 1px solid #999; }
  .p-black { background: #1c1917; border: 1px solid #444; }
  .p-queen { background: #dc2626; border: 1px solid #ffd700; box-shadow: 0 0 6px #dc2626; }

  /* BOTTOM STRIKER POSITIONING SLIDER */
  .baseline-dock {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border);
    padding: 8px 22px; border-radius: 999px; backdrop-filter: blur(16px);
    display: flex; align-items: center; gap: 14px; z-index: 30;
    box-shadow: 0 12px 30px rgba(0,0,0,0.6); font: 600 11px/1 var(--mono);
  }
  .baseline-slider {
    -webkit-appearance: none; width: 180px; height: 6px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.15); outline: none; cursor: pointer;
  }
  .baseline-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
    background: #ffffff; border: 2px solid var(--gold);
    box-shadow: 0 0 10px var(--gold); cursor: pointer;
    transition: transform 0.1s;
  }
  .baseline-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }

  /* BOTTOM CONTROLS DOCK */
  .bottom-dock {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border);
    padding: 10px 22px; border-radius: 999px; backdrop-filter: blur(20px);
    display: flex; align-items: center; gap: 14px; z-index: 30;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);

  .powder-btn {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff; padding: 9px 16px; border-radius: 999px;
    font: 600 11px/1 var(--mono); cursor: pointer;
    display: flex; align-items: center; gap: 6px; transition: all 0.2s;
  }
  .powder-btn:hover { border-color: #fff; background: rgba(255, 255, 255, 0.25); }

  .tool-btn {
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 8px 14px; border-radius: 999px; color: var(--text);
    font: 600 11px/1 var(--body); cursor: pointer;
    display: flex; align-items: center; gap: 6px; transition: all 0.2s;
  }
  .tool-btn:hover { background: rgba(255, 255, 255, 0.14); border-color: var(--gold); color: #fff; }

  /* CAMERA VIEW PRESETS */
  .view-presets {
    position: fixed; bottom: 84px; left: 24px;
    display: flex; flex-direction: column; gap: 6px; z-index: 30;
  }
  .cam-btn {
    background: var(--panel); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 999px; color: var(--muted);
    font: 600 11px/1 var(--body); cursor: pointer; backdrop-filter: blur(16px);
    transition: all 0.2s; text-align: left; display: flex; align-items: center; gap: 6px;
  }
  .cam-btn:hover { color: #fff; border-color: var(--gold); }
  .cam-btn.active { background: rgba(230, 184, 74, 0.25); border-color: var(--gold); color: #fff; }

  /* TOAST */
  .toast {
    position: fixed; top: 125px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: rgba(12, 16, 26, 0.96); border: 1px solid var(--gold);
    color: #fff; padding: 10px 24px; border-radius: 999px;
    font: 700 13px/1 var(--mono); backdrop-filter: blur(16px);
    opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 40; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ONBOARDING SLINGSHOT HINT */
  .slingshot-hint {
    position: fixed; bottom: 140px; left: 50%; transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.65); border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 6px 18px; border-radius: 999px; pointer-events: none;
    font: 500 11px/1.4 var(--mono); color: var(--muted); backdrop-filter: blur(8px);
    z-index: 25; text-align: center;
  }
  .slingshot-hint b { color: var(--gold); }

  @media (max-width: 860px) {
    .hud-top { flex-direction: column; gap: 8px; align-items: flex-start; }
    .mode-tabs { align-self: center; }
    .baseline-dock { bottom: 76px; padding: 6px 16px; }
    .bottom-dock { width: calc(100% - 32px); padding: 8px 12px; justify-content: space-between; }
    .view-presets { display: none; }
    .baseline-slider { width: 120px; }
    .score-banner { top: 110px; padding: 6px 14px; font-size: 11px; }
  }
</style>

<script>
/* ==========================================================================
   AUTHENTIC PROCEDURAL CARROM ACOUSTICS (WEB AUDIO API)
   - Resonant wooden disk-on-disk clacks (pitch & volume scale with velocity)
   - Solid Sheesham wooden boundary rail rebound thuds
   - Soft talcum powder friction swoosh
   - Corner pocket drop clunks into crochet string nets
   - Queen potted royal fanfare
   ========================================================================== */
class CarromAudio {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }

  // Wooden disk-on-disk strike (Crisp mango wood / sheesham clack)
  woodClack(relVel = 1.0) {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const v = Math.min(2.2, Math.max(0.08, relVel));

    // Sharp high transient snap
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'triangle';
    const pitch = 1450 + Math.random() * 300;
    osc.frequency.setValueAtTime(pitch, now);
    osc.frequency.exponentialRampToValueAtTime(320, now + 0.018);

    const vol = Math.min(0.28, 0.05 + v * 0.12);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.025);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.03);

    // Warm wooden hollow body resonance
    const osc2 = this.ctx.createOscillator();
    const g2 = this.ctx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(620 + Math.random() * 120, now);
    osc2.frequency.exponentialRampToValueAtTime(180, now + 0.04);
    g2.gain.setValueAtTime(vol * 0.8, now);
    g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);
    osc2.connect(g2); g2.connect(this.ctx.destination);
    osc2.start(now); osc2.stop(now + 0.05);
  }

  // Heavy Striker Snap Release
  strikerFlick(power = 1.0) {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(260, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.04);
    g.gain.setValueAtTime(0.15 * power, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.05);
  }

  // Boundary Wood Rail Thud
  railBounce(vel = 1.0) {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(210, now);
    osc.frequency.exponentialRampToValueAtTime(55, now + 0.06);
    const vol = Math.min(0.16, 0.04 + vel * 0.08);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.065);
  }

  // Dropping into Crochet Net Corner Pocket
  pocketDrop() {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    this.woodClack(0.4);
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(125, now + 0.02);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.14);
    g.gain.setValueAtTime(0.18, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(now + 0.02); osc.stop(now + 0.16);
  }

  // Talcum Powder Shaker Sound
  powderShake() {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const dur = 0.25;
    const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * dur), this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(i / d.length * Math.PI);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.setValueAtTime(3200, now); f.Q.value = 2.0;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.06, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(f); f.connect(g); g.connect(this.ctx.destination);
    src.start(now);
  }
}
const sfx = new CarromAudio();
document.body.addEventListener('click', () => sfx.init(), { once: true });

/* ==========================================================================
   PHYSICS CONSTANTS & TALCUM POWDER FRICTION MODEL
   - Board Surface: 20 x 20 units
   - Carrom Men: radius = 0.62 units, mass = 5.5 grams
   - Striker: radius = 0.85 units, mass = 15.0 grams (Heavy acrylic momentum!)
   - Linear friction deceleration: v(t+dt) = max(0, v - a*dt) -> 100% natural glide
   - 4 Corner Pockets: (±8.8, ±8.8) with radius 1.35 units
   ========================================================================== */
const BOARD_SIZE = 20.0;
const HALF_BOARD = 10.0;
const PIECE_R = 0.62;
const STRIKER_R = 0.86;
const PIECE_MASS = 5.5;
const STRIKER_MASS = 15.0;
const RESTITUTION = 0.94;
const RAIL_RESTITUTION = 0.82;
let frictionDecel = 5.2; // Units per second squared (simulates fine boric powder)
const POCKET_RADIUS = 1.38;

const POCKETS = [
  { x: -8.85, y: -8.85 }, // Top-Left
  { x:  8.85, y: -8.85 }, // Top-Right
  { x: -8.85, y:  8.85 }, // Bottom-Left
  { x:  8.85, y:  8.85 }  // Bottom-Right
];

/* ==========================================================================
   BOARD MARKINGS TEXTURE (CENTRAL ROSETTE, BASELINES & CORNER ARROWS)
   ========================================================================== */
function makeCarromBoardTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 1024;
  const ctx = c.getContext('2d');

  // 1. Natural Polished Birch / Mango Plywood Grain Background
  ctx.fillStyle = '#f4e3c3';
  ctx.fillRect(0, 0, 1024, 1024);

  // Subtle wood grain lines
  ctx.fillStyle = 'rgba(210, 180, 140, 0.22)';
  for (let i = 0; i < 1024; i += 6) {
    ctx.fillRect(0, i, 1024, 2);
  }

  ctx.save();
  ctx.translate(512, 512);

  // 2. Central Concentric Rings & Rosette
  // Outer circle
  ctx.strokeStyle = '#222222'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, 160, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 175, 0, Math.PI * 2); ctx.stroke();

  // Center Queen Red Rosette Circle
  ctx.fillStyle = '#dc2626';
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3; ctx.stroke();

  // Decorative Petals around Center
  for (let i = 0; i < 8; i++) {
    const ang = (i * Math.PI) / 4;
    ctx.fillStyle = i % 2 === 0 ? '#1f2937' : '#ea580c';
    ctx.beginPath();
    ctx.arc(Math.cos(ang) * 95, Math.sin(ang) * 95, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#f4e3c3'; ctx.lineWidth = 2; ctx.stroke();
  }

  // 3. 4 Baselines with Red End Circles
  const baselineDist = 360;
  const baselineLen = 290;
  for (let side = 0; side < 4; side++) {
    ctx.save();
    ctx.rotate((side * Math.PI) / 2);

    // Double Baseline
    ctx.strokeStyle = '#111827'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-baselineLen, baselineDist - 18);
    ctx.lineTo( baselineLen, baselineDist - 18);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-baselineLen, baselineDist + 18);
    ctx.lineTo( baselineLen, baselineDist + 18);
    ctx.stroke();

    // Red End Spot Circles
    [-baselineLen, baselineLen].forEach(x => {
      ctx.fillStyle = '#dc2626';
      ctx.beginPath(); ctx.arc(x, baselineDist, 18, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#111827'; ctx.lineWidth = 2; ctx.stroke();
    });

    // 45-Degree Foul / Arrow Lines pointing to pockets
    ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(baselineLen, baselineDist);
    ctx.lineTo(440, 440);
    ctx.stroke();

    ctx.restore();
  }

  ctx.restore();
  return new THREE.CanvasTexture(c);
}

/* ==========================================================================
   CARROM PIECE CLASS (WHITE, BLACK, QUEEN, STRIKER)
   ========================================================================== */
class CarromPiece {
  constructor(type, x, y) {
    this.type = type; // 'white' | 'black' | 'queen' | 'striker'
    this.pos = new THREE.Vector2(x, y);
    this.vel = new THREE.Vector2(0, 0);
    this.isPotted = false;
    this.dropAnim = 0;

    this.r = type === 'striker' ? STRIKER_R : PIECE_R;
    this.mass = type === 'striker' ? STRIKER_MASS : PIECE_MASS;
    this.points = type === 'white' ? 20 : (type === 'black' ? 10 : (type === 'queen' ? 50 : 0));

    // 3D Visual Mesh
    const h = type === 'striker' ? 0.38 : 0.32;
    const geo = new THREE.CylinderGeometry(this.r, this.r, h, 28);
    let color = 0xfcf7ea;
    let roughness = 0.4;
    let metalness = 0.05;

    if (type === 'black') {
      color = 0x1c1917;
      roughness = 0.5;
    } else if (type === 'queen') {
      color = 0xdc2626;
      roughness = 0.25;
      metalness = 0.2;
    } else if (type === 'striker') {
      color = 0xffffff;
      roughness = 0.15;
      metalness = 0.1;
    }

    const mat = new THREE.MeshStandardMaterial({ color, roughness, metalness });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.castShadow = true;
    this.mesh.receiveShadow = true;
    this.mesh.position.set(x, h * 0.5, y);

    // Decorative center ring on top of coins
    if (type === 'striker') {
      const gem = new THREE.Mesh(new THREE.CylinderGeometry(this.r * 0.4, this.r * 0.4, h + 0.02, 16),
        new THREE.MeshStandardMaterial({ color: 0x059669, roughness: 0.2, metalness: 0.5 }));
      this.mesh.add(gem);
    } else {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(this.r * 0.5, 0.04, 8, 20),
        new THREE.MeshBasicMaterial({ color: type === 'black' ? 0x444444 : (type === 'queen' ? 0xffd700 : 0xccbba5) }));
      ring.rotation.x = Math.PI / 2;
      ring.position.y = h * 0.5 + 0.002;
      this.mesh.add(ring);
    }

    // Contact drop shadow
    const sGeo = new THREE.CircleGeometry(this.r * 1.15, 20);
    const sMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.4, depthWrite: false });
    this.shadow = new THREE.Mesh(sGeo, sMat);
    this.shadow.rotation.x = -Math.PI / 2;
    this.shadow.position.set(x, 0.005, y);

    scene.add(this.mesh);
    scene.add(this.shadow);
  }

  updateVisuals() {
    if (this.isPotted) {
      if (this.dropAnim < 1.0) {
        this.dropAnim += 0.09;
        this.mesh.position.y = 0.16 - this.dropAnim * 1.6;
        this.mesh.scale.setScalar(Math.max(0.1, 1 - this.dropAnim * 0.5));
        this.shadow.material.opacity = Math.max(0, 0.4 * (1 - this.dropAnim));
      } else {
        this.mesh.visible = false;
        this.shadow.visible = false;
      }
      return;
    }

    this.mesh.position.x = this.pos.x;
    this.mesh.position.z = this.pos.y;
    this.shadow.position.x = this.pos.x;
    this.shadow.position.z = this.pos.y;
  }

  reset(x, y) {
    this.pos.set(x, y);
    this.vel.set(0, 0);
    this.isPotted = false;
    this.dropAnim = 0;
    this.mesh.position.set(x, 0.16, y);
    this.mesh.scale.set(1, 1, 1);
    this.mesh.visible = true;
    this.shadow.visible = true;
    this.shadow.material.opacity = 0.4;
  }
}

/* ==========================================================================
   THREE.JS 3D ENVIRONMENT SETUP
   ========================================================================== */
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color('#07090f');
scene.fog = new THREE.FogExp2('#07090f', 0.012);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 28, 0.001); // Default Overhead
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
container.appendChild(renderer.domElement);

// Lighting: Warm Room Chandelier & Soft Shadows
const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
scene.add(ambientLight);

const hemiLight = new THREE.HemisphereLight(0xfff7ed, 0x1c2438, 1.6);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xfff3da, 2.4);
dirLight.position.set(8, 22, 12);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048; dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.bias = -0.0001;
scene.add(dirLight);

// Floor & Room
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0x0c0f18, roughness: 0.7, metalness: 0.1 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -6.0;
floor.receiveShadow = true; scene.add(floor);

/* ==========================================================================
   3D CARROM BOARD & CORNER RECESSED DROP POCKETS
   ========================================================================== */
const boardGroup = new THREE.Group();
scene.add(boardGroup);

const woodBorderMat = new THREE.MeshStandardMaterial({ color: 0x241108, roughness: 0.35, metalness: 0.15 });
const brassCornerMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.25, metalness: 0.85 });
const pocketNetMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });

// 1. Smooth Plywood Bed
const boardTex = makeCarromBoardTexture();
const boardBed = new THREE.Mesh(new THREE.PlaneGeometry(BOARD_SIZE, BOARD_SIZE),
  new THREE.MeshStandardMaterial({ map: boardTex, roughness: 0.25, metalness: 0.05 }));
boardBed.rotation.x = -Math.PI / 2; boardBed.receiveShadow = true;
boardGroup.add(boardBed);

// 2. 4 Corner Crochet Pocket Net Drop Holes
POCKETS.forEach(p => {
  // Deep net well recessed below board
  const well = new THREE.Mesh(new THREE.CylinderGeometry(POCKET_RADIUS, POCKET_RADIUS * 0.8, 1.4, 24, 1, true), pocketNetMat);
  well.position.set(p.x, -0.7, p.y);
  boardGroup.add(well);

  const bottom = new THREE.Mesh(new THREE.CircleGeometry(POCKET_RADIUS * 0.8, 24), pocketNetMat);
  bottom.rotation.x = Math.PI / 2; bottom.position.set(p.x, -1.4, p.y);
  boardGroup.add(bottom);
});

// 3. Thick Solid Rosewood Border Rails (4 Sides)
const borderThickness = 2.2;
const borderH = 0.9;
const outerSize = BOARD_SIZE + borderThickness * 2;

// Top/Bottom Rails
const railTBGeo = new THREE.BoxGeometry(outerSize, borderH, borderThickness);
const railT = new THREE.Mesh(railTBGeo, woodBorderMat);
railT.position.set(0, borderH * 0.5, -HALF_BOARD - borderThickness * 0.5);
railT.castShadow = true; railT.receiveShadow = true; boardGroup.add(railT);

const railB = new THREE.Mesh(railTBGeo, woodBorderMat);
railB.position.set(0, borderH * 0.5, HALF_BOARD + borderThickness * 0.5);
railB.castShadow = true; railB.receiveShadow = true; boardGroup.add(railB);

// Left/Right Rails
const railLRGeo = new THREE.BoxGeometry(borderThickness, borderH, BOARD_SIZE);
const railL = new THREE.Mesh(railLRGeo, woodBorderMat);
railL.position.set(-HALF_BOARD - borderThickness * 0.5, borderH * 0.5, 0);
railL.castShadow = true; railL.receiveShadow = true; boardGroup.add(railL);

const railR = new THREE.Mesh(railLRGeo, woodBorderMat);
railR.position.set(HALF_BOARD + borderThickness * 0.5, borderH * 0.5, 0);
railR.castShadow = true; railR.receiveShadow = true; boardGroup.add(railR);

// Polished Brass Corner Reinforcements
[
  [-HALF_BOARD - borderThickness * 0.5, -HALF_BOARD - borderThickness * 0.5],
  [ HALF_BOARD + borderThickness * 0.5, -HALF_BOARD - borderThickness * 0.5],
  [-HALF_BOARD - borderThickness * 0.5,  HALF_BOARD + borderThickness * 0.5],
  [ HALF_BOARD + borderThickness * 0.5,  HALF_BOARD + borderThickness * 0.5]
].forEach(pos => {
  const cap = new THREE.Mesh(new THREE.BoxGeometry(borderThickness * 1.05, borderH + 0.02, borderThickness * 1.05), brassCornerMat);
  cap.position.set(pos[0], borderH * 0.5, pos[1]);
  boardGroup.add(cap);
});

// Sturdy Turned Wood Table Legs
const legGeo = new THREE.CylinderGeometry(0.85, 0.6, 6.0, 16);
[
  [-HALF_BOARD - 0.5, -HALF_BOARD - 0.5], [HALF_BOARD + 0.5, -HALF_BOARD - 0.5],
  [-HALF_BOARD - 0.5,  HALF_BOARD + 0.5], [HALF_BOARD + 0.5,  HALF_BOARD + 0.5]
].forEach(pos => {
  const leg = new THREE.Mesh(legGeo, woodBorderMat);
  leg.position.set(pos[0], -3.0, pos[1]);
  boardGroup.add(leg);
});

/* ==========================================================================
   SLINGSHOT TENSION & TRAJECTORY GUIDE LINES (TACTILE LIKE LAMP.HTML)
   ========================================================================== */
// Trajectory Aiming Line (Projects forward from striker)
const aimGeo = new THREE.BufferGeometry();
const aimPos = new Float32Array(6);
aimGeo.setAttribute('position', new THREE.BufferAttribute(aimPos, 3));
const aimLine = new THREE.Line(aimGeo, new THREE.LineBasicMaterial({ color: 0x00f0ff, linewidth: 2 }));
scene.add(aimLine);

// Slingshot Tension Rubber Band Line (Pulls backward from striker)
const pullGeo = new THREE.BufferGeometry();
const pullPos = new Float32Array(6);
pullGeo.setAttribute('position', new THREE.BufferAttribute(pullPos, 3));
const pullLine = new THREE.Line(pullGeo, new THREE.LineBasicMaterial({ color: 0xff4757, linewidth: 3 }));
scene.add(pullLine);

/* ==========================================================================
   GAME STATE & RACKING (19 PIECES: 9 WHITE, 9 BLACK, 1 QUEEN + STRIKER)
   ========================================================================== */
let pieces = [];
let striker = null;
let currentScore = 0;
let whiteRemaining = 9;
let blackRemaining = 9;
let queenPotted = false;
let currentCamMode = 'overhead'; // 'overhead' | 'player' | 'orbit'
let currentGameMode = 'points';   // 'points' | 'zen' | 'trick'

// Striker Slingshot Dragging State
let isDraggingStriker = false;
let dragStart = new THREE.Vector2();
let dragCurrent = new THREE.Vector2();

function rackCarrom(mode = 'points') {
  currentGameMode = mode;
  // Clear old pieces
  pieces.forEach(p => {
    scene.remove(p.mesh);
    scene.remove(p.shadow);
  });
  pieces = [];
  currentScore = 0;
  whiteRemaining = 9;
  blackRemaining = 9;
  queenPotted = false;
  document.getElementById('score-val').textContent = '0 pts';
  document.getElementById('white-count').textContent = '9';
  document.getElementById('black-count').textContent = '9';
  document.getElementById('queen-status').textContent = 'Center';

  // 1. Red Queen in Exact Center
  pieces.push(new CarromPiece('queen', 0, 0));

  // 2. Inner Ring: 6 Pieces alternating White & Black around Queen
  const innerR = PIECE_R * 2.05;
  for (let i = 0; i < 6; i++) {
    const ang = (i * Math.PI) / 3;
    const type = i % 2 === 0 ? 'white' : 'black';
    pieces.push(new CarromPiece(type, Math.cos(ang) * innerR, Math.sin(ang) * innerR));
  }

  // 3. Outer Ring: 12 Pieces alternating
  const outerR = PIECE_R * 4.08;
  const outerPattern = [
    'white', 'white', 'black', 'white', 'black', 'black',
    'white', 'white', 'black', 'white', 'black', 'black'
  ];
  for (let i = 0; i < 12; i++) {
    const ang = (i * Math.PI) / 6 + Math.PI / 12;
    pieces.push(new CarromPiece(outerPattern[i], Math.cos(ang) * outerR, Math.sin(ang) * outerR));
  }

  // 4. Create Striker on Baseline (y = 7.0)
  if (striker) {
    scene.remove(striker.mesh);
    scene.remove(striker.shadow);
  }
  const initX = parseFloat(document.getElementById('baseline-slider').value) || 0;
  striker = new CarromPiece('striker', initX, 7.0);

  aimLine.visible = false;
  pullLine.visible = false;
  showToast(mode === 'points' ? '👑 Carrom Board Racked! Aim & Pull to Shoot' : `Game Mode: ${mode.toUpperCase()}`);
}

/* ==========================================================================
   2D DISK-DISK ELASTIC PHYSICS ENGINE & TALCUM POWDER DECELERATION
   ========================================================================== */
function updatePhysics(dt) {
  const allDisks = [...pieces, striker].filter(d => d && !d.isPotted);
  const SUB_STEPS = 8;
  const subDt = dt / SUB_STEPS;

  for (let step = 0; step < SUB_STEPS; step++) {
    // 1. Move & Linear Talcum Powder Friction
    allDisks.forEach(d => {
      d.pos.addScaledVector(d.vel, subDt);
      const speed = d.vel.length();
      if (speed > 0) {
        // Natural linear friction: v = max(0, v - a*dt)
        const newSpeed = Math.max(0, speed - frictionDecel * subDt);
        d.vel.multiplyScalar(newSpeed / speed);
      }

      // Check Corner Pockets
      POCKETS.forEach(p => {
        const dx = d.pos.x - p.x;
        const dy = d.pos.y - p.y;
        if (dx * dx + dy * dy < POCKET_RADIUS * POCKET_RADIUS) {
          d.isPotted = true;
          d.vel.set(0, 0);
          sfx.pocketDrop();

          if (d === striker) {
            showToast('⚠️ Foul! Striker Potted (-10 pts penalty)');
            currentScore = Math.max(0, currentScore - 10);
            document.getElementById('score-val').textContent = `${currentScore} pts`;
            setTimeout(() => {
              const sliderX = parseFloat(document.getElementById('baseline-slider').value) || 0;
              striker.reset(sliderX, 7.0);
            }, 1000);
          } else {
            currentScore += d.points;
            document.getElementById('score-val').textContent = `${currentScore} pts`;

            if (d.type === 'white') {
              whiteRemaining--;
              document.getElementById('white-count').textContent = `${whiteRemaining}`;
              showToast('✨ White Potted (+20 pts)!');
            } else if (d.type === 'black') {
              blackRemaining--;
              document.getElementById('black-count').textContent = `${blackRemaining}`;
              showToast('✨ Black Potted (+10 pts)!');
            } else if (d.type === 'queen') {
              queenPotted = true;
              document.getElementById('queen-status').textContent = 'Potted 👑';
              showToast('👑 RED QUEEN POTTED (+50 PTS)!');
            }
          }
        }
      });

      // Check Outer Wooden Border Rails (Excluding Pocket Openings)
      const bound = HALF_BOARD - d.r;
      const cornerThreshold = 7.4;

      // Top / Bottom Rails
      if (Math.abs(d.pos.x) < cornerThreshold) {
        if (d.pos.y < -bound) {
          d.pos.y = -bound; d.vel.y = -d.vel.y * RAIL_RESTITUTION;
          sfx.railBounce(d.vel.length());
        } else if (d.pos.y > bound) {
          d.pos.y = bound; d.vel.y = -d.vel.y * RAIL_RESTITUTION;
          sfx.railBounce(d.vel.length());
        }
      }

      // Left / Right Rails
      if (Math.abs(d.pos.y) < cornerThreshold) {
        if (d.pos.x < -bound) {
          d.pos.x = -bound; d.vel.x = -d.vel.x * RAIL_RESTITUTION;
          sfx.railBounce(d.vel.length());
        } else if (d.pos.x > bound) {
          d.pos.x = bound; d.vel.x = -d.vel.x * RAIL_RESTITUTION;
          sfx.railBounce(d.vel.length());
        }
      }
    });

    // 2. Disk-to-Disk Elastic Collisions with Mass Conservation
    for (let i = 0; i < allDisks.length; i++) {
      const d1 = allDisks[i];
      if (d1.isPotted) continue;

      for (let j = i + 1; j < allDisks.length; j++) {
        const d2 = allDisks[j];
        if (d2.isPotted) continue;

        const delta = d2.pos.clone().sub(d1.pos);
        const dist = delta.length();
        const minDist = d1.r + d2.r;

        if (dist < minDist && dist > 0.0001) {
          const normal = delta.clone().divideScalar(dist);

          // Positional overlap resolution weighted by inverse masses
          const overlap = minDist - dist;
          const invM1 = 1 / d1.mass;
          const invM2 = 1 / d2.mass;
          const invSum = invM1 + invM2;

          d1.pos.subScaledVector(normal, overlap * (invM1 / invSum));
          d2.pos.addScaledVector(normal, overlap * (invM2 / invSum));

          // Normal relative velocity
          const vRel = d1.vel.clone().sub(d2.vel);
          const vNorm = vRel.dot(normal);

          if (vNorm > 0) {
            const impulse = (1 + RESTITUTION) * vNorm / invSum;
            d1.vel.subScaledVector(normal, impulse * invM1);
            d2.vel.addScaledVector(normal, impulse * invM2);

            sfx.woodClack(vRel.length());
          }
        }
      }
    }
  }

  // Update visual transforms
  allDisks.forEach(d => d.updateVisuals());
}

function areDisksMoving() {
  const allDisks = [...pieces, striker].filter(d => d && !d.isPotted);
  return allDisks.some(d => d.vel.lengthSq() > 0.0001);
}

/* ==========================================================================
   SLINGSHOT STRIKER PULLBACK & SHOOTING (JUST LIKE LAMP.HTML)
   ========================================================================== */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tablePlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

container.addEventListener('pointerdown', e => {
  if (e.target.closest('header, nav, .mode-tabs, .baseline-dock, .view-presets')) return;
  sfx.init();

  if (areDisksMoving() || !striker || striker.isPotted) return;

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const hitPoint = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(tablePlane, hitPoint)) {
    const distToStriker = Math.sqrt(
      Math.pow(hitPoint.x - striker.pos.x, 2) + Math.pow(hitPoint.z - striker.pos.y, 2)
    );

    // Clicked on or near striker: begin slingshot pull
    if (distToStriker < 2.5) {
      isDraggingStriker = true;
      dragStart.set(striker.pos.x, striker.pos.y);
      dragCurrent.set(hitPoint.x, hitPoint.z);
    }
  }
});

window.addEventListener('pointermove', e => {
  if (!isDraggingStriker) return;
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const hitPoint = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(tablePlane, hitPoint)) {
    dragCurrent.set(hitPoint.x, hitPoint.z);

    // Calculate Pullback Vector (Max tension clamped)
    const pullVec = dragCurrent.clone().sub(dragStart);
    if (pullVec.length() > 6.0) pullVec.setLength(6.0);

    // Forward aim direction is the opposite of the pull!
    const shootDir = pullVec.clone().negate();
    const power = pullVec.length() / 6.0;

    // Draw Tension Rubber Band (Behind striker)
    const pPos = pullGeo.attributes.position;
    pPos.setXYZ(0, striker.pos.x, 0.2, striker.pos.y);
    pPos.setXYZ(1, striker.pos.x + pullVec.x, 0.2, striker.pos.y + pullVec.y);
    pPos.needsUpdate = true;
    pullLine.visible = true;

    // Draw Forward Trajectory Laser (Ahead of striker)
    const aPos = aimGeo.attributes.position;
    aPos.setXYZ(0, striker.pos.x, 0.2, striker.pos.y);
    aPos.setXYZ(1, striker.pos.x + shootDir.x * 3.5, 0.2, striker.pos.y + shootDir.y * 3.5);
    aPos.needsUpdate = true;
    aimLine.visible = true;
  }
});

window.addEventListener('pointerup', () => {
  if (!isDraggingStriker) return;
  isDraggingStriker = false;
  aimLine.visible = false;
  pullLine.visible = false;

  const pullVec = dragCurrent.clone().sub(dragStart);
  if (pullVec.length() > 0.4) {
    if (pullVec.length() > 6.0) pullVec.setLength(6.0);
    const powerRatio = pullVec.length() / 6.0;
    const shootDir = pullVec.clone().negate().normalize();

    // Launch striker forward!
    const maxSpeed = 34.0;
    striker.vel.copy(shootDir).multiplyScalar(maxSpeed * powerRatio);
    sfx.strikerFlick(powerRatio);
  }
});

// Horizontal Baseline Placement Slider
const baselineSlider = document.getElementById('baseline-slider');
const baselinePosLabel = document.getElementById('baseline-pos');
baselineSlider.addEventListener('input', e => {
  if (areDisksMoving() || !striker || striker.isPotted) return;
  const val = parseFloat(e.target.value);
  striker.pos.x = val;
  striker.pos.y = 7.0;
  striker.updateVisuals();
  baselinePosLabel.textContent = val.toFixed(1);
});

// Sprinkle Powder Button
document.getElementById('powder-btn').addEventListener('click', () => {
  sfx.powderShake();
  frictionDecel = Math.max(3.2, frictionDecel - 0.5);
  showToast('✨ Talcum Powder Sprinkled! Surface friction reduced.');
});

// Re-Rack Board
document.getElementById('reset-btn').addEventListener('click', () => {
  rackCarrom(currentGameMode);
});

// Sound Toggle
const soundBtn = document.getElementById('sound-btn');
soundBtn.addEventListener('click', () => {
  sfx.init();
  sfx.enabled = !sfx.enabled;
  soundBtn.textContent = sfx.enabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
});

// Camera Views Switching
function setCameraView(mode) {
  document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`cam-${mode}`).classList.add('active');
  currentCamMode = mode;
}
document.getElementById('cam-overhead').addEventListener('click', () => setCameraView('overhead'));
document.getElementById('cam-player').addEventListener('click', () => setCameraView('player'));
document.getElementById('cam-orbit').addEventListener('click', () => setCameraView('orbit'));

// Mode Tabs
document.querySelectorAll('.mode-tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
    t.classList.add('active');
    rackCarrom(t.id.replace('tab-', ''));
  });
});

// Toast Helper
const toastEl = document.getElementById('toast');
let toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

/* ==========================================================================
   MAIN RENDER & ANIMATION LOOP
   ========================================================================== */
let clock = new THREE.Clock();
let freeOrbitYaw = 0, freeOrbitPitch = 0.65, freeOrbitDist = 30;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  updatePhysics(dt);

  // If pieces are done moving and striker was played, reset striker to baseline
  if (!areDisksMoving() && striker && !striker.isPotted && striker.pos.y < 6.5) {
    setTimeout(() => {
      if (!areDisksMoving() && striker && !striker.isPotted) {
        const sliderVal = parseFloat(baselineSlider.value) || 0;
        striker.reset(sliderVal, 7.0);
      }
    }, 400);
  }

  // Camera Smooth Lerp
  if (currentCamMode === 'overhead') {
    camera.position.lerp(new THREE.Vector3(0, 27, 0.001), 0.08);
    camera.lookAt(0, 0, 0);
  } else if (currentCamMode === 'player') {
    camera.position.lerp(new THREE.Vector3(0, 15, 18), 0.08);
    camera.lookAt(0, 0, -2);
  } else if (currentCamMode === 'orbit') {
    const cx = Math.sin(freeOrbitYaw) * Math.cos(freeOrbitPitch) * freeOrbitDist;
    const cy = Math.sin(freeOrbitPitch) * freeOrbitDist;
    const cz = Math.cos(freeOrbitYaw) * Math.cos(freeOrbitPitch) * freeOrbitDist;
    camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.08);
    camera.lookAt(0, 0, 0);
  }

  renderer.render(scene, camera);
}

// Window Resize Handling
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Robust Bootloader
function bootCarrom() {
  if (typeof THREE === 'undefined') {
    setTimeout(bootCarrom, 40);
    return;
  }
  rackCarrom('points');
  animate();
}

if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', bootCarrom);
} else {
  bootCarrom();
}
</script>
