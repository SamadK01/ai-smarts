<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Royal Carrom Club 3D — Master Board Lounge</title>
<meta name="description" content="An authentic, genuine 3D Carrom Board simulation with regulation pocket sizes, 1-4 player multiplayer, automatic seating perspectives, talcum powder glide dynamics, and procedural acoustic wooden clacks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090f;
    --board: #f1dfbe;
    --border-wood: #2c1208;
    --gold: #ffbe3b;
    --amber: #e69224;
    --cyan: #00f0ff;
    --emerald: #10b981;
    --rose: #f43f5e;
    --text: #f0f4f8;
    --muted: rgba(240, 244, 248, 0.6);
    --panel: rgba(12, 16, 26, 0.94);
    --border: rgba(230, 184, 74, 0.35);
    --mono: "Geist Mono", ui-monospace, monospace;
    --display: "Funnel Display", sans-serif;
    --body: "Bricolage Grotesque", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: var(--body); touch-action: none;
  }

  #canvas-container {
    position: fixed; inset: 0; width: 100%; height: 100%;
    cursor: default; z-index: 1;
  }
  #canvas-container.aiming { cursor: crosshair; }
  #canvas-container.dragging { cursor: grabbing; }

  /* TOP HUD */
  .hud-top {
    position: fixed; top: 14px; left: 18px; right: 18px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 30; pointer-events: none; gap: 12px;
  }
  .hud-top > * { pointer-events: auto; }

  .brand-group { display: flex; align-items: center; gap: 10px; }
  .home-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--border);
    padding: 7px 15px; border-radius: 999px; color: var(--text);
    text-decoration: none; font: 600 12px/1 var(--body);
    backdrop-filter: blur(16px); transition: all 0.2s;
  }
  .home-btn:hover { border-color: var(--gold); color: #fff; transform: translateY(-1px); }
  .home-btn span { color: var(--gold); font-weight: 700; }

  .club-tag {
    background: var(--panel); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 999px; backdrop-filter: blur(16px);
    display: flex; align-items: center; gap: 7px; font: 500 11px/1 var(--mono); color: var(--muted);
  }
  .club-tag b { color: var(--gold); font-weight: 700; }

  /* TOP CONTROLS: PLAYERS & MODES */
  .top-selectors { display: flex; align-items: center; gap: 8px; }

  /* PLAYER COUNT SELECTOR */
  .player-tabs {
    display: flex; gap: 4px; background: var(--panel);
    border: 1px solid var(--border); padding: 4px; border-radius: 999px;
    backdrop-filter: blur(16px);
  }
  .player-tab {
    background: transparent; border: 0; color: var(--muted);
    font: 600 11px/1 var(--mono); padding: 6px 12px; border-radius: 999px;
    cursor: pointer; transition: all 0.2s;
  }
  .player-tab:hover { color: #fff; }
  .player-tab.active {
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.35), rgba(0, 180, 216, 0.2));
    border: 1px solid var(--cyan); color: #fff; box-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
  }

  /* GAME MODE TABS */
  .mode-tabs {
    display: flex; gap: 4px; background: var(--panel);
    border: 1px solid var(--border); padding: 4px; border-radius: 999px;
    backdrop-filter: blur(16px);
  }
  .mode-tab {
    background: transparent; border: 0; color: var(--muted);
    font: 600 11px/1 var(--body); padding: 6px 12px; border-radius: 999px;
    cursor: pointer; transition: all 0.2s;
  }
  .mode-tab:hover { color: #fff; }
  .mode-tab.active {
    background: linear-gradient(135deg, rgba(230, 184, 74, 0.35), rgba(198, 146, 40, 0.2));
    border: 1px solid var(--gold); color: #fff; box-shadow: 0 0 12px rgba(230, 184, 74, 0.35);
  }

  /* TOP MATCH SCOREBOARD */
  .score-banner {
    position: fixed; top: 68px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border);
    padding: 6px 18px; border-radius: 999px; backdrop-filter: blur(18px);
    display: flex; align-items: center; gap: 14px; z-index: 25;
    font: 600 11px/1 var(--mono); box-shadow: 0 10px 30px rgba(0,0,0,0.7);
  }
  .player-cards { display: flex; align-items: center; gap: 8px; }
  .p-card {
    display: flex; align-items: center; gap: 6px; padding: 4px 10px;
    border-radius: 999px; background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.25s;
  }
  .p-card.active {
    background: rgba(255, 190, 59, 0.2); border-color: var(--gold);
    box-shadow: 0 0 14px rgba(255, 190, 59, 0.45); transform: scale(1.06);
  }
  .p-badge { font-weight: 800; font-size: 10px; padding: 2px 5px; border-radius: 4px; }
  .p-card.p1 .p-badge { background: #ffbe3b; color: #0b0d14; }
  .p-card.p2 .p-badge { background: #00f0ff; color: #0b0d14; }
  .p-card.p3 .p-badge { background: #10b981; color: #0b0d14; }
  .p-card.p4 .p-badge { background: #f43f5e; color: #fff; }
  .p-card .p-score { font-weight: 800; font-size: 12px; color: #fff; }
  .p-turn-tag {
    font-size: 8px; font-weight: 800; color: var(--gold);
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  .pieces-summary { display: flex; align-items: center; gap: 10px; padding-left: 6px; border-left: 1px solid rgba(255,255,255,0.15); }
  .piece-pill { display: flex; align-items: center; gap: 4px; font-size: 11px; }
  .p-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .p-white { background: #fdfaf2; border: 1px solid #999; }
  .p-black { background: #1c1917; border: 1px solid #555; }
  .p-queen { background: #dc2626; border: 1px solid #ffd700; box-shadow: 0 0 8px #dc2626; }

  /* CAMERA VIEW PRESETS */
  .view-presets {
    position: fixed; top: 68px; left: 18px;
    display: flex; flex-direction: column; gap: 5px; z-index: 25;
  }
  .cam-btn {
    background: var(--panel); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 999px; color: var(--muted);
    font: 600 11px/1 var(--body); cursor: pointer; backdrop-filter: blur(16px);
    transition: all 0.2s; text-align: left; display: flex; align-items: center; gap: 6px;
  }
  .cam-btn:hover { color: #fff; border-color: var(--gold); }
  .cam-btn.active { background: rgba(230, 184, 74, 0.28); border-color: var(--gold); color: #fff; }

  /* MASTER BOTTOM CONTROL CONSOLE */
  .console-dock {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border);
    padding: 9px 20px; border-radius: 999px; backdrop-filter: blur(20px);
    display: flex; align-items: center; gap: 14px; z-index: 35;
    box-shadow: 0 16px 45px rgba(0, 0, 0, 0.85);
  }

  .control-unit {
    display: flex; align-items: center; gap: 6px; font: 600 11px/1 var(--mono);
    color: var(--muted);
  }
  .control-label { text-transform: uppercase; letter-spacing: 0.5px; font-size: 10px; }
  .val-badge {
    background: rgba(255, 255, 255, 0.08); padding: 3px 7px; border-radius: 6px;
    color: var(--gold); font-weight: 700; min-width: 34px; text-align: center;
  }

  .step-btn {
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.16);
    color: var(--text); width: 22px; height: 22px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font: 700 10px var(--mono); transition: all 0.15s;
  }
  .step-btn:hover { background: var(--gold); color: #0b0d14; border-color: var(--gold); }

  .slider-input {
    -webkit-appearance: none; width: 95px; height: 5px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.16); outline: none; cursor: pointer;
  }
  .slider-input::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: #ffffff; border: 2px solid var(--gold);
    box-shadow: 0 0 8px var(--gold); cursor: pointer;
    transition: transform 0.1s;
  }
  .slider-input::-webkit-slider-thumb:hover { transform: scale(1.25); }

  /* BIG TACTILE STRIKE BUTTON */
  .strike-btn {
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, #ffbe3b 0%, #e68a00 100%);
    color: #0b0d14; border: 0; padding: 10px 22px; border-radius: 999px;
    font: 800 13px/1 var(--display); letter-spacing: 0.5px;
    cursor: pointer; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 0 24px rgba(255, 190, 59, 0.55), 0 4px 12px rgba(0,0,0,0.5);
    transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .strike-btn:hover {
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 0 32px rgba(255, 190, 59, 0.8), 0 6px 16px rgba(0,0,0,0.6);
  }
  .strike-btn:active { transform: translateY(1px) scale(0.98); }
  .strike-btn.disabled {
    opacity: 0.45; filter: grayscale(0.8); pointer-events: none;
    box-shadow: none;
  }
  .strike-hint {
    background: rgba(0, 0, 0, 0.25); color: #fff; font: 700 9px/1 var(--mono);
    padding: 3px 6px; border-radius: 4px; letter-spacing: 0;
  }

  .powder-btn {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff; padding: 8px 13px; border-radius: 999px;
    font: 600 11px/1 var(--mono); cursor: pointer;
    display: flex; align-items: center; gap: 5px; transition: all 0.2s;
  }
  .powder-btn:hover { border-color: #fff; background: rgba(255, 255, 255, 0.25); }

  .tool-btn {
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 8px 12px; border-radius: 999px; color: var(--text);
    font: 600 11px/1 var(--body); cursor: pointer;
    display: flex; align-items: center; gap: 5px; transition: all 0.2s;
  }
  .tool-btn:hover { background: rgba(255, 255, 255, 0.15); border-color: var(--gold); color: #fff; }

  /* ONBOARDING SLINGSHOT HINT */
  .slingshot-hint {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.78); border: 1px solid rgba(255, 190, 59, 0.35);
    padding: 7px 22px; border-radius: 999px; pointer-events: none;
    font: 600 11px/1.4 var(--mono); color: var(--muted); backdrop-filter: blur(10px);
    z-index: 25; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  }
  .slingshot-hint b { color: var(--gold); }
  .slingshot-hint span { color: var(--cyan); }

  /* TOAST NOTIFICATION */
  .toast {
    position: fixed; top: 118px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: rgba(12, 16, 26, 0.96); border: 1px solid var(--gold);
    color: #fff; padding: 10px 24px; border-radius: 999px;
    font: 700 13px/1 var(--mono); backdrop-filter: blur(16px);
    opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 40; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* GAME OVER VICTORY MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--panel); border: 2px solid var(--gold);
    border-radius: 24px; padding: 32px 40px; text-align: center;
    max-width: 420px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.9);
  }
  .modal-box h2 { font: 800 28px/1.1 var(--display); color: var(--gold); margin-bottom: 8px; }
  .modal-box p { font: 500 13px/1.5 var(--mono); color: var(--muted); margin-bottom: 20px; }
  .leaderboard { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .lb-row {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.06); padding: 8px 16px; border-radius: 12px;
    font: 700 13px/1 var(--mono);
  }
  .lb-row.first { background: rgba(255, 190, 59, 0.2); border: 1px solid var(--gold); color: #fff; }
  .rematch-btn {
    background: linear-gradient(135deg, #ffbe3b, #e68a00); color: #0b0d14;
    border: 0; padding: 12px 28px; border-radius: 999px;
    font: 800 14px/1 var(--display); cursor: pointer; transition: transform 0.15s;
  }
  .rematch-btn:hover { transform: scale(1.05); }

  @media (max-width: 980px) {
    .hud-top { flex-direction: column; gap: 8px; align-items: flex-start; }
    .top-selectors { width: 100%; justify-content: space-between; }
    .console-dock { width: calc(100% - 24px); padding: 8px 10px; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .slider-input { width: 75px; }
    .view-presets { display: none; }
    .score-banner { top: 120px; padding: 5px 12px; font-size: 10px; max-width: 95vw; overflow-x: auto; }
    .slingshot-hint { bottom: 116px; font-size: 10px; padding: 5px 14px; }
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<body>

<div id="canvas-container"></div>

<!-- TOP HUD -->
<header class="hud-top">
  <div class="brand-group">
    <a href="index.html" class="home-btn">← <span>AI Smarts</span></a>
    <div class="club-tag">
      <span>🏆 <b>Royal Carrom Lounge</b> · Championship Board</span>
    </div>
  </div>

  <div class="top-selectors">
    <!-- Player Count: 1P, 2P, 3P, 4P -->
    <div class="player-tabs">
      <button class="player-tab" id="p-tab-1">1P Solo</button>
      <button class="player-tab active" id="p-tab-2">2P Match</button>
      <button class="player-tab" id="p-tab-3">3P Cut</button>
      <button class="player-tab" id="p-tab-4">4P Lounge</button>
    </div>

    <!-- Mode Selector -->
    <div class="mode-tabs">
      <button class="mode-tab active" id="tab-points">🎯 Points</button>
      <button class="mode-tab" id="tab-zen">🕊️ Zen</button>
      <button class="mode-tab" id="tab-trick">⭐ Trick</button>
    </div>
  </div>
</header>

<!-- MATCH SCOREBOARD (DYNAMIC MULTI-PLAYER) -->
<div class="score-banner" id="score-banner">
  <div class="player-cards" id="player-cards">
    <!-- Populated dynamically via renderScoreboard() -->
  </div>

  <div class="pieces-summary">
    <div class="piece-pill"><span class="p-dot p-white"></span> <b id="white-count">9</b></div>
    <div class="piece-pill"><span class="p-dot p-black"></span> <b id="black-count">9</b></div>
    <div class="piece-pill"><span class="p-dot p-queen"></span> <b id="queen-status">Center</b></div>
  </div>
</div>

<!-- CAMERA VIEW PRESETS -->
<div class="view-presets">
  <button class="cam-btn active" id="cam-overhead">📐 Overhead View</button>
  <button class="cam-btn" id="cam-player">🪑 Player Seat View</button>
  <button class="cam-btn" id="cam-orbit">🌐 3D Free Orbit</button>
</div>

<!-- INSTRUCTION HINT -->
<div class="slingshot-hint" id="slingshot-hint">
  🎯 <b>Slide Baseline & Aim</b> · Click <span>⚡ FLICK STRIKER</span> (Space) or drag on board to shoot!
</div>

<!-- MASTER BOTTOM CONSOLE -->
<nav class="console-dock">
  <!-- Baseline Slider -->
  <div class="control-unit">
    <span class="control-label">Baseline:</span>
    <input type="range" class="slider-input" id="baseline-slider" min="-6.0" max="6.0" step="0.1" value="0">
    <span id="baseline-pos" class="val-badge">0.0</span>
  </div>

  <!-- Relative Aim Angle Control (-75 deg to +75 deg) -->
  <div class="control-unit">
    <span class="control-label">Aim:</span>
    <button class="step-btn" id="aim-left-btn" title="Aim Left (A)">◀</button>
    <input type="range" class="slider-input" id="aim-slider" min="-75" max="75" step="1" value="0">
    <button class="step-btn" id="aim-right-btn" title="Aim Right (D)">▶</button>
    <span id="aim-val" class="val-badge">0°</span>
  </div>

  <!-- Power Meter -->
  <div class="control-unit">
    <span class="control-label">Power:</span>
    <input type="range" class="slider-input" id="power-slider" min="25" max="100" step="5" value="75">
    <span id="power-val" class="val-badge">75%</span>
  </div>

  <!-- Big Tactile Strike Button -->
  <button class="strike-btn" id="strike-btn">
    <span>⚡</span>
    <span id="strike-btn-text">FLICK STRIKER</span>
    <span class="strike-hint">SPACE</span>
  </button>

  <button class="powder-btn" id="powder-btn" title="Sprinkle talcum powder to reduce friction">✨ Powder</button>
  <button class="tool-btn" id="reset-btn" title="Re-rack board">🔄 Re-Rack</button>
  <button class="tool-btn" id="sound-btn">🔊 Sound</button>
</nav>

<!-- TOAST NOTIFICATION -->
<div class="toast" id="toast">✨ White Piece Potted (+20 pts)!</div>

<!-- GAME OVER MODAL -->
<div class="modal-overlay" id="game-over-modal">
  <div class="modal-box">
    <h2>🏆 MATCH COMPLETE!</h2>
    <p>All Carrom pieces cleared! Here are the final scores:</p>
    <div class="leaderboard" id="modal-leaderboard"></div>
    <button class="rematch-btn" id="rematch-btn">🔄 Play Rematch</button>
  </div>
</div>

<script>
/* ==========================================================================
   AUTHENTIC PROCEDURAL CARROM ACOUSTICS (WEB AUDIO API)
   ========================================================================== */
class CarromAudio {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }

  woodClack(relVel = 1.0) {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const v = Math.min(2.5, Math.max(0.1, relVel));

    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'triangle';
    const pitch = 1450 + Math.random() * 320;
    osc.frequency.setValueAtTime(pitch, now);
    osc.frequency.exponentialRampToValueAtTime(320, now + 0.018);

    const vol = Math.min(0.32, 0.06 + v * 0.12);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.026);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.03);

    const osc2 = this.ctx.createOscillator();
    const g2 = this.ctx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(620 + Math.random() * 120, now);
    osc2.frequency.exponentialRampToValueAtTime(180, now + 0.04);
    g2.gain.setValueAtTime(vol * 0.75, now);
    g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);
    osc2.connect(g2); g2.connect(this.ctx.destination);
    osc2.start(now); osc2.stop(now + 0.05);
  }

  strikerFlick(power = 1.0) {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(280, now);
    osc.frequency.exponentialRampToValueAtTime(55, now + 0.045);
    g.gain.setValueAtTime(0.18 * power, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.055);
  }

  railBounce(vel = 1.0) {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.06);
    const vol = Math.min(0.18, 0.05 + vel * 0.08);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.07);
  }

  pocketDrop() {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    this.woodClack(0.5);
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(130, now + 0.02);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.14);
    g.gain.setValueAtTime(0.2, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(now + 0.02); osc.stop(now + 0.16);
  }

  powderShake() {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const dur = 0.25;
    const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * dur), this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(i / d.length * Math.PI);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.setValueAtTime(3200, now); f.Q.value = 2.0;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.07, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(f); f.connect(g); g.connect(this.ctx.destination);
    src.start(now);
  }
}

/* ==========================================================================
   BOARD MARKINGS TEXTURE (ACCORDING TO REAL CARROM BOARD DARAZ SCREENSHOT)
   ========================================================================== */
function makeCarromBoardTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 1024;
  const ctx = c.getContext('2d');

  // 1. Natural Polished Plywood Surface (Warm Tan Birch Ply)
  ctx.fillStyle = '#f5e4c6';
  ctx.fillRect(0, 0, 1024, 1024);

  // Realistic wood grain striations
  ctx.fillStyle = 'rgba(180, 140, 95, 0.12)';
  for (let i = 0; i < 1024; i += 4) {
    const h = (i % 8 === 0) ? 2 : 1;
    ctx.fillRect(0, i, 1024, h);
  }
  // Soft radial vignette towards wood frame
  const bgVignette = ctx.createRadialGradient(512, 512, 200, 512, 512, 700);
  bgVignette.addColorStop(0, 'rgba(255, 255, 255, 0.08)');
  bgVignette.addColorStop(0.7, 'transparent');
  bgVignette.addColorStop(1, 'rgba(120, 75, 30, 0.18)');
  ctx.fillStyle = bgVignette;
  ctx.fillRect(0, 0, 1024, 1024);

  ctx.save();
  ctx.translate(512, 512);

  // 2. Central Concentric Rings & 3-Dot Center (Exactly matching screenshot)
  // Outer Large Ring
  ctx.strokeStyle = '#1e1c18'; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(0, 0, 155, 0, Math.PI * 2); ctx.stroke();

  // Middle Concentric Ring
  ctx.strokeStyle = '#1e1c18'; ctx.lineWidth = 2.0;
  ctx.beginPath(); ctx.arc(0, 0, 140, 0, Math.PI * 2); ctx.stroke();

  // Inner Queen Circle
  ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, 0, 48, 0, Math.PI * 2); ctx.stroke();

  // The 3 iconic colored center circles from Daraz photo (Yellow, Red, Green)
  const dotR = 14;
  // Left: Yellow
  ctx.fillStyle = '#facc15'; ctx.strokeStyle = '#713f12'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(-26, 10, dotR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // Center: Red (Queen spot)
  ctx.fillStyle = '#dc2626'; ctx.strokeStyle = '#450a0a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, dotR + 1, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // Right/Top: Green
  ctx.fillStyle = '#16a34a'; ctx.strokeStyle = '#052e16'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(26, -10, dotR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // 3. Baselines & Red End Circles on All 4 Sides
  const baselineDist = 345;
  const baselineLen = 275;
  const redSpotR = 17;

  for (let side = 0; side < 4; side++) {
    ctx.save();
    ctx.rotate((side * Math.PI) / 2);

    // Double Baseline (Two parallel black lines)
    ctx.strokeStyle = '#1a1917'; ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.moveTo(-baselineLen, baselineDist - 16);
    ctx.lineTo( baselineLen, baselineDist - 16);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-baselineLen, baselineDist + 16);
    ctx.lineTo( baselineLen, baselineDist + 16);
    ctx.stroke();

    // Red End Circles with black outlines on each end of the baseline
    [-baselineLen, baselineLen].forEach(bx => {
      ctx.fillStyle = '#dc2626';
      ctx.beginPath(); ctx.arc(bx, baselineDist, redSpotR, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#1a1917'; ctx.lineWidth = 2.2; ctx.stroke();
    });

    // 4. Diagonal Foul Lines with Pocket Direction Arrows (Screenshot Style)
    // Line starting from center outer ring and extending to pocket corner
    ctx.strokeStyle = '#1e1c18'; ctx.lineWidth = 2.0;
    ctx.beginPath();
    ctx.moveTo(110, 110);
    ctx.lineTo(baselineLen, baselineDist);
    ctx.stroke();

    // Extension past the red circle with arrow towards the pocket
    ctx.beginPath();
    ctx.moveTo(baselineLen, baselineDist);
    ctx.lineTo(430, 430);
    ctx.stroke();

    // Pocket Arrowhead
    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.moveTo(438, 438);
    ctx.lineTo(422, 435);
    ctx.lineTo(435, 422);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  // 5. Four Regulation Corner Pockets with Warm Amber Net Catchers (Screenshot Style)
  const pocketDist = 452;
  const pocketR = 48;
  [
    [-pocketDist, -pocketDist],
    [ pocketDist, -pocketDist],
    [-pocketDist,  pocketDist],
    [ pocketDist,  pocketDist]
  ].forEach(([px, py]) => {
    // Warm orange-amber mesh pocket hole (Daraz screenshot style)
    ctx.fillStyle = '#c2410c';
    ctx.beginPath(); ctx.arc(px, py, pocketR + 4, 0, Math.PI * 2); ctx.fill();

    // Inner deep hole
    ctx.fillStyle = '#090a0f';
    ctx.beginPath(); ctx.arc(px, py, pocketR - 2, 0, Math.PI * 2); ctx.fill();

    // Woven Net Lines
    ctx.strokeStyle = '#ea580c'; ctx.lineWidth = 1.4;
    for (let k = -28; k <= 28; k += 10) {
      ctx.beginPath();
      ctx.moveTo(px + k, py - 26); ctx.lineTo(px + k, py + 26);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(px - 26, py + k); ctx.lineTo(px + 26, py + k);
      ctx.stroke();
    }

    // Outer subtle wood contour ring
    ctx.strokeStyle = 'rgba(40, 20, 10, 0.4)'; ctx.lineWidth = 2.0;
    ctx.beginPath(); ctx.arc(px, py, pocketR + 4, 0, Math.PI * 2); ctx.stroke();
  });

  ctx.restore();
  return new THREE.CanvasTexture(c);
}

/* ==========================================================================
   CARROM PIECE CLASS (WHITE, BLACK, QUEEN, STRIKER)
   ========================================================================== */
class CarromPiece {
  constructor(type, x, y) {
    this.type = type;
    this.pos = new THREE.Vector2(x, y);
    this.vel = new THREE.Vector2(0, 0);
    this.isPotted = false;
    this.dropAnim = 0;

    this.r = type === 'striker' ? STRIKER_R : PIECE_R;
    this.mass = type === 'striker' ? STRIKER_MASS : PIECE_MASS;
    this.points = type === 'white' ? 20 : (type === 'black' ? 10 : (type === 'queen' ? 50 : 0));

    // 3D Visual Mesh
    const h = type === 'striker' ? 0.38 : 0.32;
    const geo = new THREE.CylinderGeometry(this.r, this.r, h, 28);
    let color = 0xfcf7ea;
    let roughness = 0.4;
    let metalness = 0.05;

    if (type === 'black') {
      color = 0x1c1917;
      roughness = 0.5;
    } else if (type === 'queen') {
      color = 0xdc2626;
      roughness = 0.25;
      metalness = 0.2;
    } else if (type === 'striker') {
      color = 0x2dd4bf; // Daraz screenshot turquoise sea-green acrylic striker
      roughness = 0.18;
      metalness = 0.25;
    }

    const mat = new THREE.MeshStandardMaterial({
      color,
      roughness,
      metalness,
      transparent: type === 'striker',
      opacity: type === 'striker' ? 0.92 : 1.0
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.castShadow = true;
    this.mesh.receiveShadow = true;
    this.mesh.position.set(x, h * 0.5, y);

    // Decorative Center Ring / Acrylic Details (Screenshot Style)
    if (type === 'striker') {
      const innerRidge = new THREE.Mesh(
        new THREE.TorusGeometry(this.r * 0.62, 0.045, 12, 32),
        new THREE.MeshStandardMaterial({ color: 0x0d9488, roughness: 0.12, metalness: 0.35 })
      );
      innerRidge.rotation.x = Math.PI / 2;
      innerRidge.position.y = h * 0.5 + 0.003;
      this.mesh.add(innerRidge);

      const centerPip = new THREE.Mesh(
        new THREE.CylinderGeometry(this.r * 0.22, this.r * 0.22, h + 0.012, 20),
        new THREE.MeshStandardMaterial({ color: 0x14b8a6, roughness: 0.12, metalness: 0.4 })
      );
      this.mesh.add(centerPip);
    } else {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(this.r * 0.5, 0.04, 8, 20),
        new THREE.MeshBasicMaterial({ color: type === 'black' ? 0x444444 : (type === 'queen' ? 0xffd700 : 0xccbba5) })
      );
      ring.rotation.x = Math.PI / 2;
      ring.position.y = h * 0.5 + 0.002;
      this.mesh.add(ring);
    }

    // Contact drop shadow
    const sGeo = new THREE.CircleGeometry(this.r * 1.15, 20);
    const sMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.4, depthWrite: false });
    this.shadow = new THREE.Mesh(sGeo, sMat);
    this.shadow.rotation.x = -Math.PI / 2;
    this.shadow.position.set(x, 0.005, y);

    scene.add(this.mesh);
    scene.add(this.shadow);
  }

  updateVisuals() {
    if (this.isPotted) {
      if (this.dropAnim < 1.0) {
        this.dropAnim += 0.09;
        this.mesh.position.y = 0.16 - this.dropAnim * 1.6;
        this.mesh.scale.setScalar(Math.max(0.1, 1 - this.dropAnim * 0.5));
        this.shadow.material.opacity = Math.max(0, 0.4 * (1 - this.dropAnim));
      } else {
        this.mesh.visible = false;
        this.shadow.visible = false;
      }
      return;
    }

    this.mesh.position.x = this.pos.x;
    this.mesh.position.z = this.pos.y;
    this.shadow.position.x = this.pos.x;
    this.shadow.position.z = this.pos.y;
  }

  reset(x, y) {
    this.pos.set(x, y);
    this.vel.set(0, 0);
    this.isPotted = false;
    this.dropAnim = 0;
    this.mesh.position.set(x, 0.19, y);
    this.mesh.scale.set(1, 1, 1);
    this.mesh.visible = true;
    this.shadow.visible = true;
    this.shadow.material.opacity = 0.4;
  }
}

    p.score = 0;
    p.pottedWhites = 0;
    p.pottedBlacks = 0;
  });

  if (mode === 'points') {
    // 1. Red Queen in Exact Center
    pieces.push(new CarromPiece('queen', 0, 0));

    // 2. Inner Ring: 6 Pieces alternating White & Black around Queen
    const innerR = PIECE_R * 2.05;
    for (let i = 0; i < 6; i++) {
      const ang = (i * Math.PI) / 3;
      const type = i % 2 === 0 ? 'white' : 'black';
      pieces.push(new CarromPiece(type, Math.cos(ang) * innerR, Math.sin(ang) * innerR));
    }

    // 3. Outer Ring: 12 Pieces alternating
    const outerR = PIECE_R * 4.08;
    const outerPattern = [
      'white', 'white', 'black', 'white', 'black', 'black',
      'white', 'white', 'black', 'white', 'black', 'black'
    ];
    for (let i = 0; i < 12; i++) {
      const ang = (i * Math.PI) / 6 + Math.PI / 12;
      pieces.push(new CarromPiece(outerPattern[i], Math.cos(ang) * outerR, Math.sin(ang) * outerR));
    }
  } else if (mode === 'zen') {
    pieces.push(new CarromPiece('queen', 0, -1.5));
    for (let i = 0; i < 9; i++) {
      const ang = (i / 9) * Math.PI * 2;
      pieces.push(new CarromPiece('white', Math.cos(ang) * 4.2, Math.sin(ang) * 4.2));
    }
    for (let i = 0; i < 9; i++) {
      const ang = (i / 9) * Math.PI * 2 + 0.35;
      pieces.push(new CarromPiece('black', Math.cos(ang) * 6.0, Math.sin(ang) * 6.0));
    }
  } else if (mode === 'trick') {
    pieces.push(new CarromPiece('queen', 0, 0));
    pieces.push(new CarromPiece('white', -6.0, -6.0));
    pieces.push(new CarromPiece('white',  6.0, -6.0));
    pieces.push(new CarromPiece('black', -6.0,  6.0));
    pieces.push(new CarromPiece('black',  6.0,  6.0));
    pieces.push(new CarromPiece('white', 0, -4.5));
    pieces.push(new CarromPiece('black', 0, 4.5));
  }

  // Create Striker on current active seat's baseline
  if (striker) {
    scene.remove(striker.mesh);
    scene.remove(striker.shadow);
  }
  const seat = getActiveSeat();
  const initSlider = parseFloat(document.getElementById('baseline-slider').value) || 0;
  const initPos = seat.getPos(initSlider);
  striker = new CarromPiece('striker', initPos.x, initPos.y);

  pullLine.visible = false;
  setAimRelative(0);
  updateAimGuide();
  updateUIState();
  renderScoreboard();
  showToast(`👑 ${numPlayers}P Match Racked! ${players[activePlayerIndex].name}'s Turn`);
}

/* ==========================================================================
   2D DISK-DISK ELASTIC PHYSICS ENGINE & TALCUM POWDER DECELERATION
   ========================================================================== */
function updatePhysics(dt) {
  const allDisks = [...pieces, striker].filter(d => d && !d.isPotted);
  const SUB_STEPS = 8;
  const subDt = dt / SUB_STEPS;
  const STOP_EPS = 0.08;

  for (let step = 0; step < SUB_STEPS; step++) {
    // 1. Move & Linear Talcum Powder Friction
    allDisks.forEach(d => {
      d.pos.addScaledVector(d.vel, subDt);
      const speed = d.vel.length();

      if (speed > 0) {
        const newSpeed = Math.max(0, speed - frictionDecel * subDt);
        if (newSpeed < STOP_EPS) {
          d.vel.set(0, 0);
        } else {
          d.vel.multiplyScalar(newSpeed / speed);
        }
      }

      // Snug Regulation Corner Pocket Detection
      for (let p of POCKETS) {
        const dx = d.pos.x - p.x;
        const dy = d.pos.y - p.y;
        if (dx * dx + dy * dy < POCKET_RADIUS * POCKET_RADIUS) {
          d.isPotted = true;
          d.vel.set(0, 0);
          sfx.pocketDrop();

          if (d === striker) {
            foulThisShot = true;
            const pObj = players[activePlayerIndex];
            pObj.score = Math.max(0, pObj.score - 10);
            showToast(`⚠️ Foul! Striker Potted (-10 pts penalty for ${pObj.name})`);
          } else {
            pottedThisShot.push(d);
            const pObj = players[activePlayerIndex];
            pObj.score += d.points;

            if (d.type === 'white') {
              whiteRemaining--;
              pObj.pottedWhites++;
              showToast(`✨ ${pObj.name} Potted White (+20 pts)!`);
            } else if (d.type === 'black') {
              blackRemaining--;
              pObj.pottedBlacks++;
              showToast(`✨ ${pObj.name} Potted Black (+10 pts)!`);
            } else if (d.type === 'queen') {
              queenPotted = true;
              pObj.queenCovered = true;
              showToast(`👑 ${pObj.name} POTTED RED QUEEN (+50 PTS)!`);
            }
          }
          renderScoreboard();
          break;
        }
      }

      // Wooden Boundary Rails Collision & Containment
      if (!d.isPotted) {
        const bound = HALF_BOARD - d.r;

        if (d.pos.x < -bound) {
          d.pos.x = -bound;
          d.vel.x = -d.vel.x * RAIL_RESTITUTION;
          sfx.railBounce(d.vel.length());
        } else if (d.pos.x > bound) {
          d.pos.x = bound;
          d.vel.x = -d.vel.x * RAIL_RESTITUTION;
          sfx.railBounce(d.vel.length());
        }

        if (d.pos.y < -bound) {
          d.pos.y = -bound;
          d.vel.y = -d.vel.y * RAIL_RESTITUTION;
          sfx.railBounce(d.vel.length());
        } else if (d.pos.y > bound) {
          d.pos.y = bound;
          d.vel.y = -d.vel.y * RAIL_RESTITUTION;
          sfx.railBounce(d.vel.length());
        }
      }
    });

    // 2. Disk-to-Disk Elastic Collisions with Mass Conservation
    for (let i = 0; i < allDisks.length; i++) {
      const d1 = allDisks[i];
      if (d1.isPotted) continue;

      for (let j = i + 1; j < allDisks.length; j++) {
        const d2 = allDisks[j];
        if (d2.isPotted) continue;

        const delta = d2.pos.clone().sub(d1.pos);
        const dist = delta.length();
        const minDist = d1.r + d2.r;

        if (dist < minDist && dist > 0.0001) {
          const normal = delta.clone().divideScalar(dist);
          const overlap = minDist - dist;
          const invM1 = 1 / d1.mass;
          const invM2 = 1 / d2.mass;
          const invSum = invM1 + invM2;

          // Safe Three.js positional overlap resolution
          d1.pos.addScaledVector(normal, -overlap * (invM1 / invSum));
          d2.pos.addScaledVector(normal, overlap * (invM2 / invSum));

          // Normal relative velocity
          const vRel = d1.vel.clone().sub(d2.vel);
          const vNorm = vRel.dot(normal);

          if (vNorm > 0) {
            const impulse = (1 + RESTITUTION) * vNorm / invSum;
            d1.vel.addScaledVector(normal, -impulse * invM1);
            d2.vel.addScaledVector(normal, impulse * invM2);

            sfx.woodClack(vRel.length());
          }
        }
      }
    }
  }

  // Update visual transforms
  allDisks.forEach(d => d.updateVisuals());
}

function areDisksMoving() {
  const allDisks = [...pieces, striker].filter(d => d && !d.isPotted);
  return allDisks.some(d => d.vel.lengthSq() > 0.001);
}

/* ==========================================================================
   AIM & RETICLE CALCULATOR
   ========================================================================== */
function updateAimGuide() {
  if (!striker || turnState !== 'AIMING') {
    aimLine.visible = false;
    ghostStriker.visible = false;
    return;
  }

  aimLine.visible = true;
  ghostStriker.visible = true;

  const sx = striker.pos.x;
  const sy = striker.pos.y;
  const aimDist = 7.5;
  const tx = sx + Math.cos(aimAngle) * aimDist;
  const ty = sy + Math.sin(aimAngle) * aimDist;

  // Aim Line
  const aPos = aimGeo.attributes.position;
  aPos.setXYZ(0, sx, 0.2, sy);
  aPos.setXYZ(1, tx, 0.2, ty);
  aPos.needsUpdate = true;

  // Ghost Reticle
  ghostStriker.position.set(tx, 0.06, ty);
}

function setAimRelative(deg) {
  const clampedDeg = Math.min(75, Math.max(-75, deg));
  relativeAimDeg = clampedDeg;
  const seat = getActiveSeat();
  aimAngle = seat.forward + (clampedDeg * Math.PI / 180);

  document.getElementById('aim-slider').value = Math.round(clampedDeg);
  document.getElementById('aim-val').textContent = `${clampedDeg > 0 ? '+' : ''}${Math.round(clampedDeg)}°`;
  updateAimGuide();
}

function updateUIState() {
  const strikeBtn = document.getElementById('strike-btn');
  const btnText = document.getElementById('strike-btn-text');
  if (turnState === 'AIMING') {
    strikeBtn.classList.remove('disabled');
    btnText.textContent = `FLICK (${players[activePlayerIndex].name.replace('Player ', 'P')})`;
    container.classList.add('aiming');
    container.classList.remove('dragging');
  } else {
    strikeBtn.classList.add('disabled');
    container.classList.remove('aiming');
  }
}

/* ==========================================================================
   LAUNCH / FLICK ACTION
   ========================================================================== */
function launchStriker(powerRatio, angle) {
  if (turnState !== 'AIMING' || !striker || striker.isPotted) return;

  sfx.init();
  turnState = 'ROLLING';
  pottedThisShot = [];
  foulThisShot = false;

  aimLine.visible = false;
  ghostStriker.visible = false;
  pullLine.visible = false;
  updateUIState();

  const clampedPower = Math.min(1.0, Math.max(0.2, powerRatio));
  const maxSpeed = 38.0;
  const speed = maxSpeed * clampedPower;

  striker.vel.set(Math.cos(angle) * speed, Math.sin(angle) * speed);
  sfx.strikerFlick(clampedPower);
}

/* ==========================================================================
   AIM CONTROLS LISTENERS
   ========================================================================== */
const aimSlider = document.getElementById('aim-slider');
aimSlider.addEventListener('input', e => {
  setAimRelative(parseFloat(e.target.value));
});

document.getElementById('aim-left-btn').addEventListener('click', () => {
  setAimRelative(relativeAimDeg - 3);
});
document.getElementById('aim-right-btn').addEventListener('click', () => {
  setAimRelative(relativeAimDeg + 3);
});

/* ==========================================================================
   TACTILE INPUT: SLINGSHOT DRAG, FORWARD FLICK & BOARD INTERSECT
   ========================================================================== */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tablePlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

function getTableIntersect(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hitPoint = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(tablePlane, hitPoint)) {
    return new THREE.Vector2(hitPoint.x, hitPoint.z);
  }
  return null;
}

container.addEventListener('pointerdown', e => {
  if (e.target.closest('header, nav, .mode-tabs, .player-tabs, .console-dock, .view-presets, .modal-overlay')) return;
  sfx.init();

  if (turnState !== 'AIMING' || !striker || striker.isPotted) return;

  const hit = getTableIntersect(e);
  if (!hit) return;

  isDragging = true;
  container.classList.add('dragging');
  dragOrigin.set(striker.pos.x, striker.pos.y);
  dragCurrent.copy(hit);

  // Directly adjust aim toward touch point if clicked on playing field
  const dir = hit.clone().sub(striker.pos);
  const seat = getActiveSeat();
  const forwardVec = new THREE.Vector2(Math.cos(seat.forward), Math.sin(seat.forward));

  if (dir.length() > 0.4 && dir.dot(forwardVec) > 0) {
    const rawAngle = Math.atan2(dir.y, dir.x);
    let diff = (rawAngle - seat.forward) * 180 / Math.PI;
    while (diff > 180) diff -= 360;
    while (diff < -180) diff += 360;
    setAimRelative(diff);
  }
});

window.addEventListener('pointermove', e => {
  if (!isDragging || !striker || turnState !== 'AIMING') return;

  const hit = getTableIntersect(e);
  if (!hit) return;

  dragCurrent.copy(hit);
  const dragVec = dragCurrent.clone().sub(dragOrigin);
  const dragLen = dragVec.length();
  const seat = getActiveSeat();
  const forwardVec = new THREE.Vector2(Math.cos(seat.forward), Math.sin(seat.forward));

  if (dragLen > 0.4) {
    if (dragVec.dot(forwardVec) < 0) {
      // Slingshot Pull Back (User pulled behind active player's baseline)
      const pullAngle = Math.atan2(dragVec.y, dragVec.x);
      const shootAngle = pullAngle + Math.PI;
      let diff = (shootAngle - seat.forward) * 180 / Math.PI;
      while (diff > 180) diff -= 360;
      while (diff < -180) diff += 360;
      setAimRelative(diff);

      const tensionLen = Math.min(6.0, dragLen);
      const powerPct = Math.round((tensionLen / 6.0) * 100);
      document.getElementById('power-slider').value = powerPct;
      document.getElementById('power-val').textContent = `${powerPct}%`;

      const pPos = pullGeo.attributes.position;
      pPos.setXYZ(0, striker.pos.x, 0.2, striker.pos.y);
      pPos.setXYZ(1, dragCurrent.x, 0.2, dragCurrent.y);
      pPos.needsUpdate = true;
      pullLine.visible = true;
    } else {
      // Direct Forward Swipe
      const rawAngle = Math.atan2(dragVec.y, dragVec.x);
      let diff = (rawAngle - seat.forward) * 180 / Math.PI;
      while (diff > 180) diff -= 360;
      while (diff < -180) diff += 360;
      setAimRelative(diff);
      pullLine.visible = false;

      const powerPct = Math.min(100, Math.round((dragLen / 5.0) * 100));
      document.getElementById('power-slider').value = Math.max(30, powerPct);
      document.getElementById('power-val').textContent = `${Math.max(30, powerPct)}%`;
    }
  }
});

window.addEventListener('pointerup', () => {
  if (!isDragging) return;
  isDragging = false;
  container.classList.remove('dragging');
  pullLine.visible = false;

  const dragVec = dragCurrent.clone().sub(dragOrigin);
  const dragLen = dragVec.length();

  if (dragLen > 0.6) {
    const powerSliderVal = parseFloat(document.getElementById('power-slider').value) / 100;
    launchStriker(powerSliderVal, aimAngle);
  } else {
    updateAimGuide();
  }
});

/* ==========================================================================
   CONSOLE CONTROLS & HUD LISTENERS
   ========================================================================== */
// 1. Strike Button
const strikeBtn = document.getElementById('strike-btn');
strikeBtn.addEventListener('click', () => {
  if (turnState !== 'AIMING') return;
  const power = parseFloat(document.getElementById('power-slider').value) / 100;
  launchStriker(power, aimAngle);
});

// 2. Baseline Slider (Moves along active player's baseline)
const baselineSlider = document.getElementById('baseline-slider');
const baselinePosLabel = document.getElementById('baseline-pos');
baselineSlider.addEventListener('input', e => {
  if (turnState !== 'AIMING' || !striker || striker.isPotted) return;
  const val = parseFloat(e.target.value);
  const seat = getActiveSeat();
  const newPos = seat.getPos(val);
  striker.pos.copy(newPos);
  striker.updateVisuals();
  baselinePosLabel.textContent = val.toFixed(1);
  updateAimGuide();
});

// 3. Power Slider
const powerSlider = document.getElementById('power-slider');
const powerValLabel = document.getElementById('power-val');
powerSlider.addEventListener('input', e => {
  powerValLabel.textContent = `${e.target.value}%`;
});

// 4. Sprinkle Powder Button
document.getElementById('powder-btn').addEventListener('click', () => {
  sfx.init();
  sfx.powderShake();
  frictionDecel = Math.max(2.8, frictionDecel - 0.5);
  showToast('✨ Talcum Powder Sprinkled! Ultra-smooth frictionless glide.');
});

// 5. Re-Rack Board
document.getElementById('reset-btn').addEventListener('click', () => {
  sfx.init();
  rackCarrom(currentGameMode);
});

// 6. Sound Toggle
const soundBtn = document.getElementById('sound-btn');
soundBtn.addEventListener('click', () => {
  sfx.init();
  sfx.enabled = !sfx.enabled;
  soundBtn.textContent = sfx.enabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
});

// 7. Player Count Selector (1P, 2P, 3P, 4P)
[1, 2, 3, 4].forEach(count => {
  document.getElementById(`p-tab-${count}`).addEventListener('click', () => {
    initPlayers(count);
    rackCarrom(currentGameMode);
  });
});

// 8. Mode Tabs
document.querySelectorAll('.mode-tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
    t.classList.add('active');
    rackCarrom(t.id.replace('tab-', ''));
  });
});

// 9. Camera View Presets
function setCameraView(mode) {
  document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`cam-${mode}`).classList.add('active');
  currentCamMode = mode;
}
document.getElementById('cam-overhead').addEventListener('click', () => setCameraView('overhead'));
document.getElementById('cam-player').addEventListener('click', () => setCameraView('player'));
document.getElementById('cam-orbit').addEventListener('click', () => setCameraView('orbit'));

// 10. Rematch Button
document.getElementById('rematch-btn').addEventListener('click', () => {
  document.getElementById('game-over-modal').classList.remove('show');
  rackCarrom(currentGameMode);
});

// 11. Keyboard Shortcuts (Space, Arrows, A/D, R, P)
window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (turnState === 'AIMING') {
      const power = parseFloat(document.getElementById('power-slider').value) / 100;
      launchStriker(power, aimAngle);
    }
  } else if (e.key === 'ArrowLeft' || e.key === 'Left') {
    if (turnState === 'AIMING') {
      const newVal = Math.max(-6.0, parseFloat(baselineSlider.value) - 0.3);
      baselineSlider.value = newVal;
      baselinePosLabel.textContent = newVal.toFixed(1);
      const seat = getActiveSeat();
      striker.pos.copy(seat.getPos(newVal));
      striker.updateVisuals();
      updateAimGuide();
    }
  } else if (e.key === 'ArrowRight' || e.key === 'Right') {
    if (turnState === 'AIMING') {
      const newVal = Math.min(6.0, parseFloat(baselineSlider.value) + 0.3);
      baselineSlider.value = newVal;
      baselinePosLabel.textContent = newVal.toFixed(1);
      const seat = getActiveSeat();
      striker.pos.copy(seat.getPos(newVal));
      striker.updateVisuals();
      updateAimGuide();
    }
  } else if (e.key === 'a' || e.key === 'A') {
    setAimRelative(relativeAimDeg - 2);
  } else if (e.key === 'd' || e.key === 'D') {
    setAimRelative(relativeAimDeg + 2);
  } else if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') {
    const curP = Math.min(100, parseInt(powerSlider.value) + 5);
    powerSlider.value = curP;
    powerValLabel.textContent = `${curP}%`;
  } else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') {
    const curP = Math.max(25, parseInt(powerSlider.value) - 5);
    powerSlider.value = curP;
    powerValLabel.textContent = `${curP}%`;
  } else if (e.key === 'r' || e.key === 'R') {
    rackCarrom(currentGameMode);
  } else if (e.key === 'p' || e.key === 'P') {
    sfx.powderShake();
    frictionDecel = Math.max(2.8, frictionDecel - 0.5);
    showToast('✨ Powder Sprinkled!');
  }
});

// Toast Helper
const toastEl = document.getElementById('toast');
let toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

function checkGameOver() {
  const piecesLeft = pieces.filter(p => !p.isPotted && p.type !== 'striker').length;
  if (piecesLeft === 0) {
    // Show GameOver Leaderboard
    const sorted = [...players].sort((a, b) => b.score - a.score);
    const lbEl = document.getElementById('modal-leaderboard');
    lbEl.innerHTML = sorted.map((p, rank) => `
      <div class="lb-row ${rank === 0 ? 'first' : ''}">
        <span>${rank === 0 ? '🥇' : (rank === 1 ? '🥈' : '🥉')} ${p.name}</span>
        <span>${p.score} pts</span>
      </div>
    `).join('');
    document.getElementById('game-over-modal').classList.add('show');
    showToast(`🏆 Game Over! Winner: ${sorted[0].name} (${sorted[0].score} pts)!`);
    return true;
  }
  return false;
}

/* ==========================================================================
   MAIN RENDER & ANIMATION LOOP
   ========================================================================== */
let clock = new THREE.Clock();
let freeOrbitYaw = 0, freeOrbitPitch = 0.65, freeOrbitDist = 32;
const targetCamPos = new THREE.Vector3();
const targetCamLook = new THREE.Vector3();
const currentCamLook = new THREE.Vector3(0, 0, -1);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.04);

  updatePhysics(dt);

  // Turn State Transition & Real Carrom Multi-Player Progression
  if (turnState === 'ROLLING') {
    if (!areDisksMoving()) {
      turnState = 'RESETTING';
      setTimeout(() => {
        if (!checkGameOver()) {
          const curP = players[activePlayerIndex];

          // Real Carrom Rule: Potting piece without foul awards an EXTRA SHOT!
          if (pottedThisShot.length > 0 && !foulThisShot) {
            showToast(`🎯 Extra Shot! Strike Again, ${curP.name}!`);
          } else {
            // Pass turn to next player
            activePlayerIndex = (activePlayerIndex + 1) % numPlayers;
            showToast(`🎯 ${players[activePlayerIndex].name}'s Turn!`);
          }

          // Reset striker on active player's baseline
          if (striker) {
            const seat = getActiveSeat();
            const sliderVal = parseFloat(baselineSlider.value) || 0;
            const newPos = seat.getPos(sliderVal);
            striker.reset(newPos.x, newPos.y);
          }

          setAimRelative(0);
          renderScoreboard();
          turnState = 'AIMING';
          updateAimGuide();
          updateUIState();
        }
      }, 400);
    }
  }

  // Camera Smooth Lerp
  if (currentCamMode === 'overhead') {
    camera.position.lerp(new THREE.Vector3(0, 35, 1.0), 0.08);
    camera.lookAt(0, 0, -0.6);
  } else if (currentCamMode === 'player') {
    // Dynamic perspective matching the active player's seat!
    const seat = getActiveSeat();
    targetCamPos.set(seat.camPos[0], seat.camPos[1], seat.camPos[2]);
    targetCamLook.set(seat.camLook[0], seat.camLook[1], seat.camLook[2]);
    camera.position.lerp(targetCamPos, 0.06);
    currentCamLook.lerp(targetCamLook, 0.06);
    camera.lookAt(currentCamLook);
  } else if (currentCamMode === 'orbit') {
    const cx = Math.sin(freeOrbitYaw) * Math.cos(freeOrbitPitch) * freeOrbitDist;
    const cy = Math.sin(freeOrbitPitch) * freeOrbitDist;
    const cz = Math.cos(freeOrbitYaw) * Math.cos(freeOrbitPitch) * freeOrbitDist;
    camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.08);
    camera.lookAt(0, 0, 0);
  }

  renderer.render(scene, camera);
}

// Window Resize Handling
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Robust Bootloader
function bootCarrom() {
  if (typeof THREE === 'undefined') {
    setTimeout(bootCarrom, 40);
    return;
  }
  initPlayers(2); // Default 2 Players (1v1)
  rackCarrom('points');
  animate();
}

if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', bootCarrom);
} else {
  bootCarrom();
