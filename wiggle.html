<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eggplant Wiggle — AI Smarts</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Poppins:wght@400;600&display=swap');*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:#f6e7f2;color:#2c1830;font-family:Poppins,Arial;touch-action:none}canvas{display:block;width:100%;height:100%;cursor:grab}.home{position:fixed;top:20px;left:22px;z-index:2;color:#39203c;text-decoration:none;font:11px 'DM Mono',monospace}.home:before{content:'← ';color:#9f4e97}.guide{position:fixed;left:50%;top:50%;z-index:1;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:.35s}.guide.hide{opacity:0}.guide h1{margin:0;font:600 clamp(42px,7vw,88px)/.9 Poppins,sans-serif;letter-spacing:-.07em}.guide p{font-size:14px;color:#876b88}.note{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#967d97;font:11px 'DM Mono',monospace}@media(max-width:600px){.home{top:14px;left:15px}.guide h1{font-size:48px}.note{padding:0 20px}}</style></head><body><a class="home" href="index.html">all experiments</a><section class="guide" id="guide"><h1>Wiggle the<br>eggplant.</h1><p>Pull it around. Let it wobble.</p></section><p class="note">drag the 3D eggplant · release for maximum wiggle</p><script type="module">import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';const guide=document.querySelector('#guide');const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(0,.15,7);const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(r.domElement);scene.fog=new THREE.Fog('#f6e7f2',8,15);const group=new THREE.Group();scene.add(group);const light=new THREE.HemisphereLight('#fff8ff','#9f4c83',2.3);scene.add(light);const key=new THREE.DirectionalLight('#fff7f0',4);key.position.set(4,5,5);key.castShadow=true;scene.add(key);const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.ShadowMaterial({opacity:.17}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.45;floor.receiveShadow=true;scene.add(floor);const purple=new THREE.MeshPhysicalMaterial({color:'#68245f',roughness:.32,metalness:.04,clearcoat:.6,clearcoatRoughness:.35});const body=new THREE.Mesh(new THREE.SphereGeometry(1.25,64,64),purple);body.scale.set(.78,1.55,.78);body.rotation.z=-.18;body.castShadow=true;group.add(body);const capMat=new THREE.MeshPhysicalMaterial({color:'#4f9e57',roughness:.48,clearcoat:.2});const cap=new THREE.Mesh(new THREE.ConeGeometry(.73,.47,5),capMat);cap.position.set(-.17,1.85,0);cap.rotation.z=-.18;cap.castShadow=true;group.add(cap);for(let i=0;i<5;i++){const leaf=new THREE.Mesh(new THREE.ConeGeometry(.22,.65,3),capMat);leaf.position.set(-.17+Math.cos(i*1.256)*.25,1.8,Math.sin(i*1.256)*.25);leaf.rotation.set(Math.cos(i*1.256)*.65,0,Math.sin(i*1.256)*.65);group.add(leaf)}const stem=new THREE.Mesh(new THREE.CylinderGeometry(.1,.13,.55,16),capMat);stem.position.set(-.31,2.19,0);stem.rotation.z=-.25;group.add(stem);group.rotation.z=.12;let targetX=0,targetY=0,velX=0,velY=0,drag=false,lastX,lastY;function pos(e){return{x:e.clientX,y:e.clientY}}r.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;r.domElement.setPointerCapture(e.pointerId);guide.classList.add('hide')});r.domElement.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;velY=dx*.012;velX=dy*.012;targetY+=velY;targetX+=velX;lastX=e.clientX;lastY=e.clientY});r.domElement.addEventListener('pointerup',()=>drag=false);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});let t=0;function loop(){requestAnimationFrame(loop);t+=.016;if(!drag){velX+=-targetX*.09;velY+=-targetY*.09;velX*=.91;velY*=.91;targetX+=velX;targetY+=velY}group.rotation.x=targetX;group.rotation.y=targetY;group.rotation.z=.12+Math.sin(t*5)*velY*.15;group.position.y=-.25+Math.sin(t*7)*Math.min(.12,Math.abs(velY+velX)*.1);r.render(scene,camera)}loop();</script></body></html>
