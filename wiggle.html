<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Retro Laptop 2006 (ThinkRetro T42) — AI Smarts</title>
<meta name="description" content="An ultra-realistic 3D retro 2006 laptop with authentic mechanical keyboard clicks, HDD seek sounds, Windows startup chimes, playable Minesweeper, MSN RetroChat, HackerTyper, and Winamp chiptune synth player.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070913;
    --text: #e8ebf0;
    --muted: rgba(220, 230, 245, 0.55);
    --cyan: #00f0ff;
    --amber: #ffb703;
    --coral: #ff4757;
    --green: #10f59b;
    --purple: #8b5cf6;
    --mono: "Geist Mono", ui-monospace, "SF Mono", monospace;
    --display: "Funnel Display", -apple-system, sans-serif;
    --body: "Bricolage Grotesque", -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: var(--body);
    touch-action: none;
  }
  canvas#webgl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; cursor: grab; }
  canvas#webgl:active { cursor: grabbing; }

  /* TOP HUD */
  .hud {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    font: 12px/1.4 var(--mono); color: var(--muted);
  }
  .hud > * { pointer-events: auto; }

  .top-bar {
    position: absolute; top: 16px; left: 20px; right: 20px;
    display: flex; justify-content: space-between; align-items: center;
  }

  /* Left: Back Link & Device Tag */
  .hud-left {
    display: flex; align-items: center; gap: 12px;
  }
  .home-link {
    color: var(--text); text-decoration: none; font: 600 13px/1 var(--body);
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(15, 20, 32, 0.85); border: 1px solid rgba(255, 255, 255, 0.14);
    padding: 8px 16px; border-radius: 999px; backdrop-filter: blur(14px);
    transition: all 0.2s ease;
  }
  .home-link:hover { border-color: var(--cyan); color: #fff; transform: translateY(-1px); }
  .home-link span { color: var(--cyan); font-weight: 700; }

  .device-tag {
    background: rgba(15, 20, 32, 0.85); border: 1px solid rgba(255, 255, 255, 0.14);
    padding: 7px 16px; border-radius: 999px; backdrop-filter: blur(14px);
    display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted);
  }
  .device-tag b { color: #fff; font-weight: 600; }
  .led-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 8px var(--green); animation: led-blink 2s infinite;
  }
  @keyframes led-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* Center: Camera Angle Presets */
  .hud-center {
    position: absolute; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; background: rgba(15, 20, 32, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.14);
    padding: 5px; border-radius: 999px; backdrop-filter: blur(14px);
  }
  .view-btn {
    background: transparent; border: 0; color: var(--muted);
    font: 600 11px/1 var(--body); padding: 7px 14px; border-radius: 999px;
    cursor: pointer; transition: all 0.2s;
  }
  .view-btn:hover { color: #fff; }
  .view-btn.active {
    background: rgba(0, 240, 255, 0.18); border: 1px solid var(--cyan); color: #fff;
    box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
  }

  /* Right: Sound & Action Buttons */
  .hud-right {
    display: flex; align-items: center; gap: 8px;
  }
  .hud-btn {
    background: rgba(15, 20, 32, 0.85); border: 1px solid rgba(255, 255, 255, 0.14);
    padding: 8px 14px; border-radius: 999px; color: var(--text);
    font: 600 11px/1 var(--body); cursor: pointer; backdrop-filter: blur(14px);
    display: flex; align-items: center; gap: 6px; transition: all 0.2s;
  }
  .hud-btn:hover { border-color: var(--cyan); color: #fff; transform: translateY(-1px); }
  .hud-btn.active { background: var(--cyan); color: #000; border-color: var(--cyan); font-weight: 700; }

  /* Bottom Help Bar */
  .bottom-bar {
    position: absolute; bottom: 20px; left: 0; right: 0;
    display: flex; justify-content: center; pointer-events: none;
  }
  .hint-pill {
    background: rgba(15, 20, 32, 0.92); border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 999px; padding: 9px 24px;
    font: 500 12px/1 var(--mono); color: var(--muted);
    backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    display: flex; align-items: center; gap: 10px; pointer-events: auto;
  }
  .hint-pill b { color: var(--cyan); font-weight: 600; }
  .hint-badge {
    background: rgba(255, 255, 255, 0.1); padding: 3px 8px; border-radius: 6px;
    font: 700 11px/1 var(--mono); color: #fff;
  }

  /* SCREEN SHAKE ANIMATION ON MSN NUDGE */
  .shaking {
    animation: nudgeShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }
  @keyframes nudgeShake {
    10%, 90% { transform: translate3d(-3px, -1px, 0); }
    20%, 80% { transform: translate3d(4px, 2px, 0); }
    30%, 50%, 70% { transform: translate3d(-5px, -3px, 0); }
    40%, 60% { transform: translate3d(5px, 2px, 0); }
  }

  @media (max-width: 820px) {
    .top-bar { top: 12px; left: 12px; right: 12px; flex-wrap: wrap; gap: 8px; }
    .hud-center { position: static; transform: none; order: 3; width: 100%; justify-content: center; }
    .device-tag { display: none; }
    .bottom-bar { bottom: 14px; }
    .hint-pill { font-size: 11px; padding: 7px 14px; flex-wrap: wrap; justify-content: center; }
  }
</style>

<body>

<canvas id="webgl"></canvas>

<div class="hud" id="hud-root">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="hud-left">
      <a class="home-link" href="index.html">← <span>AI Smarts</span> / 2006</a>
      <div class="device-tag">
        <span class="led-dot"></span>
        <span>IBM <b>ThinkRetro T42</b> (Pentium M · 2006)</span>

    <!-- Center: View Presets -->
    <div class="hud-center">
      <button class="view-btn active" id="view-typing">⌨️ Typing View</button>

      <span class="hint-badge">DRAG TO ROTATE 3D</span>
      <span class="hint-badge">SCROLL TO ZOOM</span>

  </div>
</div>

<script>
/* ==========================================================================
   ADVANCED PROCEDURAL RETRO AUDIO ENGINE
   - Multi-layered mechanical keyboard clicks (different pitches for space, enter, letters)
   - Realistic 5400 RPM hard drive (HDD) seek/read head chutter
   - Windows 2000 / XP Startup Chime (synthesized polyphonic arpeggio)
   - Real 8-Bit Chiptune Synth Player for Winamp (Lead melody, bass, drums)
   - MSN Messenger "Ding" & Nudge Buzz
   - Realistic multi-stage 56k dial-up handshake
   ========================================================================== */
class RetroSoundEngine {
  constructor() {
    this.ctx = null;
    this.enabled = true;
    this.musicPlaying = false;
    this.musicTimer = null;
    this.musicStep = 0;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  // Realistic Dual-Phase Mechanical Key Click
  keyClick(type = 'normal') {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;

    // 1. Plastic impact click (Bandpassed noise)
    const dur = 0.032;
    const bufSize = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.18));
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = buf;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    const centerFreq = type === 'space' ? 950 : (type === 'enter' ? 1800 : (1600 + Math.random() * 600));
    filter.frequency.setValueAtTime(centerFreq, now);
    filter.Q.value = 3.5;

    const gain = this.ctx.createGain();
    const vol = type === 'space' ? 0.12 : 0.08;
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start(now);

    // 2. Mechanical bottom-out thud
    const osc = this.ctx.createOscillator();
    const oscGain = this.ctx.createGain();
    osc.type = 'sine';
    const basePitch = type === 'space' ? 95 : 170 + Math.random() * 30;
    osc.frequency.setValueAtTime(basePitch, now);
    osc.frequency.exponentialRampToValueAtTime(45, now + 0.04);
    oscGain.gain.setValueAtTime(0.09, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

    osc.connect(oscGain);
    oscGain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.045);

    // Trigger subtle HDD read click on occasional typing
    if (Math.random() < 0.35) {
      this.hddSeek();
    }
  }

  // Authentic 5400 RPM Hard Drive Seek Head Rattling
  hddSeek() {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const clicks = 2 + Math.floor(Math.random() * 3);
    for (let c = 0; c < clicks; c++) {
      const clickTime = now + c * 0.022;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1100 + Math.random() * 400, clickTime);
      osc.frequency.exponentialRampToValueAtTime(300, clickTime + 0.008);
      g.gain.setValueAtTime(0.03, clickTime);
      g.gain.exponentialRampToValueAtTime(0.0001, clickTime + 0.009);
      osc.connect(g);
      g.connect(this.ctx.destination);
      osc.start(clickTime);
      osc.stop(clickTime + 0.01);
    }
    // Blink hardware HDD LED
    flashHddLed();
  }

  // Windows 2000 / XP Polyphonic Startup Chime
  startupChime() {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    // Chime chords: Eb3, Bb3, Eb4, G4, Bb4, Eb5 with soft dreamy bell decay
    const notes = [
      { f: 155.56, t: 0.0, d: 2.2, v: 0.08 },
      { f: 233.08, t: 0.18, d: 2.0, v: 0.07 },
      { f: 311.13, t: 0.36, d: 1.8, v: 0.08 },
      { f: 392.00, t: 0.54, d: 1.6, v: 0.09 },
      { f: 466.16, t: 0.72, d: 1.5, v: 0.08 },
      { f: 622.25, t: 0.90, d: 2.5, v: 0.10 }
    ];
    notes.forEach(n => {
      const start = now + n.t;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(n.f, start);
      g.gain.setValueAtTime(0.001, start);
      g.gain.linearRampToValueAtTime(n.v, start + 0.08);
      g.gain.exponentialRampToValueAtTime(0.0001, start + n.d);

      // Add warmth with soft chorus overtone
      const osc2 = this.ctx.createOscillator();
      const g2 = this.ctx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(n.f * 2, start);
      g2.gain.setValueAtTime(0.001, start);
      g2.gain.linearRampToValueAtTime(n.v * 0.35, start + 0.05);
      g2.gain.exponentialRampToValueAtTime(0.0001, start + n.d * 0.7);

      osc.connect(g); g.connect(this.ctx.destination);
      osc2.connect(g2); g2.connect(this.ctx.destination);
      osc.start(start); osc.stop(start + n.d + 0.05);
      osc2.start(start); osc2.stop(start + n.d + 0.05);
    });
  }

  // Windows Critical Stop / Error Ding
  errorChord() {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    [180, 240, 360].forEach(f => {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(f, now);
      g.gain.setValueAtTime(0.05, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
      osc.connect(g); g.connect(this.ctx.destination);
      osc.start(now); osc.stop(now + 0.36);
    });
  }

  // MSN Messenger Notification Ding (du-ting!)
  msnDing() {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const tones = [740, 987]; // F#5 -> B5
    tones.forEach((freq, idx) => {
      const start = now + idx * 0.09;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, start);
      g.gain.setValueAtTime(0.09, start);
      g.gain.exponentialRampToValueAtTime(0.0001, start + 0.18);
      osc.connect(g); g.connect(this.ctx.destination);
      osc.start(start); osc.stop(start + 0.2);
    });
  }

  // MSN Nudge Buzz + Screen Shake
  msnNudge() {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    // Dual buzzer sound
    for (let i = 0; i < 2; i++) {
      const t = now + i * 0.16;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(85, t);
      osc.frequency.linearRampToValueAtTime(110, t + 0.08);
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
      osc.connect(g); g.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.14);
    }
    // Shake screen in 3D
    triggerScreenShake();
  }

  // 56k Dial-Up Modem Handshake
  dialup() {
    if (!this.enabled || !this.ctx) return;
    const t0 = this.ctx.currentTime;

    // 1. Dial tone (350Hz + 440Hz)
    const dt1 = this.ctx.createOscillator();
    const dt2 = this.ctx.createOscillator();
    const gDial = this.ctx.createGain();
    dt1.frequency.setValueAtTime(350, t0);
    dt2.frequency.setValueAtTime(440, t0);
    gDial.gain.setValueAtTime(0.04, t0);
    gDial.gain.setValueAtTime(0, t0 + 0.4);
    dt1.connect(gDial); dt2.connect(gDial); gDial.connect(this.ctx.destination);
    dt1.start(t0); dt2.start(t0); dt1.stop(t0 + 0.45); dt2.stop(t0 + 0.45);

    // 2. DTMF Touch Tones
    const dtmfPairs = [
      [697, 1209], [770, 1336], [852, 1477], [697, 1336],
      [770, 1209], [852, 1336], [941, 1477]
    ];
    dtmfPairs.forEach((pair, idx) => {
      const t = t0 + 0.5 + idx * 0.07;
      const o1 = this.ctx.createOscillator();
      const o2 = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o1.frequency.setValueAtTime(pair[0], t);
      o2.frequency.setValueAtTime(pair[1], t);
      g.gain.setValueAtTime(0.035, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);
      o1.connect(g); o2.connect(g); g.connect(this.ctx.destination);
      o1.start(t); o2.start(t); o1.stop(t + 0.06); o2.stop(t + 0.06);
    });

    // 3. Carrier Handshake Squeal & Static
    const carrierT = t0 + 1.1;
    const oscC = this.ctx.createOscillator();
    const gC = this.ctx.createGain();
    oscC.type = 'sawtooth';
    oscC.frequency.setValueAtTime(2100, carrierT);
    oscC.frequency.linearRampToValueAtTime(1400, carrierT + 0.3);
    oscC.frequency.linearRampToValueAtTime(1850, carrierT + 0.6);
    gC.gain.setValueAtTime(0.04, carrierT);
    gC.gain.exponentialRampToValueAtTime(0.001, carrierT + 0.85);
    oscC.connect(gC); gC.connect(this.ctx.destination);
    oscC.start(carrierT); oscC.stop(carrierT + 0.9);
  }

  // Clamshell Hinge Creak
  hingeSnap() {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(110, now);
    osc.frequency.exponentialRampToValueAtTime(35, now + 0.16);
    g.gain.setValueAtTime(0.06, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.2);
  }

  // Minesweeper Cell Click / Reveal
  mineClick() {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(650, now);
    osc.frequency.exponentialRampToValueAtTime(250, now + 0.05);
    g.gain.setValueAtTime(0.06, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.055);
  }

  // Minesweeper Bomb Explosion
  mineBomb() {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const dur = 0.45;
    const bufSize = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.25));
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = buf;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(300, now);
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
    noise.start(now);
  }

  // Real-Time Winamp Chiptune Synthesizer Engine
  toggleMusic() {
    this.init();
    this.musicPlaying = !this.musicPlaying;
    if (this.musicPlaying) {
      this.playChiptuneStep();
    } else {
      clearTimeout(this.musicTimer);
    }
    return this.musicPlaying;
  }

  playChiptuneStep() {
    if (!this.musicPlaying || !this.enabled || !this.ctx) return;

    // Upbeat 2000s tracker melody (Pentatonic chiptune in D-minor)
    const melody = [
      293.66, 329.63, 349.23, 440.00, 523.25, 440.00, 349.23, 329.63,
      293.66, 349.23, 440.00, 587.33, 523.25, 440.00, 392.00, 349.23
    ];
    const bass = [146.83, 146.83, 174.61, 174.61, 130.81, 130.81, 196.00, 196.00];

    const now = this.ctx.currentTime;
    const note = melody[this.musicStep % melody.length];
    const bassNote = bass[Math.floor(this.musicStep / 2) % bass.length];

    // Lead Pulse Synth
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(note, now);
    g.gain.setValueAtTime(0.025, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.13);

    // Bass Synth
    if (this.musicStep % 2 === 0) {
      const bOsc = this.ctx.createOscillator();
      const bG = this.ctx.createGain();
      bOsc.type = 'triangle';
      bOsc.frequency.setValueAtTime(bassNote, now);
      bG.gain.setValueAtTime(0.05, now);
      bG.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      bOsc.connect(bG); bG.connect(this.ctx.destination);
      bOsc.start(now); bOsc.stop(now + 0.24);
    }

    // Hi-Hat Tick
    if (this.musicStep % 4 === 2) {
      const dur = 0.02;
      const b = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * dur), this.ctx.sampleRate);
      const bd = b.getChannelData(0);
      for (let i = 0; i < bd.length; i++) bd[i] = (Math.random() * 2 - 1) * 0.02;
      const src = this.ctx.createBufferSource();
      src.buffer = b;
      src.connect(this.ctx.destination);
      src.start(now);
    }

    this.musicStep++;
    this.musicTimer = setTimeout(() => this.playChiptuneStep(), 135);
  }
}

/* ==========================================================================
   MINESWEEPER GAME ENGINE (Runs inside Retro OS Screen)
   ========================================================================== */
class Minesweeper {
  constructor(rows = 8, cols = 8, bombCount = 10) {
    this.rows = rows;
    this.cols = cols;
    this.bombCount = bombCount;
    this.reset();
  }

  reset() {
    this.grid = Array(this.rows * this.cols).fill(0);
    this.revealed = Array(this.rows * this.cols).fill(false);
    this.flagged = Array(this.rows * this.cols).fill(false);
    this.gameOver = false;
    this.won = false;
    this.started = false;
    this.smileState = 'normal'; // 'normal' | 'scared' | 'dead' | 'cool'
  }

  placeBombs(firstClickIdx) {
    let placed = 0;
    while (placed < this.bombCount) {
      const idx = Math.floor(Math.random() * (this.rows * this.cols));
      if (idx !== firstClickIdx && this.grid[idx] !== -1) {
        this.grid[idx] = -1;
        placed++;
      }
    }
    // Calculate neighboring numbers
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        const i = r * this.cols + c;
        if (this.grid[i] === -1) continue;
        let count = 0;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) {
              if (this.grid[nr * this.cols + nc] === -1) count++;
            }
          }
        }
        this.grid[i] = count;
      }
    }
    this.started = true;
  }

  reveal(r, c) {
    if (this.gameOver || this.won) return;
    const idx = r * this.cols + c;
    if (this.flagged[idx] || this.revealed[idx]) return;

    if (!this.started) {
      this.placeBombs(idx);
    }

    if (this.grid[idx] === -1) {
      // Hit a bomb!
      this.revealed[idx] = true;
      this.gameOver = true;
      this.smileState = 'dead';
      sfx.mineBomb();
      return;
    }

    // Normal safe reveal
    sfx.mineClick();
    this.floodFill(r, c);

    // Win check
    let unrevealedSafe = 0;
    for (let i = 0; i < this.grid.length; i++) {
      if (this.grid[i] !== -1 && !this.revealed[i]) unrevealedSafe++;
    }
    if (unrevealedSafe === 0) {
      this.won = true;
      this.smileState = 'cool';
      sfx.msnDing();
    }
  }

  floodFill(r, c) {
    if (r < 0 || r >= this.rows || c < 0 || c >= this.cols) return;
    const idx = r * this.cols + c;
    if (this.revealed[idx] || this.flagged[idx]) return;

    this.revealed[idx] = true;
    if (this.grid[idx] === 0) {
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr !== 0 || dc !== 0) {
            this.floodFill(r + dr, c + dc);
          }
        }
      }
    }
  }

  toggleFlag(r, c) {
    if (this.gameOver || this.won) return;
    const idx = r * this.cols + c;
    if (this.revealed[idx]) return;
    this.flagged[idx] = !this.flagged[idx];
    sfx.keyClick('space');
  }
}

laptopGroup.add(tpBtnL);
laptopGroup.add(tpBtnR);

// Upper TrackPoint Mouse Buttons (Left, Center Blue Scroll, Right)
const tpUpperL = new THREE.Mesh(new THREE.BoxGeometry(0.27, 0.015, 0.14), keycapMat);
tpUpperL.position.set(-0.28, baseHeight + 0.008, 0.38);
const tpUpperMid = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.015, 0.14), enterKeyMat);
tpUpperMid.position.set(0, baseHeight + 0.008, 0.38);
const tpUpperR = new THREE.Mesh(new THREE.BoxGeometry(0.27, 0.015, 0.14), keycapMat);
tpUpperR.position.set(0.28, baseHeight + 0.008, 0.38);
laptopGroup.add(tpUpperL);
laptopGroup.add(tpUpperMid);
laptopGroup.add(tpUpperR);

// ThinkPad Logo Badge in bottom-right corner
const badgeGeo = new THREE.PlaneGeometry(0.35, 0.14);
const badgeMat = new THREE.MeshBasicMaterial({ color: '#e2e8f0' });
const badge = new THREE.Mesh(badgeGeo, badgeMat);
badge.rotation.x = -Math.PI / 2;
badge.position.set(1.2, baseHeight + 0.005, 0.92);
laptopGroup.add(badge);

// Glowing Red LED Dot on the 'i' of ThinkPad
const badgeLed = new THREE.Mesh(new THREE.SphereGeometry(0.014, 8, 8), new THREE.MeshBasicMaterial({ color: '#ff2244' }));
badgeLed.position.set(1.32, baseHeight + 0.008, 0.88);
laptopGroup.add(badgeLed);

// Hardware Exhaust Vents on left side
for (let v = 0; v < 6; v++) {
  const ventSlot = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.07, 0.12), new THREE.MeshBasicMaterial({ color: '#000000' }));
  ventSlot.position.set(-baseWidth * 0.5 - 0.001, baseHeight * 0.5, -0.6 + v * 0.18);
  laptopGroup.add(ventSlot);
}

// Side Ports: USB & VGA Out
const usbPort = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.04, 0.14), metalPortMat);
usbPort.position.set(-baseWidth * 0.5 - 0.002, baseHeight * 0.5, 0.5);
laptopGroup.add(usbPort);

const vgaPort = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.06, 0.24), new THREE.MeshStandardMaterial({ color: '#1d4ed8' }));
vgaPort.position.set(-baseWidth * 0.5 - 0.002, baseHeight * 0.5, -0.05);
laptopGroup.add(vgaPort);

// DVD-ROM Drive on right side
const dvdSeam = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.09, 1.2), new THREE.MeshBasicMaterial({ color: '#090a0d' }));
dvdSeam.position.set(baseWidth * 0.5 + 0.001, baseHeight * 0.5, 0.0);
laptopGroup.add(dvdSeam);

// 3D KEYBOARD KEYS
const keysList = [];
const rows = 5, cols = 14;
const keyW = 0.165, keyD = 0.155, keyH = 0.04;
const startX = -1.16, startZ = -0.78;

for (let r = 0; r < rows; r++) {
  for (let c = 0; c < cols; c++) {
    // Spacebar
    if (r === 4 && c >= 4 && c <= 8) {
      if (c === 4) {
        const spaceMesh = new THREE.Mesh(new THREE.BoxGeometry(keyW * 5.2, keyH, keyD), keycapMat);
        spaceMesh.position.set(0, baseHeight + keyH * 0.5, startZ + r * 0.205);
        spaceMesh.castShadow = true;
        spaceMesh.userData = { isSpace: true };
        laptopGroup.add(spaceMesh);
        keysList.push(spaceMesh);
      }
      continue;
    }
    // Enter Key in ThinkPad Blue
    const isEnter = (r === 2 && c === cols - 1);
    const meshMat = isEnter ? enterKeyMat : keycapMat;
    const keyMesh = new THREE.Mesh(new THREE.BoxGeometry(isEnter ? keyW * 1.6 : keyW, keyH, keyD), meshMat);
    keyMesh.position.set(startX + c * 0.18, baseHeight + keyH * 0.5, startZ + r * 0.205);
    keyMesh.castShadow = true;
    keyMesh.userData = { isEnter, isSpace: false };
    laptopGroup.add(keyMesh);
    keysList.push(keyMesh);
  }
}

// Iconic Red TrackPoint Nub between G, H, B
const trackpoint = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.05, 16), trackpointMat);
trackpoint.position.set(0, baseHeight + 0.042, -0.37);
laptopGroup.add(trackpoint);

// 2. CLAMSHELL SCREEN LID & HINGE
const lidGroup = new THREE.Group();
lidGroup.position.set(0, baseHeight, -baseDepth * 0.5);
laptopGroup.add(lidGroup);

// Brushed Metal Hinges
const hingeGeo = new THREE.CylinderGeometry(0.045, 0.045, 0.24, 16);
const hingeL = new THREE.Mesh(hingeGeo, metalPortMat);
hingeL.rotation.z = Math.PI * 0.5;
hingeL.position.set(-1.12, 0, 0);
lidGroup.add(hingeL);

const hingeR = new THREE.Mesh(hingeGeo, metalPortMat);
hingeR.rotation.z = Math.PI * 0.5;
hingeR.position.set(1.12, 0, 0);
lidGroup.add(hingeR);

// Screen Bezel Shell
const lidHeight = 2.15, lidThickness = 0.085;
const lidBezel = new THREE.Mesh(new THREE.BoxGeometry(baseWidth, lidHeight, lidThickness), chassisMat);
lidBezel.position.set(0, lidHeight * 0.5, -lidThickness * 0.5);
lidBezel.castShadow = true;
lidGroup.add(lidBezel);

// Screen LCD Panel
const screenPanel = new THREE.Mesh(new THREE.PlaneGeometry(2.65, 1.8), screenGlassMat);
screenPanel.position.set(0, lidHeight * 0.5 + 0.03, 0.005);
lidGroup.add(screenPanel);

// Status Indicator LED Bar (Power, Battery, HDD activity, WiFi)
const ledColors = ['#10f59b', '#10f59b', '#ffb703', '#00f0ff'];
const statusLeds = [];
for (let i = 0; i < 4; i++) {
  const led = new THREE.Mesh(new THREE.SphereGeometry(0.015, 8, 8), new THREE.MeshBasicMaterial({ color: ledColors[i] }));
  led.position.set(-0.35 + i * 0.22, 0.08, 0.01);
  lidGroup.add(led);
  statusLeds.push(led);
}

function flashHddLed() {
  const hddLed = statusLeds[2];
  if (hddLed) {
    hddLed.material.color.set('#ffffff');
    setTimeout(() => { hddLed.material.color.set('#ffb703'); }, 80);
  }
}

// ThinkLight keyboard illuminator LED at top of screen bezel
const thinkLight = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 8), new THREE.MeshBasicMaterial({ color: '#fffae0' }));
thinkLight.position.set(0, lidHeight - 0.04, 0.01);
lidGroup.add(thinkLight);

// Default lid open angle (-0.24 rad = ~14 deg backward tilt)
let targetLidAngle = -0.24;
let currentLidAngle = targetLidAngle;
lidGroup.rotation.x = currentLidAngle;

/* ==========================================================================
   PHYSICAL TYPING, KEY DEPRESSION & SOUND DISPATCH
   ========================================================================== */
function pressPhysicalKey(targetKey = null) {
  sfx.init();

  const key = targetKey || keysList[Math.floor(Math.random() * keysList.length)];
  const isSpace = key && key.userData && key.userData.isSpace;
  const isEnter = key && key.userData && key.userData.isEnter;

  // Sound
  sfx.keyClick(isSpace ? 'space' : (isEnter ? 'enter' : 'normal'));

  // Mechanical Key Depression Animation
  if (key) {
    key.position.y -= 0.026;
    setTimeout(() => { key.position.y += 0.026; }, 85);
  }

  // Active App Input Dispatch
  if (activeApp === 'terminal') {
    terminalLines.push(codeSnippets[snippetIdx % codeSnippets.length]);
    snippetIdx++;
    if (terminalLines.length > 45) terminalLines.shift();
  } else if (activeApp === 'chat') {
    if (Math.random() < 0.3) {
      const buddies = ["xX_CoolGamer_06_Xx", "Sk8er_Girl_06", "StarGazer"];
      const replies = [
        "lol that's awesome! type more :D",
        "brb downloading more RAM on Limewire",
        "check out my new MySpace top 8!",
        "whoa check that matrix code in terminal!"
      ];
      chatMessages.push({
        user: buddies[Math.floor(Math.random() * buddies.length)],
        text: replies[Math.floor(Math.random() * replies.length)],
        time: "11:47 PM"
      });
      if (chatMessages.length > 7) chatMessages.shift();
      sfx.msnDing();
    }
  } else if (activeApp === 'winamp') {
    // Spacebar toggles music
    if (isSpace) {
      sfx.toggleMusic();
    }
  }
}

window.addEventListener('keydown', (e) => {
  pressPhysicalKey();
});

/* ==========================================================================
   CAMERA PRESETS & INTERACTIVE ORBIT CONTROLS
   ========================================================================== */
const cameraPresets = {
  typing: { pos: new THREE.Vector3(0, 2.3, 3.3), target: new THREE.Vector3(0, 0.5, -0.3) },
  screen: { pos: new THREE.Vector3(0, 1.45, 1.95), target: new THREE.Vector3(0, 1.25, -0.95) },
  orbit:  { pos: new THREE.Vector3(2.8, 2.5, 3.5), target: new THREE.Vector3(0, 0.45, 0) }
};
let activePreset = 'typing';
let targetCamPos = cameraPresets.typing.pos.clone();
let targetCamLook = cameraPresets.typing.target.clone();

function setCameraPreset(mode) {
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`view-${mode}`).classList.add('active');
  activePreset = mode;
  targetCamPos = cameraPresets[mode].pos.clone();
  targetCamLook = cameraPresets[mode].target.clone();
}
document.getElementById('view-typing').addEventListener('click', () => setCameraPreset('typing'));
document.getElementById('view-screen').addEventListener('click', () => setCameraPreset('screen'));
document.getElementById('view-orbit').addEventListener('click', () => setCameraPreset('orbit'));

// Free Mouse Drag to Rotate 3D View
let isDragging3D = false;
let prevMouseX = 0, prevMouseY = 0;
let orbitYaw = 0, orbitPitch = 0.45, orbitDist = 4.2;

canvas3D.addEventListener('mousedown', e => {
  isDragging3D = true;
  prevMouseX = e.clientX;
  prevMouseY = e.clientY;
});

window.addEventListener('mousemove', e => {
  if (!isDragging3D) return;
  const dx = e.clientX - prevMouseX;
  const dy = e.clientY - prevMouseY;
  prevMouseX = e.clientX;
  prevMouseY = e.clientY;

  orbitYaw -= dx * 0.006;
  orbitPitch = Math.max(0.08, Math.min(Math.PI / 2 - 0.08, orbitPitch + dy * 0.006));

  if (activePreset === 'orbit') {
    targetCamPos.set(
      Math.sin(orbitYaw) * Math.cos(orbitPitch) * orbitDist,
      Math.sin(orbitPitch) * orbitDist + 0.4,
      Math.cos(orbitYaw) * Math.cos(orbitPitch) * orbitDist
    );
  }
});

window.addEventListener('mouseup', () => { isDragging3D = false; });

window.addEventListener('wheel', e => {
  orbitDist = Math.max(1.8, Math.min(6.5, orbitDist + e.deltaY * 0.004));
  if (activePreset === 'orbit') {
    targetCamPos.set(
      Math.sin(orbitYaw) * Math.cos(orbitPitch) * orbitDist,
      Math.sin(orbitPitch) * orbitDist + 0.4,
      Math.cos(orbitYaw) * Math.cos(orbitPitch) * orbitDist
    );
  }
});

/* ==========================================================================
   RAYCAST INTERACTIVITY: CLICK KEYS & CLICK SCREEN APPS
   ========================================================================== */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

canvas3D.addEventListener('pointermove', e => {
  mouse.x = (e.clientX / W) * 2 - 1;
  mouse.y = -(e.clientY / H) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // Check if mouse hovers over screen to update Windows mouse cursor
  const screenHits = raycaster.intersectObject(screenPanel);
  if (screenHits.length > 0 && screenHits[0].uv) {
    const uv = screenHits[0].uv;
    cursorCanvasX = uv.x * 1024;
    cursorCanvasY = (1 - uv.y) * 768;
  }
});

canvas3D.addEventListener('click', e => {
  sfx.init();
  mouse.x = (e.clientX / W) * 2 - 1;
  mouse.y = -(e.clientY / H) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // 1. Check Key Click
  const keyHits = raycaster.intersectObjects(keysList);
  if (keyHits.length > 0) {
    pressPhysicalKey(keyHits[0].object);
    return;
  }

  // 2. Check Trackpad Click
  const tpHits = raycaster.intersectObjects([trackpad, tpBtnL, tpBtnR, tpUpperL, tpUpperR]);
  if (tpHits.length > 0) {
    sfx.keyClick();
    return;
  }

  // 3. Check Screen Click
  const screenHits = raycaster.intersectObject(screenPanel);
  if (screenHits.length > 0 && screenHits[0].uv) {
    const uv = screenHits[0].uv;
    const sx = uv.x * 1024;
    const sy = (1 - uv.y) * 768;

    // Check Desktop Icon Clicks
    if (sx < 120) {
      if (sy >= 30 && sy < 110) activeApp = 'terminal';
      else if (sy >= 130 && sy < 210) activeApp = 'terminal';
      else if (sy >= 230 && sy < 310) activeApp = 'chat';
      else if (sy >= 330 && sy < 410) activeApp = 'winamp';
      else if (sy >= 430 && sy < 510) activeApp = 'minesweeper';
      sfx.keyClick('enter');
      sfx.hddSeek();
      return;
    }

    // Check Window Close Button (Top-Right of Window)
    if (sx > 940 && sx < 980 && sy > 40 && sy < 75) {
      activeApp = activeApp === 'terminal' ? 'chat' : (activeApp === 'chat' ? 'winamp' : (activeApp === 'winamp' ? 'minesweeper' : 'terminal'));
      sfx.keyClick();
      return;
    }

    // Check MSN Nudge Button
    if (activeApp === 'chat' && sx > 840 && sx < 960 && sy > 85 && sy < 125) {
      sfx.msnNudge();
      return;
    }

    // Check Winamp Play/Pause
    if (activeApp === 'winamp') {
      if (sy > 630 && sy < 690) {
        if (sx > 400 && sx < 540) sfx.toggleMusic();
        else if (sx > 560 && sx < 700) { sfx.musicPlaying = false; clearTimeout(sfx.musicTimer); }
      }
      return;
    }

    // Check Minesweeper Cell Click
    if (activeApp === 'minesweeper') {
      const mx = 135 + 834 * 0.5 - 200;
      const my = 40 + 40;
      // Smiley reset button
      if (sx > mx + 175 && sx < mx + 225 && sy > my + 15 && sy < my + 65) {
        minesweeper.reset();
        sfx.keyClick('enter');
        return;
      }
      // Grid cells
      const cellSize = 42;
      const gridStartX = mx + (400 - 8 * cellSize) * 0.5;
      const gridStartY = my + 90;
      const col = Math.floor((sx - gridStartX) / cellSize);
      const row = Math.floor((sy - gridStartY) / cellSize);
      if (row >= 0 && row < minesweeper.rows && col >= 0 && col < minesweeper.cols) {
        if (e.shiftKey || e.button === 2) {
          minesweeper.toggleFlag(row, col);
        } else {
          minesweeper.reveal(row, col);
        }
      }
      return;
    }

    // Default screen click: Advance Hacker terminal
    pressPhysicalKey();
  }
});

function triggerScreenShake() {
  document.getElementById('hud-root').classList.add('shaking');
  setTimeout(() => document.getElementById('hud-root').classList.remove('shaking'), 400);
}

/* ==========================================================================
   HUD BUTTON ACTIONS
   ========================================================================== */
document.getElementById('startup-btn').addEventListener('click', () => {
  sfx.init();
  sfx.startupChime();
  flashHddLed();
});

document.getElementById('modem-btn').addEventListener('click', () => {
  sfx.init();
  sfx.dialup();
});

const lidBtn = document.getElementById('lid-btn');
let lidClosed = false;
lidBtn.addEventListener('click', () => {
  sfx.init();
  sfx.hingeSnap();
  lidClosed = !lidClosed;
  targetLidAngle = lidClosed ? 1.55 : -0.24;
  lidBtn.textContent = lidClosed ? '📂 Open Lid' : '📁 Close Lid';
  lidBtn.classList.toggle('active', lidClosed);
});

const soundBtn = document.getElementById('sound-btn');
soundBtn.addEventListener('click', () => {
  sfx.init();
  sfx.enabled = !sfx.enabled;
  soundBtn.textContent = sfx.enabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
});

window.addEventListener('resize', () => {
  W = window.innerWidth;
  H = window.innerHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

/* ==========================================================================
   MAIN RENDER LOOP
   ========================================================================== */
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  // Smooth Lid Opening/Closing
  currentLidAngle += (targetLidAngle - currentLidAngle) * 0.12;
  lidGroup.rotation.x = currentLidAngle;

  // Smooth Camera Motion to Target
  camera.position.lerp(targetCamPos, 0.08);
  camera.lookAt(targetCamLook);

  // Subtle floating rotation in orbit mode when not dragging
  if (activePreset === 'orbit' && !isDragging3D) {
    laptopGroup.rotation.y = Math.sin(time * 0.35) * 0.25;
  } else {
    laptopGroup.rotation.y = 0;
  }

  // Draw 2D Retro OS Screen onto Three.js CanvasTexture
  drawRetroScreen(time);
  screenTexture.needsUpdate = true;

  renderer.render(scene, camera);
}

// Initial Boot: Play subtle startup sound on first interaction
window.addEventListener('pointerdown', () => {
  sfx.init();
}, { once: true });

drawRetroScreen(0);
animate();
</script>
