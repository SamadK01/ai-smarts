<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/png" href="favicon.png">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PROJECT SERENADE — Lumina Grand Piano & Relaxing Ambient Sanctuary</title>
<meta name="description" content="A deeply relaxing, aesthetic acoustic felt piano and ambient sanctuary. Pure procedural Web Audio synthesis, lush cathedral reverberation, falling note waterfall visualizer, relaxing ambient rain and fire soundscapes, and calming classical auto-play.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700&family=Funnel+Display:wght@600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --theme-bg: #070913;
    --theme-glow: #818cf8;
    --theme-accent: #a5b4fc;
    --theme-gold: #fbbf24;
    --panel-bg: rgba(13, 17, 34, 0.82);
    --panel-border: rgba(165, 180, 252, 0.22);
    --font-mono: 'Geist Mono', monospace;
    --font-display: 'Funnel Display', sans-serif;
    --font-ui: 'Bricolage Grotesque', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--theme-bg); color: #f8fafc;
    font-family: var(--font-ui); touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  /* Full App Layout */
  .app-wrap {
    display: flex; flex-direction: column; width: 100vw; height: 100vh;
    height: 100dvh; position: relative; overflow: hidden;
    background: radial-gradient(circle at 50% 25%, #151b38, #070913 75%);
  }

  /* Canvas Visualizer: Stardust, Ripples & Falling Notes */
  #fx-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 2;
  }

  /* Top Navigation & Controls */
  .top-deck {
    position: relative; z-index: 10; display: flex;
    justify-content: space-between; align-items: center;
    padding: 12px 18px; gap: 12px; flex-wrap: wrap;
    background: var(--panel-bg); backdrop-filter: blur(16px);
    border-bottom: 1.5px solid var(--panel-border);
    box-shadow: 0 4px 24px rgba(0,0,0,0.45);
  }

  .brand-group {
    display: flex; align-items: center; gap: 12px;
  }
  .serenade-badge {
    background: rgba(165, 180, 252, 0.15); border: 1px solid var(--theme-accent);
    color: var(--theme-accent); font-family: var(--font-mono); font-size: 0.65rem;
    font-weight: 800; padding: 3px 8px; border-radius: 6px; letter-spacing: 1px;
  }
  .brand-title {
    font-family: var(--font-display); font-size: 1.25rem; font-weight: 800;
    color: #fff; letter-spacing: 0.5px;
  }
  .brand-title span { color: var(--theme-accent); text-shadow: 0 0 12px rgba(165, 180, 252, 0.5); }

  /* Deck Action Buttons */
  .deck-actions {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  }
  .btn-serenade {
    background: rgba(255, 255, 255, 0.06); border: 1px solid var(--panel-border);
    color: #e2e8f0; font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700;
    padding: 6px 12px; border-radius: 8px; cursor: pointer;
    backdrop-filter: blur(8px); transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    display: inline-flex; align-items: center; gap: 5px; text-decoration: none;
  }
  .btn-serenade:hover {
    background: rgba(165, 180, 252, 0.22); border-color: var(--theme-accent);
    color: #fff; transform: translateY(-1px); box-shadow: 0 0 14px rgba(165, 180, 252, 0.35);
  }
  .btn-serenade.active {
    background: var(--theme-accent); color: #000; font-weight: 800;
    box-shadow: 0 0 18px var(--theme-glow);
  }
  .btn-sustain.active {
    background: var(--theme-gold); color: #000; border-color: var(--theme-gold);
    box-shadow: 0 0 18px rgba(251, 191, 36, 0.55);
  }

  /* Middle Ambient Atmosphere Bar */
  .ambient-bar {
    position: relative; z-index: 10; display: flex;
    justify-content: space-between; align-items: center;
    padding: 8px 18px; gap: 14px; flex-wrap: wrap;
    background: rgba(10, 13, 26, 0.65); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 0.72rem;
  }

  .ambient-group {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .ambient-item {
    display: flex; align-items: center; gap: 6px; color: #94a3b8;
  }
  .ambient-item input[type=range] {
    -webkit-appearance: none; width: 68px; height: 4px; border-radius: 2px;
    background: rgba(255, 255, 255, 0.2); outline: none; cursor: pointer;
  }
  .ambient-item input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: var(--theme-accent); cursor: pointer;
  }

  .song-selector {
    display: flex; align-items: center; gap: 6px;
  }
  .select-song {
    background: rgba(15, 23, 42, 0.85); border: 1px solid var(--panel-border);
    color: #fff; font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700;
    padding: 5px 8px; border-radius: 6px; outline: none; cursor: pointer;
  }

  /* Center Visual Waterfall Area */
  .waterfall-view {
    flex: 1; position: relative; z-index: 5;
    overflow: hidden; pointer-events: none;
    display: flex; flex-direction: column; justify-content: flex-end;
  }

  .zen-quote {
    position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none; opacity: 0.75;
    transition: opacity 0.5s ease;
  }
  .zen-quote h3 {
    font-family: var(--font-display); font-size: clamp(1.1rem, 2.8vw, 1.8rem);
    font-weight: 600; color: #e0e7ff; letter-spacing: 0.5px;
    text-shadow: 0 0 20px rgba(165, 180, 252, 0.4); margin-bottom: 4px;
  }
  .zen-quote p {
    font-size: 0.75rem; color: #94a3b8; font-family: var(--font-mono);
  }

  /* Bottom Chord Assistance Strip */
  .chord-strip {
    position: relative; z-index: 10; display: flex;
    justify-content: center; gap: 6px; padding: 6px 14px;
    background: rgba(7, 9, 19, 0.75); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255, 255, 255, 0.08); flex-wrap: wrap;
  }
  .btn-chord {
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(165, 180, 252, 0.18);
    color: #cbd5e1; font-family: var(--font-mono); font-size: 0.68rem; font-weight: 800;
    padding: 4px 10px; border-radius: 6px; cursor: pointer; transition: all 0.15s;
  }
  .btn-chord:hover, .btn-chord:active {
    background: var(--theme-accent); color: #000; transform: scale(1.05);
    box-shadow: 0 0 12px var(--theme-glow);
  }

  /* Piano Keyboard Container */
  .keyboard-shell {
    position: relative; z-index: 15; width: 100%;
    background: #090c17; border-top: 2px solid rgba(165, 180, 252, 0.3);
    padding: 6px 8px 12px; box-shadow: 0 -10px 40px rgba(0,0,0,0.65);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    touch-action: none;
  }

  .keyboard-bar {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 1100px; padding: 0 4px; font-size: 0.68rem;
    color: #94a3b8; font-family: var(--font-mono); font-weight: 700;
  }
  .octave-btns { display: flex; gap: 6px; align-items: center; }
  .btn-oct {
    background: rgba(255, 255, 255, 0.08); border: 1px solid var(--panel-border);
    color: #fff; font-size: 0.65rem; font-weight: 800; padding: 3px 8px;
    border-radius: 4px; cursor: pointer;
  }

  /* Piano Keys Rack */
  .piano-keys-wrap {
    display: flex; position: relative; width: 100%; max-width: 1100px;
    height: clamp(140px, 22vh, 210px); touch-action: none;
    border-radius: 10px; overflow: hidden; box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
    background: #111422;
  }

  /* White Keys */
  .white-key {
    flex: 1; height: 100%; background: linear-gradient(180deg, #fdfdfd 0%, #e2e8f0 82%, #cbd5e1 100%);
    border-right: 1px solid #64748b; border-bottom: 4px solid #94a3b8;
    border-radius: 0 0 6px 6px; cursor: pointer; position: relative;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 8px; color: #475569; font-family: var(--font-mono);
    font-size: 0.68rem; font-weight: 800; transition: background 0.08s, transform 0.05s;
    touch-action: none;
  }
  .white-key:last-child { border-right: none; }
  .white-key:active, .white-key.active {
    background: linear-gradient(180deg, #c7d2fe 0%, #a5b4fc 80%, #818cf8 100%);
    border-bottom: 2px solid #6366f1; transform: translateY(2px);
    color: #1e1b4b; box-shadow: 0 0 16px var(--theme-glow);
  }

  /* Black Keys */
  .black-key {
    position: absolute; top: 0; width: 5.2%; height: 62%;
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 75%, #020617 100%);
    border: 1px solid #000; border-bottom: 3px solid #334155;
    border-radius: 0 0 5px 5px; z-index: 5; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.7);
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 6px; color: #94a3b8; font-family: var(--font-mono);
    font-size: 0.58rem; font-weight: 800; transition: background 0.08s, transform 0.05s;
    touch-action: none;
  }
  .black-key:active, .black-key.active {
    background: linear-gradient(180deg, #4338ca 0%, #3730a3 80%, #312e81 100%);
    border-bottom: 1.5px solid #6366f1; transform: translateY(2px);
    color: #fff; box-shadow: 0 0 18px var(--theme-glow);
  }

  /* Mobile Responsiveness */
  @media (max-width: 800px) {
    .top-deck { padding: 8px 12px; }
    .brand-title { font-size: 1.05rem; }
    .ambient-bar { padding: 6px 12px; font-size: 0.65rem; }
    .ambient-item input[type=range] { width: 48px; }
    .piano-keys-wrap { height: clamp(125px, 20vh, 160px); }
    .white-key { font-size: 0.55rem; padding-bottom: 4px; }
    .black-key { font-size: 0.5rem; padding-bottom: 3px; }
  }

  @media (max-width: 500px) {
    .ambient-bar { flex-direction: column; align-items: stretch; gap: 8px; }
    .chord-strip { gap: 4px; padding: 4px 8px; }
    .btn-chord { font-size: 0.62rem; padding: 3px 6px; }
    .zen-quote { top: 12%; }
  }
</style>

<body>

<div class="app-wrap">
  <!-- Interactive Visualizer Canvas (Waterfall Falling Notes, Ripples, Particles) -->

  <!-- Top Navigation Deck -->

  <!-- Piano Keyboard Section -->
  <footer class="keyboard-shell">

    <!-- Physical Piano Keys Rack -->
    <div class="piano-keys-wrap" id="piano-rack">
      <!-- Generated via JS for exact mathematical key positions -->

<script>
/**
 * PROJECT SERENADE — Lumina Grand Piano
 * Physical Modeling Synthesis, Algorithmic Reverb, Ambient Rain & Fire,
 * Waterfall Note Flow, and Calming Masterpieces
 */

// 1. Procedural Acoustic Felt Piano & Ambient Audio Engine
class SerenadeAudioEngine {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.reverbNode = null;
    this.reverbGain = null;
    this.dryGain = null;
    this.sustainPedal = true;

    // Ambient Layers
    this.rainGain = null;
    this.fireGain = null;
    this.padGain = null;
    this.padOsc1 = null;
    this.padOsc2 = null;

    // Active sounding voices for sustain pedal release
    this.activeVoices = new Map();
  }

  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AudioCtx();

    // 1. Master Output & Dynamics Limiter
    const limiter = this.ctx.createDynamicsCompressor();
    limiter.threshold.setValueAtTime(-6, this.ctx.currentTime);
    limiter.knee.setValueAtTime(10, this.ctx.currentTime);
    limiter.ratio.setValueAtTime(8, this.ctx.currentTime);
    limiter.connect(this.ctx.destination);

    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.setValueAtTime(0.85, this.ctx.currentTime);
    this.masterGain.connect(limiter);

    // 2. Algorithmic Warm Hall / Cathedral Reverb Network
    this.initLushReverb();

    // 3. Ambient Relaxation Soundscape
    this.initAmbientRain();
    this.initAmbientFire();
    this.initEtherealPad();
  }

  // Algorithmic Schroeder Convolution / Impulse Reverb for Lush Resonance
  initLushReverb() {
    const rate = this.ctx.sampleRate;
    const length = rate * 3.2; // 3.2s lush tail
    const decay = 2.8;
    const impulse = this.ctx.createBuffer(2, length, rate);
    const left = impulse.getChannelData(0);
    const right = impulse.getChannelData(1);

    for (let i = 0; i < length; i++) {
      const t = i / rate;
      const env = Math.exp(-t * decay);
      left[i] = (Math.random() * 2 - 1) * env;
      right[i] = (Math.random() * 2 - 1) * env;
    }

    this.reverbNode = this.ctx.createConvolver();
    this.reverbNode.buffer = impulse;

    this.reverbGain = this.ctx.createGain();
    this.reverbGain.gain.setValueAtTime(0.48, this.ctx.currentTime);

    this.dryGain = this.ctx.createGain();
    this.dryGain.gain.setValueAtTime(0.82, this.ctx.currentTime);

    this.reverbNode.connect(this.reverbGain);
    this.reverbGain.connect(this.masterGain);
    this.dryGain.connect(this.masterGain);
  }

  // Procedural Soft Rain Generator (Pink Noise + Lowpass Flutter)
  initAmbientRain() {
    const bufferSize = this.ctx.sampleRate * 2;
    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + white * 0.0555179;
      b1 = 0.99332 * b1 + white * 0.0750759;
      b2 = 0.96900 * b2 + white * 0.1538520;
      output[i] = (b0 + b1 + b2) * 0.35;
    }

    const rainSource = this.ctx.createBufferSource();
    rainSource.buffer = noiseBuffer;
    rainSource.loop = true;

    const rainFilter = this.ctx.createBiquadFilter();
    rainFilter.type = 'lowpass';
    rainFilter.frequency.setValueAtTime(950, this.ctx.currentTime);

    this.rainGain = this.ctx.createGain();
    this.rainGain.gain.setValueAtTime(0.25, this.ctx.currentTime);

    rainSource.connect(rainFilter);
    rainFilter.connect(this.rainGain);
    this.rainGain.connect(this.masterGain);
    rainSource.start();
  }

  // Procedural Cozy Fireplace Crackle
  initAmbientFire() {
    const bufferSize = this.ctx.sampleRate * 2;
    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      // Sporadic crackle spikes
      output[i] = Math.random() > 0.994 ? (Math.random() * 2 - 1) : 0;
    }

    const fireSource = this.ctx.createBufferSource();
    fireSource.buffer = noiseBuffer;
    fireSource.loop = true;

    const fireFilter = this.ctx.createBiquadFilter();
    fireFilter.type = 'bandpass';
    fireFilter.frequency.setValueAtTime(2400, this.ctx.currentTime);
    fireFilter.Q.setValueAtTime(2.0, this.ctx.currentTime);

    this.fireGain = this.ctx.createGain();
    this.fireGain.gain.setValueAtTime(0.0, this.ctx.currentTime);

    fireSource.connect(fireFilter);
    fireFilter.connect(this.fireGain);
    this.fireGain.connect(this.masterGain);
    fireSource.start();
  }

  // Ethereal Warm Pad (C-Maj Ambient Swell)
  initEtherealPad() {
    this.padOsc1 = this.ctx.createOscillator();
    this.padOsc2 = this.ctx.createOscillator();

    this.padOsc1.type = 'sine';
    this.padOsc1.frequency.setValueAtTime(130.81, this.ctx.currentTime); // C3
    this.padOsc2.type = 'triangle';
    this.padOsc2.frequency.setValueAtTime(196.00, this.ctx.currentTime); // G3 (fifth)

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(450, this.ctx.currentTime);

    this.padGain = this.ctx.createGain();
    this.padGain.gain.setValueAtTime(0.12, this.ctx.currentTime);

    this.padOsc1.connect(filter);
    this.padOsc2.connect(filter);
    filter.connect(this.padGain);
    this.padGain.connect(this.reverbNode);

    this.padOsc1.start();
    this.padOsc2.start();
  }

  // Play Acoustic Felt Piano Note
  // Uses harmonic overtone modeling + soft wooden hammer transient + stereo acoustic panning
  playPianoNote(freq, panRatio = 0, velocity = 0.8) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const voiceId = `${freq.toFixed(2)}_${t}`;

    // 1. Stereo Panning (Bass on Left, Treble on Right)
    let panner = null;
    if (this.ctx.createStereoPanner) {
      panner = this.ctx.createStereoPanner();
      panner.pan.setValueAtTime(Math.max(-0.8, Math.min(0.8, panRatio)), t);
    }

    // 2. Note Master Voice Gain
    const voiceGain = this.ctx.createGain();
    voiceGain.gain.setValueAtTime(velocity * 0.45, t);

    // Warm Felt Lowpass Filter (eliminates harsh high frequencies)
    const feltFilter = this.ctx.createBiquadFilter();
    feltFilter.type = 'lowpass';
    feltFilter.frequency.setValueAtTime(Math.min(2600, freq * 5.2), t);
    feltFilter.Q.setValueAtTime(0.85, t);

    // 3. Multi-Harmonic Additive Synthesis (Fundamental + Overtones)
    // Real acoustic piano strings have 4-5 dominant audible harmonics
    const harmonics = [
      { ratio: 1.0, gain: 0.85, decay: 3.5 },
      { ratio: 2.001, gain: 0.42, decay: 2.8 },
      { ratio: 3.003, gain: 0.22, decay: 2.2 },
      { ratio: 4.006, gain: 0.12, decay: 1.6 }
    ];

    const oscs = [];

    harmonics.forEach(h => {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq * h.ratio, t);

      g.gain.setValueAtTime(h.gain, t);
      // Exponential natural acoustic decay
      const decayTime = this.sustainPedal ? h.decay * 1.5 : h.decay * 0.6;
      g.gain.exponentialRampToValueAtTime(0.0001, t + decayTime);

      osc.connect(g);
      g.connect(feltFilter);
      osc.start(t);
      osc.stop(t + decayTime + 0.1);
      oscs.push(osc);
    });

    // 4. Soft Wooden Felt Hammer Strike Transient (Pluck)
    const hammerOsc = this.ctx.createOscillator();
    const hammerGain = this.ctx.createGain();
    hammerOsc.type = 'triangle';
    hammerOsc.frequency.setValueAtTime(freq * 0.7, t);
    hammerGain.gain.setValueAtTime(0.35, t);
    hammerGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    hammerOsc.connect(hammerGain);
    hammerGain.connect(feltFilter);
    hammerOsc.start(t);
    hammerOsc.stop(t + 0.05);

    // Route: Filter -> VoiceGain -> Panner -> Dry & Reverb
    feltFilter.connect(voiceGain);
    if (panner) {
      voiceGain.connect(panner);
      panner.connect(this.dryGain);
      panner.connect(this.reverbNode);
    } else {
      voiceGain.connect(this.dryGain);
      voiceGain.connect(this.reverbNode);
    }

    this.activeVoices.set(voiceId, { gain: voiceGain, oscs: oscs });
    return voiceId;
  }

  // Play a full soothing harmonic chord
  playChord(chordNotes) {
    chordNotes.forEach((f, idx) => {
      // Arpeggiate slightly for warm acoustic strum
      setTimeout(() => {
        const pan = (idx / (chordNotes.length - 1)) * 1.2 - 0.6;
        this.playPianoNote(f, pan, 0.75);
      }, idx * 45);
    });
  }

  setRainVolume(val) {
    if (this.rainGain && this.ctx) {
      this.rainGain.gain.linearRampToValueAtTime(val * 0.01 * 0.45, this.ctx.currentTime + 0.1);
    }
  }

  setFireVolume(val) {
    if (this.fireGain && this.ctx) {
      this.fireGain.gain.linearRampToValueAtTime(val * 0.01 * 0.5, this.ctx.currentTime + 0.1);
    }
  }

  setPadVolume(val) {
    if (this.padGain && this.ctx) {
      this.padGain.gain.linearRampToValueAtTime(val * 0.01 * 0.28, this.ctx.currentTime + 0.1);
    }
  }

  toggleSustain() {
    this.sustainPedal = !this.sustainPedal;
    return this.sustainPedal;
  }

  toggleReverb() {
    if (!this.reverbGain) return true;
    const current = this.reverbGain.gain.value;
    const next = current > 0.1 ? 0.0 : 0.48;
    this.reverbGain.gain.setValueAtTime(next, this.ctx.currentTime);
    return next > 0.1;
  }
}

const audio = new SerenadeAudioEngine();

// 2. Color Palettes (Calming & Relaxing)

// 4. Note Frequencies & Key Configuration
const NOTE_BASE_FREQS = {
  'C': 16.35, 'C#': 17.32, 'D': 18.35, 'D#': 19.45, 'E': 20.60,
  'F': 21.83, 'F#': 23.12, 'G': 24.50, 'G#': 25.96, 'A': 27.50,
  'A#': 29.14, 'B': 30.87
};

function getNoteFreq(noteName, octave) {
  const base = NOTE_BASE_FREQS[noteName];
  return base * Math.pow(2, octave);
}

// 5. Lumina Piano Application Controller
class LuminaPianoApp {
  constructor() {
    this.canvas = document.getElementById('fx-canvas');
    this.ctx = this.canvas.getContext('2d');
    this.paletteIdx = 0;
    this.baseOctave = 4; // C4 - B5

    // Visual elements
    this.particles = [];
    this.ripples = [];
    this.fallingNotes = [];

    // Auto-play state
    this.isPlayingSong = false;
    this.songTimers = [];

    // Keys Map
    this.keyElements = new Map();
    this.whiteKeyCount = 14; // 2 octaves

    this.initCanvas();
    this.buildPianoKeys();
    this.bindEvents();
    this.initStardust();
    this.animate();
  }

  initCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.canvas.width = window.innerWidth * dpr;
    this.canvas.height = window.innerHeight * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  initStardust() {
    this.particles = [];
    for (let i = 0; i < 75; i++) {
      this.particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: Math.random() * 2 + 0.8,
        vx: (Math.random() - 0.5) * 0.3,
        vy: -0.2 - Math.random() * 0.4,
        alpha: Math.random() * 0.6 + 0.2
      });
    }
  }

  buildPianoKeys() {
    const rack = document.getElementById('piano-rack');
    rack.innerHTML = '';
    this.keyElements.clear();

    const octaves = [this.baseOctave, this.baseOctave + 1];
    const whiteNotes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
    const blackNotes = [
      { name: 'C#', offset: 0.65 },
      { name: 'D#', offset: 1.65 },
      { name: 'F#', offset: 3.65 },
      { name: 'G#', offset: 4.65 },
      { name: 'A#', offset: 5.65 }
    ];

    let whiteIndex = 0;

    // 1. Render White Keys First
    octaves.forEach(oct => {
      whiteNotes.forEach(note => {
        const fullNote = `${note}${oct}`;
        const keyEl = document.createElement('div');
        keyEl.className = 'white-key';
        keyEl.dataset.note = fullNote;
        keyEl.dataset.freq = getNoteFreq(note, oct);
        keyEl.dataset.pan = (whiteIndex / 13) * 1.4 - 0.7; // Stereo acoustic pan
        keyEl.innerHTML = `<span>${fullNote}</span>`;

        rack.appendChild(keyEl);
        this.keyElements.set(fullNote, keyEl);
        whiteIndex++;
      });
    });

    // 2. Render Black Keys on top with calculated fractional left offsets
    const totalWhiteKeys = 14;
    octaves.forEach((oct, octIdx) => {
      blackNotes.forEach(bn => {
        const fullNote = `${bn.name}${oct}`;
        const keyEl = document.createElement('div');
        keyEl.className = 'black-key';
        keyEl.dataset.note = fullNote;
        keyEl.dataset.freq = getNoteFreq(bn.name, oct);

        // Position accurately between respective white keys
        const leftPercent = ((octIdx * 7 + bn.offset) / totalWhiteKeys) * 100;
        keyEl.style.left = `${leftPercent}%`;
        keyEl.dataset.pan = ((octIdx * 7 + bn.offset) / totalWhiteKeys) * 1.4 - 0.7;

        keyEl.innerHTML = `<span>${bn.name}</span>`;
        rack.appendChild(keyEl);
        this.keyElements.set(fullNote, keyEl);
      });
    });

    this.bindTouchEvents();
  }

  // Multi-Touch & Glissando Handler for Phones & Tablets
  bindTouchEvents() {
    const rack = document.getElementById('piano-rack');

    const handlePointerDown = (el) => {
      if (!el || !el.dataset.freq) return;
      audio.init();
      const freq = parseFloat(el.dataset.freq);
      const pan = parseFloat(el.dataset.pan || 0);

      audio.playPianoNote(freq, pan);
      el.classList.add('active');

      this.triggerKeyVisuals(el, freq);
    };

    const handlePointerUp = (el) => {
      if (el) el.classList.remove('active');
    };

    // Multi-Touch Tracking for fluid swipes / glissando on phones
    rack.addEventListener('touchstart', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const el = document.elementFromPoint(t.clientX, t.clientY)?.closest('.white-key, .black-key');
        if (el) handlePointerDown(el);
      }
    }, { passive: false });

    rack.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const el = document.elementFromPoint(t.clientX, t.clientY)?.closest('.white-key, .black-key');
        if (el && !el.classList.contains('active')) {
          handlePointerDown(el);
        }
      }
    }, { passive: false });

    rack.addEventListener('touchend', (e) => {
      e.preventDefault();
      document.querySelectorAll('.white-key, .black-key').forEach(k => k.classList.remove('active'));
    }, { passive: false });

    rack.addEventListener('touchcancel', () => {
      document.querySelectorAll('.white-key, .black-key').forEach(k => k.classList.remove('active'));
    });

    // Mouse Desktop Handlers
    let isMouseDown = false;
    rack.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      const el = e.target.closest('.white-key, .black-key');
      if (el) handlePointerDown(el);
    });

    rack.addEventListener('mouseover', (e) => {
      if (!isMouseDown) return;
      const el = e.target.closest('.white-key, .black-key');
      if (el) handlePointerDown(el);
    });

    window.addEventListener('mouseup', () => {
      isMouseDown = false;
      document.querySelectorAll('.white-key, .black-key').forEach(k => k.classList.remove('active'));
    });
  }

  triggerKeyVisuals(keyEl, freq) {
    const rect = keyEl.getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top;

    // 1. Water Ripple Effect
    this.ripples.push({
      x: x, y: y,
      radius: 4,
      maxRadius: 110,
      alpha: 0.85,
      color: PALETTES[this.paletteIdx].glow
    });

    // 2. Rising Aurora Light Beam / Falling Note Trail
    this.fallingNotes.push({
      x: x, y: y,
      w: rect.width * 0.7,
      h: 0,
      vy: -3.8,
      alpha: 0.9,
      color: PALETTES[this.paletteIdx].accent
    });
  }

  playChordByName(chordName) {
    audio.init();
    const chordMap = {
      'Cmaj9': [261.63, 329.63, 392.00, 493.88, 587.33], // C4, E4, G4, B4, D5
      'Am9': [220.00, 261.63, 329.63, 392.00, 493.88],   // A3, C4, E4, G4, B4
      'Fmaj7': [174.61, 261.63, 329.63, 349.23],          // F3, C4, E4, F4
      'Gadd9': [196.00, 293.66, 392.00, 440.00],          // G3, D4, G4, A4
      'Em7': [164.81, 246.94, 329.63, 392.00],            // E3, B3, E4, G4
      'Dm9': [146.83, 220.00, 261.63, 293.66, 329.63],   // D3, A3, C4, D4, E4
      'Bbmaj7': [233.08, 293.66, 349.23, 440.00],        // Bb3, D4, F4, A4
      'E7b9': [164.81, 261.63, 329.63, 392.00, 523.25]   // E3, C4, E4, G4, C5
    };

    const notes = chordMap[chordName];
    if (notes) {
      audio.playChord(notes);
      // Flash first matching visual keys
      const keys = document.querySelectorAll('.white-key, .black-key');
      if (keys.length > 0) {
        this.triggerKeyVisuals(keys[Math.floor(Math.random() * keys.length)], 440);
      }
    }
  }

  playMelody(key) {
    this.stopMelody();
    const song = MELODIES[key];
    if (!song) return;

    audio.init();
    this.isPlayingSong = true;
    document.getElementById('btn-play-song').textContent = '⏹ STOP';
    document.getElementById('zen-quote').innerHTML = `<h3>${song.title}</h3><p>Now Playing • ${song.artist}</p>`;

    song.notes.forEach(n => {
      const timer = setTimeout(() => {
        if (!this.isPlayingSong) return;
        const keyEl = this.keyElements.get(n.note);
        if (keyEl) {
          const freq = parseFloat(keyEl.dataset.freq);
          const pan = parseFloat(keyEl.dataset.pan || 0);
          audio.playPianoNote(freq, pan, 0.85);

          keyEl.classList.add('active');
          setTimeout(() => keyEl.classList.remove('active'), n.dur * 400);

          this.triggerKeyVisuals(keyEl, freq);
        }
      }, n.time * 1000);

      this.songTimers.push(timer);
    });

    // Reset after song finishes
    const totalDuration = (song.notes[song.notes.length - 1].time + 4.0) * 1000;
    const endTimer = setTimeout(() => {
      this.stopMelody();
    }, totalDuration);
    this.songTimers.push(endTimer);
  }

  stopMelody() {
    this.isPlayingSong = false;
    this.songTimers.forEach(t => clearTimeout(t));
    this.songTimers = [];
    document.getElementById('btn-play-song').textContent = '▶ PLAY';
    document.querySelectorAll('.white-key, .black-key').forEach(k => k.classList.remove('active'));
    document.getElementById('zen-quote').innerHTML = `<h3>Breathe deeply. Touch the keys.</h3><p>Acoustic felt resonance • Pure therapeutic harmonics</p>`;
  }

  cyclePalette() {
    this.paletteIdx = (this.paletteIdx + 1) % PALETTES.length;
    const p = PALETTES[this.paletteIdx];

    document.documentElement.style.setProperty('--theme-bg', p.bg);
    document.documentElement.style.setProperty('--theme-glow', p.glow);
    document.documentElement.style.setProperty('--theme-accent', p.accent);
  }

  bindEvents() {
    window.addEventListener('resize', () => {
      this.initCanvas();
      this.initStardust();
    });

    // Octave Shift Buttons
    document.getElementById('btn-oct-down').addEventListener('click', () => {
      if (this.baseOctave > 2) {
        this.baseOctave--;
        document.getElementById('label-octave').textContent = `OCTAVE: ${this.baseOctave}`;
        this.buildPianoKeys();
      }
    });

    document.getElementById('btn-oct-up').addEventListener('click', () => {
      if (this.baseOctave < 5) {
        this.baseOctave++;
        document.getElementById('label-octave').textContent = `OCTAVE: ${this.baseOctave}`;
        this.buildPianoKeys();
      }
    });

    // Sustain Toggle
    const btnSustain = document.getElementById('btn-sustain');
    btnSustain.addEventListener('click', () => {
      const active = audio.toggleSustain();
      btnSustain.classList.toggle('active', active);
      btnSustain.textContent = active ? 'PEDAL: SUSTAIN ON' : 'PEDAL: SUSTAIN OFF';
    });

    // Reverb Toggle
    const btnReverb = document.getElementById('btn-reverb');
    btnReverb.addEventListener('click', () => {
      audio.init();
      const active = audio.toggleReverb();
      btnReverb.classList.toggle('active', active);
      btnReverb.textContent = active ? '🏛️ REVERB: LUSH' : '🏛️ REVERB: DRY';
    });

    // Palette Switcher
    document.getElementById('btn-palette').addEventListener('click', () => {
      this.cyclePalette();
    });

    // Fullscreen Toggle
    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Ambient Sliders
    document.getElementById('slider-rain').addEventListener('input', (e) => {
      audio.init();
      audio.setRainVolume(parseFloat(e.target.value));
    });

    document.getElementById('slider-fire').addEventListener('input', (e) => {
      audio.init();
      audio.setFireVolume(parseFloat(e.target.value));
    });

    document.getElementById('slider-pad').addEventListener('input', (e) => {
      audio.init();
      audio.setPadVolume(parseFloat(e.target.value));
    });

    // Chord Assistance Buttons
    document.querySelectorAll('.btn-chord').forEach(btn => {
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        this.playChordByName(btn.dataset.chord);
      });
    });

    // Song Selection & Play Button
    const selectSong = document.getElementById('select-melody');
    const btnPlay = document.getElementById('btn-play-song');

    btnPlay.addEventListener('click', () => {
      if (this.isPlayingSong) {
        this.stopMelody();
      } else {
        const val = selectSong.value;
        if (val !== 'none') this.playMelody(val);
      }
    });

    selectSong.addEventListener('change', () => {
      if (this.isPlayingSong) this.stopMelody();
    });

    // Keyboard Hotkeys for Desktop (A-S-D-F-G-H-J...)
    const keyMap = {
      'a': 'C4', 'w': 'C#4', 's': 'D4', 'e': 'D#4', 'd': 'E4', 'f': 'F4',
      't': 'F#4', 'g': 'G4', 'y': 'G#4', 'h': 'A4', 'u': 'A#4', 'j': 'B4',
      'k': 'C5', 'o': 'C#5', 'l': 'D5', 'p': 'D#5', ';': 'E5', "'": 'F5'
    };

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const note = keyMap[e.key.toLowerCase()];
      if (note) {
        const keyEl = this.keyElements.get(note);
        if (keyEl) {
          audio.init();
          const freq = parseFloat(keyEl.dataset.freq);
          const pan = parseFloat(keyEl.dataset.pan || 0);
          audio.playPianoNote(freq, pan);
          keyEl.classList.add('active');
          this.triggerKeyVisuals(keyEl, freq);
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      const note = keyMap[e.key.toLowerCase()];
      if (note) {
        const keyEl = this.keyElements.get(note);
        if (keyEl) keyEl.classList.remove('active');
      }
    });
  }

  animate() {
    requestAnimationFrame(() => this.animate());

    const ctx = this.ctx;
    const w = window.innerWidth;
    const h = window.innerHeight;

    ctx.clearRect(0, 0, w, h);

    // 1. Draw Floating Stardust Fireflies
    ctx.fillStyle = '#ffffff';
    for (let p of this.particles) {
      p.y += p.vy;
      p.x += p.vx;
      if (p.y < 0) p.y = h;
      if (p.x < 0) p.x = w;
      if (p.x > w) p.x = 0;

      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 2. Draw Concentric Water Ripples
    for (let i = this.ripples.length - 1; i >= 0; i--) {
      const r = this.ripples[i];
      r.radius += 2.2;
      r.alpha -= 0.016;

      if (r.alpha <= 0) {
        this.ripples.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.strokeStyle = r.color;
      ctx.globalAlpha = r.alpha;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // 3. Draw Rising Light Beams / Waterfall Trails
    for (let i = this.fallingNotes.length - 1; i >= 0; i--) {
      const fn = this.fallingNotes[i];
      fn.y += fn.vy;
      fn.h = Math.min(180, fn.h + 5);
      fn.alpha -= 0.012;

      if (fn.alpha <= 0 || fn.y < -200) {
        this.fallingNotes.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = fn.alpha;
      const grad = ctx.createLinearGradient(fn.x, fn.y, fn.x, fn.y + fn.h);
      grad.addColorStop(0, fn.color);
      grad.addColorStop(1, 'transparent');

      ctx.fillStyle = grad;
      ctx.fillRect(fn.x - fn.w / 2, fn.y, fn.w, fn.h);
      ctx.restore();
    }
  }
}
