<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Slingshot Smash — Antique Tabletop Physics Alley</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050607;
      --grid: rgba(255, 255, 255, 0.05);
      --text: #ece6da;
      --muted: rgba(236, 230, 218, 0.55);
      --gold: #f3c98f;
      --gold-glow: rgba(243, 201, 143, 0.4);
      --amber: #e69224;
      --cyan: #38bdf8;
      --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --body: "Bricolage Grotesque", -apple-system, sans-serif;
      --display: "Funnel Display", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: var(--body); touch-action: none;
    }

    /* Ambient Subtle Grid (from Slingshot Lamp) */
    .grid {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 76px 76px;
      background-position: center top;
      pointer-events: none;
      z-index: 1;
    }

    canvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      display: block; z-index: 2;
    }

    /* HUD OVERLAY */
    .hud {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 20;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }
    .hud > * { pointer-events: auto; }

    /* Top Left: Navigation & Stats */
    .hud-tl {
      position: absolute; top: 16px; left: 20px;
      display: flex; flex-direction: column; gap: 8px;
    }

    .home-btn {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(18, 22, 32, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 7px 15px; border-radius: 999px;
      color: var(--text); text-decoration: none;
      font: 600 12px/1 var(--body);
      backdrop-filter: blur(14px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }
    .home-btn:hover {
      border-color: var(--gold); color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--gold-glow);
    }
    .home-btn span { color: var(--gold); font-weight: 700; }

    .stats-line {
      font-size: 11px;
      line-height: 1.6;
      letter-spacing: 0.04em;
      color: var(--muted);
      background: rgba(10, 12, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 12px; border-radius: 10px;
      backdrop-filter: blur(10px);
    }
    .stats-line b { font-weight: 700; color: var(--gold); }

    /* Top Center: Stage Switcher Tabs */
    .stage-bar {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 5px;
      background: rgba(18, 22, 32, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px; border-radius: 999px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .stage-btn {
      background: transparent; border: 0;
      color: var(--muted); font: 600 11px/1 var(--body);
      padding: 7px 14px; border-radius: 999px;
      cursor: pointer; transition: all 0.2s ease;
      white-space: nowrap;
    }
    .stage-btn:hover { color: var(--text); }
    .stage-btn.active {
      background: linear-gradient(135deg, rgba(243, 201, 143, 0.3), rgba(230, 146, 36, 0.2));
      border: 1px solid var(--gold);
      color: #fff; font-weight: 700;
      box-shadow: 0 0 14px var(--gold-glow);
    }

    /* Top Right: Sound & Action Tools */
    .hud-tr {
      position: absolute; top: 16px; right: 20px;
      display: flex; gap: 8px; align-items: center;
    }

    .hud-btn {
      background: rgba(18, 22, 32, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--muted); font: 600 11px/1 var(--body);
      padding: 7px 13px; border-radius: 999px;
      cursor: pointer; backdrop-filter: blur(14px);
      transition: all 0.2s ease;
      display: flex; align-items: center; gap: 5px;
    }
    .hud-btn:hover {
      color: var(--text); border-color: rgba(255, 255, 255, 0.25);
    }
    .hud-btn.primary {
      background: #ece6da; color: #111; border: 0; font-weight: 700;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .hud-btn.primary:hover { filter: brightness(1.1); }

    /* Interactive Wall Switch (from Slingshot Lamp) */
    .switch {
      position: absolute; right: max(20px, 4vw); top: 50%; transform: translateY(-50%);
      width: 68px; height: 110px; border-radius: 10px;
      background: linear-gradient(160deg, #26282b, #151618 60%, #101112);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.09),
        inset 0 -1px 0 rgba(0, 0, 0, 0.6),
        0 1px 0 rgba(255, 255, 255, 0.03),
        0 14px 30px rgba(0, 0, 0, 0.7);
      cursor: pointer; outline: none;
    }
    .switch:focus-visible { box-shadow: 0 0 0 2px var(--gold), 0 14px 30px rgba(0, 0, 0, 0.7); }
    .screw {
      position: absolute; left: 50%; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #6b6d70, #2a2b2d 70%);
    }
    .screw::after { content: ""; position: absolute; left: 1px; right: 1px; top: 3px; height: 1px; background: rgba(0, 0, 0, 0.7); transform: rotate(35deg); }
    .screw.t { top: 8px; }
    .screw.b { bottom: 8px; }
    .slot {
      position: absolute; left: 50%; top: 50%; width: 24px; height: 46px; margin: -23px 0 0 -12px;
      border-radius: 4px; background: linear-gradient(#060607, #0d0e0f);
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.9), 0 1px 0 rgba(255, 255, 255, 0.06);
      perspective: 120px;
    }
    .lever {
      position: absolute; left: 2px; right: 2px; top: 2px; bottom: 2px; border-radius: 3px;
      transition: transform 0.14s cubic-bezier(.3, 1.6, .5, 1);
      transform-origin: 50% 50%;
      transform: rotateX(-26deg);
      background: linear-gradient(#9d9b97 0%, #d8d4cc 38%, #8c8984 52%, #54524f 100%);
      box-shadow: 0 5px 6px rgba(0, 0, 0, 0.6);
    }
    .switch[aria-checked="false"] .lever {
      transform: rotateX(26deg);
      background: linear-gradient(#4d4b48 0%, #85827d 48%, #d0ccc4 64%, #97948f 100%);
      box-shadow: 0 -5px 6px rgba(0, 0, 0, 0.6);
    }
    .engrave { position: absolute; left: 0; right: 0; text-align: center; font: 8px/1 var(--mono); letter-spacing: 0.18em; color: rgba(255, 255, 255, 0.22); }
    .engrave.on { top: 18px; }
    .engrave.off { bottom: 18px; }
    .pilot {
      position: absolute; right: 8px; top: 50%; width: 4px; height: 4px; margin-top: -2px; border-radius: 50%;
      background: #3a2a1a; transition: background 0.2s, box-shadow 0.2s;
    }
    .switch[aria-checked="true"] .pilot { background: #ffb45a; box-shadow: 0 0 6px 1px rgba(255, 170, 80, 0.8); }

    /* Bottom: Ammo Selector & Guidance Hint */
    .hud-bottom {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }

    .ammo-bar {
      display: flex; gap: 6px;
      background: rgba(18, 22, 32, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 5px 12px; border-radius: 999px;
      backdrop-filter: blur(18px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    .ammo-btn {
      background: transparent; border: 1px solid transparent;
      color: var(--muted); font: 600 11px/1 var(--mono);
      padding: 7px 13px; border-radius: 999px;
      cursor: pointer; transition: all 0.2s ease;
      display: flex; align-items: center; gap: 6px;
    }
    .ammo-btn:hover { color: var(--text); border-color: rgba(255, 255, 255, 0.15); }
    .ammo-btn.active {
      background: rgba(243, 201, 143, 0.15);
      border-color: var(--gold);
      color: #fff; font-weight: 700;
      box-shadow: 0 0 12px var(--gold-glow);
    }

    .hint-text {
      font-size: 11px;
      color: rgba(236, 230, 218, 0.45);
      text-align: center;
      letter-spacing: 0.02em;
    }

    /* Floating Hit Notification Toast */
    .toast {
      position: absolute; top: 80px; left: 50%; transform: translateX(-50%) translateY(-15px);
      background: rgba(14, 18, 28, 0.94);
      border: 1px solid var(--gold);
      color: #fff; padding: 8px 20px; border-radius: 999px;
      font: 700 12px/1 var(--mono);
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      opacity: 0; pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .stage-bar { top: 68px; max-width: 90vw; overflow-x: auto; }
      .hud-tl { top: 12px; left: 14px; }
      .hud-tr { top: 12px; right: 14px; }
      .switch { right: 12px; top: 40%; scale: 0.75; transform-origin: right center; }
      .ammo-bar { padding: 4px 8px; gap: 4px; }
      .ammo-btn { padding: 6px 10px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <canvas id="c"></canvas>

  <div class="hud">
    <!-- Top Left -->
    <div class="hud-tl">
      <a href="index.html" class="home-btn">← <span>AI Smarts</span></a>
      <div class="stats-line">
        slingshot-smash · shots <b id="stat-shots">0</b> · smashed <b id="stat-smashed">0</b> · bells <b id="stat-bells">0</b> · score <b id="stat-score">0</b>
      </div>
    </div>

    <!-- Top Center: Stage Tabs -->
    <nav class="stage-bar">
      <button class="stage-btn active" data-stage="pyramid">🍾 Crystal Bar</button>
      <button class="stage-btn" data-stage="chandelier">🔔 Chimes & Lamp</button>
      <button class="stage-btn" data-stage="domino">🧱 Domino Cascade</button>
      <button class="stage-btn" data-stage="sandbox">🎯 Free Sandbox</button>
    </nav>

    <!-- Top Right: Actions & Audio -->
    <div class="hud-tr">
      <button class="hud-btn" id="soundBtn">🔊 Audio: On</button>
      <button class="hud-btn" id="slowBtn">⏱️ Normal</button>
      <button class="hud-btn primary" id="restockBtn">🔄 Restock</button>
    </div>

    <!-- Wall Light Switch (Striking with pebble flips it!) -->
    <div id="switch" class="switch" role="switch" aria-checked="true" aria-label="Alley light switch" tabindex="0">
      <span class="screw t"></span>
      <span class="engrave on">ON</span>
      <div class="slot"><div class="lever"></div></div>
      <span class="pilot"></span>
      <span class="engrave off">OFF</span>
      <span class="screw b"></span>
    </div>

    <!-- Bottom: Ammo Selector & Guidance Hint -->
    <div class="hud-bottom">
      <div class="ammo-bar">
        <button class="ammo-btn active" data-ammo="pebble">🪨 River Pebble</button>
        <button class="ammo-btn" data-ammo="steel">⚡ Steel Bearing</button>
        <button class="ammo-btn" data-ammo="glow">🔮 Plasma Orb</button>
        <button class="ammo-btn" data-ammo="bouncer">💣 Super Bouncer</button>
      </div>
      <div class="hint-text">
        pull the leather pouch back and release to fire · hit bottles, bells, or the wall switch!
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">🍾 Direct Hit! Glass Shattered (+50)</div>
  </div>

  <script>
    /* ==========================================================================
       AUTHENTIC PROCEDURAL ACOUSTICS (WEB AUDIO API)
       ========================================================================== */
    class AlleyAudio {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.noise = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
            this.noise = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate);
            const d = this.noise.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }

      // Leather Pouch Snap & Band Elastic Release
      snap(power = 1.0) {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(360, now);
        osc.frequency.exponentialRampToValueAtTime(55, now + 0.045);
        g.gain.setValueAtTime(0.3 * power, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.055);

        // High-velocity band air whoosh
        const src = this.ctx.createBufferSource();
        src.buffer = this.noise;
        const f = this.ctx.createBiquadFilter();
        f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 2.4;
        const g2 = this.ctx.createGain();
        g2.gain.setValueAtTime(0.12 * power, now);
        g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.065);
        src.connect(f); f.connect(g2); g2.connect(this.ctx.destination);
        src.start(now); src.stop(now + 0.075);
      }

      // Pull Creak Sound (Stretching natural rubber & wood)
      creak() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140 + Math.random() * 70, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.035);
        g.gain.setValueAtTime(0.04, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.045);
      }

      // Multi-Harmonic Crystal Glass Shatter
      glassShatter(strength = 1.0) {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const s = Math.min(1.8, Math.max(0.4, strength));

        // High crystalline harmonics
        [2200, 3100, 4400, 5800].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq + Math.random() * 250, now + idx * 0.004);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.09);
          g.gain.setValueAtTime(0.15 * s, now + idx * 0.004);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
          osc.connect(g); g.connect(this.ctx.destination);
          osc.start(now + idx * 0.004); osc.stop(now + 0.15);
        });

        // Sharp crunch impact
        const src = this.ctx.createBufferSource();
        src.buffer = this.noise;
        const f = this.ctx.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 2400;
        const gNoise = this.ctx.createGain();
        gNoise.gain.setValueAtTime(0.24 * s, now);
        gNoise.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
        src.connect(f); f.connect(gNoise); gNoise.connect(this.ctx.destination);
        src.start(now); src.stop(now + 0.2);
      }

      // Resonant Brass Chime Bell (Harmonious Pentatonic Scale)
      bellChime(pitchIdx = 0) {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const scale = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50]; // C5, D5, E5, G5, A5, C6
        const baseFreq = scale[pitchIdx % scale.length];

        [1, 2.76, 5.4].forEach((harmonic, idx) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(baseFreq * harmonic, now);
          const vol = idx === 0 ? 0.3 : 0.09;
          g.gain.setValueAtTime(vol, now);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 1.2 + idx * 0.2);
          osc.connect(g); g.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 1.5);
        });
      }

      // Wood Domino / Table Clack
      woodClack(vel = 1.0) {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const v = Math.min(2.0, Math.max(0.1, vel));
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800 + Math.random() * 200, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.03);
        g.gain.setValueAtTime(Math.min(0.25, 0.06 + v * 0.1), now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.045);
      }

      // Mechanical Switch Flip Click
      switchClick() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(650, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.035);
        g.gain.setValueAtTime(0.3, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.045);
      }

      // Light Bulb Pop & Electric Arc Spark
      bulbPop() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.08);
        g.gain.setValueAtTime(0.4, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.11);
      }

      // Metal Ricochet Ping
      metalPing() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(2200, now);
        osc.frequency.exponentialRampToValueAtTime(3600, now + 0.05);
        g.gain.setValueAtTime(0.2, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.09);
      }
    }

    const sfx = new AlleyAudio();
    document.body.addEventListener('pointerdown', () => sfx.init(), { once: true });
    document.body.addEventListener('keydown', () => sfx.init(), { once: true });

    /* ==========================================================================
       PHYSICS WORLD & 120HZ SUB-STEPPING SYSTEM
       ========================================================================== */
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const glowCanvas = document.createElement('canvas');
    const gctx = glowCanvas.getContext('2d');
    const darkCanvas = document.createElement('canvas');
    const dctx = darkCanvas.getContext('2d');

    let W = 0, H = 0, DPR = 1;
    const G = 2200; // Realistic gravity
    const STEP = 1 / 120;
    let timeScale = 1.0;

    // Game stats
    let shotsCount = 0;
    let smashedCount = 0;
    let bellsCount = 0;
    let score = 0;
    let currentStage = 'pyramid';
    let currentAmmo = 'pebble';

    // Hanging chandelier / lamp (from Slingshot Lamp)
    const lamp = {
      ax: 0, ay: -10, len: 240, theta: 0.04, omega: 0,
      lightOn: true, bulbBroken: false, lightI: 1.0, popTimer: 0
    };

    // Tactile Slingshot (Exact physical architecture of Slingshot Lamp)
    const sling = {
      x: 0, y: 0,
      forkL: { x: 0, y: 0 },
      forkR: { x: 0, y: 0 },
      rest: { x: 0, y: 0 },
      pouch: { x: 0, y: 0 },
      vel: { x: 0, y: 0 },
      loaded: true,
      reloadTimer: 0,
      creakCooldown: 0,
      maxPull: 140,
      launchMultiplier: 13.5
    };

    let grab = null; // Active pointer interaction

    // Destructible World Collections
    let shelves = [];
    let bottles = [];
    let bells = [];
    let dominoes = [];
    let projectiles = [];
    let shards = [];
    let sparks = [];
    let splatters = [];

    // Switch element reference
    const switchEl = document.getElementById('switch');

    /* ==========================================================================
       TARGET CLASSES (CRYSTAL BOTTLES, DOMINOES, CHIMES)
       ========================================================================== */

    // 1. Crystal Glass Bottle with Sloshing Liquid
    class CrystalBottle {
      constructor(x, y, type = 'wine', color = '#10b981') {
        this.x = x; this.y = y;
        this.w = 26; this.h = 66;
        this.vx = 0; this.vy = 0;
        this.angle = 0; this.vAngle = 0;
        this.type = type; // 'wine', 'flask', 'potion', 'decanter'
        this.color = color;
        this.liquidFill = 0.65;
        this.liquidSlosh = 0;
        this.broken = false;
      }

      shatter(impactVel) {
        if (this.broken) return;
        this.broken = true;
        smashedCount++;
        score += 50;
        updateHUD();
        sfx.glassShatter(impactVel / 350);
        showToast('🍾 Direct Hit! Glass Shattered (+50)');

        // Spawn 26 realistic polygonal shards
        for (let i = 0; i < 26; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 70 + Math.random() * (impactVel * 0.75);
          shards.push({
            x: this.x + (Math.random() - 0.5) * this.w,
            y: this.y + (Math.random() - 0.5) * this.h,
            vx: Math.cos(ang) * spd + this.vx * 0.4,
            vy: Math.sin(ang) * spd - 90,
            angle: Math.random() * Math.PI * 2,
            vAngle: (Math.random() - 0.5) * 18,
            size: 3 + Math.random() * 7,
            color: this.color,
            life: 1.0
          });
        }

        // Spawn sloshing liquid splash droplets
        for (let i = 0; i < 18; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 50 + Math.random() * (impactVel * 0.6);
          splatters.push({
            x: this.x, y: this.y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 60,
            r: 2 + Math.random() * 3.5,
            color: this.color,
            life: 1.0
          });
        }
      }
    }

    // 2. Resonant Brass Chime Bell
    class ChimeBell {
      constructor(ax, ay, len = 110, pitchIdx = 0) {
        this.ax = ax; this.ay = ay;
        this.len = len;
        this.theta = 0; this.omega = 0;
        this.r = 22;
        this.pitchIdx = pitchIdx;
        this.lastDing = 0;
      }

      strike(impulse) {
        this.omega += impulse * 0.0035;
        const now = Date.now();
        if (now - this.lastDing > 120) {
          sfx.bellChime(this.pitchIdx);
          bellsCount++;
          score += 25;
          updateHUD();
          this.lastDing = now;
          showToast('🔔 Tuned Brass Bell Chimed (+25)');
        }
      }

      getPos() {
        return {
          x: this.ax + Math.sin(this.theta) * this.len,
          y: this.ay + Math.cos(this.theta) * this.len
        };
      }
    }

    // 3. Wooden Domino Brick
    class DominoBrick {
      constructor(x, y, w = 13, h = 58, color = '#d97706') {
        this.x = x; this.y = y;
        this.w = w; this.h = h;
        this.vx = 0; this.vy = 0;
        this.angle = 0; this.vAngle = 0;
        this.color = color;
      }
    }

    // 4. Projectile (Pebble, Steel, Plasma, Bouncer)
    class Projectile {
      constructor(x, y, vx, vy, type = 'pebble') {
        this.x = x; this.y = y;
        this.vx = vx; this.vy = vy;
        this.type = type;
        this.trail = [];
        this.bounces = 0;
        this.alive = true;
        this.life = 6.0;

        if (type === 'steel') {
          this.r = 8; this.mass = 3.6; this.restitution = 0.45; this.color = '#cbd5e1';
        } else if (type === 'glow') {
          this.r = 9; this.mass = 1.6; this.restitution = 0.65; this.color = '#38bdf8';
        } else if (type === 'bouncer') {
          this.r = 7.5; this.mass = 1.1; this.restitution = 0.92; this.color = '#f43f5e';
        } else {
          // River Pebble
          this.r = 7.5; this.mass = 2.0; this.restitution = 0.58; this.color = '#a9a49b';
        }
      }
    }

    /* ==========================================================================
       STAGE GENERATOR
       ========================================================================== */
    function buildStage(stageName) {
      currentStage = stageName;
      projectiles = [];
      bottles = [];
      bells = [];
      dominoes = [];
      shards = [];
      sparks = [];
      splatters = [];

      document.querySelectorAll('.stage-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.querySelector(`[data-stage="${stageName}"]`);
      if (activeBtn) activeBtn.classList.add('active');

      const shelfX = W * 0.54;
      const shelfW = Math.min(680, W * 0.54);

      shelves = [
        { x: shelfX, y: H * 0.40, w: shelfW, h: 16 },
        { x: shelfX, y: H * 0.68, w: shelfW, h: 16 }
      ];

      if (stageName === 'pyramid') {
        // Stage 1: The Crystal Bar (Classic bottles pyramid)
        const colors = ['#10b981', '#f59e0b', '#3b82f6', '#8b5cf6', '#06b6d4'];
        const types = ['wine', 'flask', 'potion', 'decanter', 'wine'];

        // Lower shelf: 6 bottles
        const startX1 = shelves[1].x - shelfW * 0.38;
        for (let i = 0; i < 6; i++) {
          bottles.push(new CrystalBottle(startX1 + i * 56, shelves[1].y - 33, types[i % types.length], colors[i % colors.length]));
        }

        // Upper shelf: 4 bottles + 2 bells
        const startX0 = shelves[0].x - shelfW * 0.30;
        for (let i = 0; i < 4; i++) {
          bottles.push(new CrystalBottle(startX0 + i * 62, shelves[0].y - 33, types[(i + 2) % types.length], colors[(i + 2) % colors.length]));
        }
        bells.push(new ChimeBell(shelves[0].x - shelfW * 0.45, 0, 110, 0));
        bells.push(new ChimeBell(shelves[0].x + shelfW * 0.45, 0, 110, 2));

      } else if (stageName === 'chandelier') {
        // Stage 2: Chimes, Bells & Chandelier
        const startX = shelves[1].x - shelfW * 0.36;
        for (let i = 0; i < 5; i++) {
          bells.push(new ChimeBell(startX + i * 72, 0, 95 + (i % 3) * 20, i));
        }
        // Bottles on upper shelf
        const colors = ['#06b6d4', '#f59e0b', '#8b5cf6', '#10b981'];
        for (let i = 0; i < 4; i++) {
          bottles.push(new CrystalBottle(shelves[0].x - 100 + i * 65, shelves[0].y - 33, 'decanter', colors[i]));
        }

      } else if (stageName === 'domino') {
        // Stage 3: Domino Cascade
        const startX = shelves[0].x - shelfW * 0.44;
        for (let i = 0; i < 12; i++) {
          dominoes.push(new DominoBrick(startX + i * 36, shelves[0].y - 29, 13, 58, i % 2 === 0 ? '#f59e0b' : '#d97706'));
        }
        // Lower shelf has bottles waiting to be struck
        const colors = ['#10b981', '#3b82f6', '#f59e0b', '#8b5cf6', '#06b6d4'];
        const startX1 = shelves[1].x - shelfW * 0.35;
        for (let i = 0; i < 5; i++) {
          bottles.push(new CrystalBottle(startX1 + i * 68, shelves[1].y - 33, 'wine', colors[i]));
        }
        bells.push(new ChimeBell(shelves[1].x + shelfW * 0.42, 0, 130, 4));

      } else if (stageName === 'sandbox') {
        // Stage 4: Free Sandbox
        const colors = ['#10b981', '#f59e0b', '#3b82f6', '#8b5cf6', '#06b6d4'];
        for (let i = 0; i < 4; i++) {
          bottles.push(new CrystalBottle(shelves[0].x - 90 + i * 60, shelves[0].y - 33, 'flask', colors[i]));
          bottles.push(new CrystalBottle(shelves[1].x - 90 + i * 60, shelves[1].y - 33, 'potion', colors[(i + 2) % 5]));
        }
        bells.push(new ChimeBell(shelves[0].x + shelfW * 0.38, 0, 115, 1));
      }
    }

    /* ==========================================================================
       RESIZE & LAYOUT
       ========================================================================== */
    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.round(W * DPR);
      canvas.height = Math.round(H * DPR);
      glowCanvas.width = darkCanvas.width = Math.ceil(W * 0.25);
      glowCanvas.height = darkCanvas.height = Math.ceil(H * 0.25);

      // Lamp Anchor
      lamp.ax = W * 0.54;
      lamp.len = clamp(H * 0.28, 120, 260);

      // Slingshot Placement (anchored at lower left)
      sling.x = clamp(W * 0.18, 90, 280);
      sling.y = H;
      sling.forkL = { x: sling.x - 28, y: H - 130 };
      sling.forkR = { x: sling.x + 28, y: H - 130 };
      sling.rest = { x: sling.x, y: H - 118 };
      if (!grab || grab.type !== 'slingshot') {
        sling.pouch = { ...sling.rest };
      }

      buildStage(currentStage);
    }
    window.addEventListener('resize', resize);

    /* ==========================================================================
       PHYSICS SIMULATION TICK
       ========================================================================== */
    function updatePhysics(dt) {
      // 1. Lamp Pendulum Physics
      const lampAcc = (-G / lamp.len) * Math.sin(lamp.theta) - 0.75 * lamp.omega;
      lamp.omega += lampAcc * dt;
      lamp.theta += lamp.omega * dt;

      // Lamp light intensity smoothing
      const targetI = (lamp.lightOn && !lamp.bulbBroken) ? 1.0 : 0.0;
      lamp.lightI += (targetI - lamp.lightI) * (dt * 14);

      // 2. Chime Bells Pendulum Physics
      bells.forEach(bell => {
        const acc = (-G / bell.len) * Math.sin(bell.theta) - 1.2 * bell.omega;
        bell.omega += acc * dt;
        bell.theta += bell.omega * dt;
      });

      // 3. Slingshot Pouch Elastic Return (Spring Damping)
      if (!grab || grab.type !== 'slingshot') {
        const k = 480; // Spring stiffness
        const damp = 22; // Damping
        const fx = (sling.rest.x - sling.pouch.x) * k;
        const fy = (sling.rest.y - sling.pouch.y) * k;
        sling.vel.x = (sling.vel.x + fx * dt) * Math.exp(-damp * dt);
        sling.vel.y = (sling.vel.y + fy * dt) * Math.exp(-damp * dt);
        sling.pouch.x += sling.vel.x * dt;
        sling.pouch.y += sling.vel.y * dt;

        // Reload fresh ammo when rest is reached
        if (!sling.loaded) {
          sling.reloadTimer += dt;
          if (sling.reloadTimer >= 0.25) {
            sling.loaded = true;
            sling.reloadTimer = 0;
          }
        }
      }

      // 4. Domino Bricks Physics & Chain Collisions
      dominoes.forEach((d, i) => {
        if (Math.abs(d.angle) > 0.01) {
          // Gravitational topple torque
          const torque = 28 * Math.sin(d.angle);
          d.vAngle = (d.vAngle + torque * dt) * 0.96;
          d.angle += d.vAngle * dt;

          // Restrict toppling angle
          if (Math.abs(d.angle) > Math.PI * 0.42) {
            d.angle = Math.sign(d.angle) * Math.PI * 0.42;
            d.vAngle = 0;
          }

          // Domino-to-Domino Chain Reaction
          if (i < dominoes.length - 1) {
            const next = dominoes[i + 1];
            const reach = Math.sin(d.angle) * d.h;
            if (d.x + reach >= next.x - next.w * 0.5 && next.angle === 0) {
              next.vAngle = d.vAngle * 1.1;
              next.angle += 0.05;
              sfx.woodClack(0.8);
            }
          }
        }
      });

      // 5. Projectiles Trajectory & Continuous Collision Detection
      projectiles.forEach(p => {
        if (!p.alive) return;
        p.life -= dt;
        if (p.life <= 0) { p.alive = false; return; }

        // Trail recording
        p.trail.push({ x: p.x, y: p.y, life: 1.0 });
        if (p.trail.length > 14) p.trail.shift();

        // Sub-step movement
        const prevX = p.x;
        const prevY = p.y;
        p.vy += G * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        // Collision: Shelves
        shelves.forEach(sh => {
          if (p.x >= sh.x - sh.w * 0.5 && p.x <= sh.x + sh.w * 0.5) {
            if (prevY <= sh.y - sh.h * 0.5 && p.y >= sh.y - sh.h * 0.5) {
              p.y = sh.y - sh.h * 0.5;
              p.vy = -p.vy * p.restitution;
              p.vx *= 0.85;
              p.bounces++;
              sfx.woodClack(Math.abs(p.vy) / 400);
            }
          }
        });

        // Collision: Floor (H - 24)
        if (p.y >= H - 24 - p.r) {
          p.y = H - 24 - p.r;
          p.vy = -p.vy * p.restitution;
          p.vx *= 0.82;
          p.bounces++;
          if (Math.abs(p.vy) > 80) sfx.woodClack(Math.abs(p.vy) / 500);
          if (p.bounces > 6 && Math.abs(p.vy) < 40) p.alive = false;
        }

        // Collision: Left / Right Walls
        if (p.x <= p.r) {
          p.x = p.r; p.vx = -p.vx * p.restitution;
        }
        if (p.x >= W - p.r) {
          p.x = W - p.r; p.vx = -p.vx * p.restitution;
        }

        // Collision: Wall Switch Strike
        const swRect = switchEl.getBoundingClientRect();
        if (p.x >= swRect.left && p.x <= swRect.right && p.y >= swRect.top && p.y <= swRect.bottom) {
          toggleLightSwitch();
          p.vx = -p.vx * 0.6;
          p.vy *= 0.6;
        }

        // Collision: Hanging Chandelier Lamp Shade & Bulb
        const lampOrigin = { x: lamp.ax + Math.sin(lamp.theta) * lamp.len, y: lamp.ay + Math.cos(lamp.theta) * lamp.len };
        const distToLamp = Math.hypot(p.x - lampOrigin.x, p.y - lampOrigin.y);
        if (distToLamp < 42) {
          // Transfer momentum to chandelier pendulum
          lamp.omega += (p.vx * 0.002);
          sfx.metalPing();

          // Check if hitting light bulb
          if (p.y >= lampOrigin.y + 10 && !lamp.bulbBroken) {
            lamp.bulbBroken = true;
            sfx.bulbPop();
            showToast('💡 Light Bulb Popped!');
            // Spark shower
            for (let i = 0; i < 28; i++) {
              const ang = Math.random() * Math.PI * 2;
              const spd = 60 + Math.random() * 240;
              sparks.push({
                x: lampOrigin.x, y: lampOrigin.y + 20,
                vx: Math.cos(ang) * spd,
                vy: Math.sin(ang) * spd - 60,
                life: 1.0, max: 0.8 + Math.random() * 0.5
              });
            }
          }
          p.vx = -p.vx * 0.5;
          p.vy = -p.vy * 0.5;
        }

        // Collision: Crystal Bottles
        bottles.forEach(b => {
          if (b.broken) return;
          if (p.x >= b.x - b.w * 0.5 && p.x <= b.x + b.w * 0.5 &&
              p.y >= b.y - b.h * 0.5 && p.y <= b.y + b.h * 0.5) {
            const impactVel = Math.hypot(p.vx, p.vy);
            b.shatter(impactVel);
            if (p.type !== 'steel') {
              p.vx *= 0.45;
              p.vy *= 0.45;
            }
          }
        });

        // Collision: Chime Bells
        bells.forEach(bell => {
          const bp = bell.getPos();
          if (Math.hypot(p.x - bp.x, p.y - bp.y) < bell.r + p.r) {
            const impulse = Math.hypot(p.vx, p.vy);
            bell.strike(impulse);
            p.vx = -p.vx * 0.5;
            p.vy = -p.vy * 0.5;
          }
        });

        // Collision: Domino Bricks
        dominoes.forEach(d => {
          if (p.x >= d.x - d.w * 0.5 && p.x <= d.x + d.w * 0.5 &&
              p.y >= d.y - d.h && p.y <= d.y) {
            d.vAngle = (p.vx > 0 ? 1 : -1) * 8.5;
            d.angle += (p.vx > 0 ? 0.05 : -0.05);
            sfx.woodClack(Math.abs(p.vx) / 300);
            p.vx *= 0.5;
          }
        });
      });

      // 6. Flying Shards Physics
      shards.forEach(sh => {
        sh.life -= dt * 0.7;
        sh.vy += G * dt;
        sh.x += sh.vx * dt;
        sh.y += sh.vy * dt;
        sh.angle += sh.vAngle * dt;

        // Bounce on floor
        if (sh.y >= H - 24) {
          sh.y = H - 24;
          sh.vy = -sh.vy * 0.4;
          sh.vx *= 0.75;
          sh.vAngle *= 0.7;
        }
      });

      // 7. Liquid Splatter Droplets
      splatters.forEach(sp => {
        sp.life -= dt * 0.8;
        sp.vy += G * dt * 0.9;
        sp.x += sp.vx * dt;
        sp.y += sp.vy * dt;
        if (sp.y >= H - 24) {
          sp.y = H - 24;
          sp.vy = 0; sp.vx = 0;
        }
      });

      // 8. Electrical Sparks
      sparks.forEach(sp => {
        sp.life -= dt * 1.5;
        sp.vy += G * dt * 0.6;
        sp.x += sp.vx * dt;
        sp.y += sp.vy * dt;
      });

      // Clean dead particles
      projectiles = projectiles.filter(p => p.alive);
      shards = shards.filter(sh => sh.life > 0);
      splatters = splatters.filter(sp => sp.life > 0);
      sparks = sparks.filter(sp => sp.life > 0);
    }

    /* ==========================================================================
       RENDER LOOP & DUAL LIGHTING BUFFERS
       ========================================================================== */
    function renderLight() {
      const I = clamp(lamp.lightI, 0, 1);
      gctx.setTransform(1, 0, 0, 1, 0, 0);
      gctx.clearRect(0, 0, glowCanvas.width, glowCanvas.height);

      if (I > 0.002) {
        gctx.setTransform(0.25, 0, 0, 0.25, 0, 0);
        gctx.filter = 'blur(6px)';
        const o = { x: lamp.ax + Math.sin(lamp.theta) * lamp.len, y: lamp.ay + Math.cos(lamp.theta) * lamp.len };
        const reach = Math.max(W, H) * 1.2;
        const grd = gctx.createRadialGradient(o.x, o.y + 15, 0, o.x, o.y + 15, reach);
        grd.addColorStop(0, `rgba(255,214,160,${I * 0.95})`);
        grd.addColorStop(0.35, `rgba(255,190,130,${I * 0.75})`);
        grd.addColorStop(1, 'rgba(255,180,110,0)');
        gctx.fillStyle = grd;
        gctx.fillRect(0, 0, W, H);
        gctx.filter = 'none';
      }

      dctx.setTransform(1, 0, 0, 1, 0, 0);
      dctx.globalCompositeOperation = 'source-over';
      dctx.clearRect(0, 0, darkCanvas.width, darkCanvas.height);
      dctx.fillStyle = `rgba(3,4,6,${0.96 - I * 0.12})`;
      dctx.fillRect(0, 0, darkCanvas.width, darkCanvas.height);

      if (I > 0.002) {
        dctx.globalCompositeOperation = 'destination-out';
        dctx.drawImage(glowCanvas, 0, 0);
        dctx.globalCompositeOperation = 'source-over';
      }

      ctx.drawImage(darkCanvas, 0, 0, W, H);

      if (I > 0.002) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.14;
        ctx.drawImage(glowCanvas, 0, 0, W, H);
        ctx.globalAlpha = 1.0;
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    function draw() {
      ctx.save();
      ctx.scale(DPR, DPR);
      ctx.clearRect(0, 0, W, H);

      // 1. Warm Antique Workshop Atmosphere & Wood Plank Floor
      const bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.35, 60, W * 0.5, H * 0.5, W * 0.85);
      bgGrad.addColorStop(0, '#151720');
      bgGrad.addColorStop(0.5, '#0b0c10');
      bgGrad.addColorStop(1, '#050607');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // Antique Mahogany Floor Table
      ctx.fillStyle = '#140c08';
      ctx.fillRect(0, H - 24, W, 24);
      ctx.fillStyle = 'rgba(243, 201, 143, 0.16)';
      ctx.fillRect(0, H - 24, W, 2);

      // 2. Shelves (Solid Mahogany with Polished Brass Bevels)
      shelves.forEach(sh => {
        ctx.save();
        // Drop Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(sh.x - sh.w * 0.5, sh.y + sh.h * 0.5, sh.w, 16);

        // Mahogany Plank
        const woodGrad = ctx.createLinearGradient(0, sh.y - sh.h * 0.5, 0, sh.y + sh.h * 0.5);
        woodGrad.addColorStop(0, '#3e1d10');
        woodGrad.addColorStop(1, '#1f0d06');
        ctx.fillStyle = woodGrad;
        ctx.fillRect(sh.x - sh.w * 0.5, sh.y - sh.h * 0.5, sh.w, sh.h);

        // Golden Brass Edge Highlight
        ctx.fillStyle = '#d4af37';
        ctx.fillRect(sh.x - sh.w * 0.5, sh.y - sh.h * 0.5, sh.w, 2);

        // Heavy Wall Brackets
        [-sh.w * 0.38, sh.w * 0.38].forEach(bx => {
          ctx.fillStyle = '#b48a28';
          ctx.fillRect(sh.x + bx - 4, sh.y + sh.h * 0.5, 8, 24);
        });
        ctx.restore();
      });

      // 3. Resonant Brass Chime Bells
      bells.forEach(bell => {
        ctx.save();
        ctx.strokeStyle = 'rgba(212, 175, 55, 0.45)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(bell.ax, bell.ay);
        const bp = bell.getPos();
        ctx.lineTo(bp.x, bp.y);
        ctx.stroke();

        ctx.translate(bp.x, bp.y);
        ctx.rotate(bell.theta);

        const bGrad = ctx.createRadialGradient(-3, -5, 2, 0, 0, bell.r);
        bGrad.addColorStop(0, '#fef08a');
        bGrad.addColorStop(0.4, '#eab308');
        bGrad.addColorStop(1, '#78350f');
        ctx.fillStyle = bGrad;
        ctx.beginPath();
        ctx.arc(0, 0, bell.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#451a03';
        ctx.beginPath(); ctx.arc(0, bell.r * 0.8, 5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      });

      // 4. Wooden Dominoes
      dominoes.forEach(d => {
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.rotate(d.angle);

        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(-d.w * 0.5 + 4, -d.h + 4, d.w, d.h);

        const dGrad = ctx.createLinearGradient(-d.w * 0.5, 0, d.w * 0.5, 0);
        dGrad.addColorStop(0, '#f59e0b');
        dGrad.addColorStop(1, d.color);
        ctx.fillStyle = dGrad;
        ctx.fillRect(-d.w * 0.5, -d.h, d.w, d.h);

        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.lineWidth = 1;
        ctx.strokeRect(-d.w * 0.5 + 1, -d.h + 1, d.w - 2, d.h - 2);
        ctx.restore();
      });

      // 5. Crystal Glass Bottles & Sloshing Liquid
      bottles.forEach(b => {
        if (b.broken) return;
        ctx.save();
        ctx.translate(b.x, b.y);

        // Bottle soft ambient glow
        const gGrad = ctx.createRadialGradient(0, 0, 4, 0, 0, 36);
        gGrad.addColorStop(0, b.color);
        gGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = gGrad;
        ctx.globalAlpha = 0.22;
        ctx.fillRect(-b.w * 1.2, -b.h * 0.5, b.w * 2.4, b.h);
        ctx.globalAlpha = 1.0;

        // Sloshing Liquid Meniscus
        ctx.fillStyle = b.color;
        ctx.globalAlpha = 0.65;
        ctx.beginPath();
        ctx.roundRect(-b.w * 0.44, -b.h * 0.5 + (1 - b.liquidFill) * b.h, b.w * 0.88, b.h * b.liquidFill - 2, [0, 0, 6, 6]);
        ctx.fill();

        // Crystal Glass Body
        ctx.fillStyle = b.color;
        ctx.globalAlpha = 0.72;
        ctx.beginPath();
        ctx.roundRect(-b.w * 0.5, -b.h * 0.5 + 14, b.w, b.h - 14, [4, 4, 8, 8]);
        ctx.fill();

        // Bottle Neck
        ctx.fillRect(-b.w * 0.22, -b.h * 0.5, b.w * 0.44, 16);

        // Cork Stopper
        ctx.fillStyle = '#b45309';
        ctx.fillRect(-b.w * 0.18, -b.h * 0.5 - 4, b.w * 0.36, 5);

        // Specular Reflection Streak
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.fillRect(-b.w * 0.35, -b.h * 0.5 + 18, 3, b.h - 24);
        ctx.restore();
      });

      // 6. Flying Shards & Splatters
      shards.forEach(sh => {
        ctx.save();
        ctx.translate(sh.x, sh.y);
        ctx.rotate(sh.angle);
        ctx.globalAlpha = Math.max(0, sh.life);
        ctx.fillStyle = sh.color;
        ctx.beginPath();
        ctx.moveTo(0, -sh.size);
        ctx.lineTo(sh.size * 0.8, sh.size);
        ctx.lineTo(-sh.size * 0.8, sh.size * 0.4);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 0.7; ctx.stroke();
        ctx.restore();
      });

      splatters.forEach(sp => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, sp.life);
        ctx.fillStyle = sp.color;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 7. Electrical Sparks
      if (sparks.length > 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        sparks.forEach(sp => {
          const t = clamp(sp.life / sp.max, 0, 1);
          ctx.strokeStyle = `rgba(255,${Math.round(160 + 90 * t)},${Math.round(80 * t)},${t})`;
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(sp.x, sp.y);
          ctx.lineTo(sp.x - sp.vx * 0.02, sp.y - sp.vy * 0.02);
          ctx.stroke();
        });
        ctx.restore();
      }

      // 8. Hanging Chandelier (Homage to Slingshot Lamp)
      drawChandelier();

      // 9. Flying Projectiles & Glow Trails
      projectiles.forEach(p => {
        // Glowing Trail
        if (p.trail.length > 1) {
          ctx.save();
          ctx.lineCap = 'round';
          for (let i = 1; i < p.trail.length; i++) {
            const alpha = (i / p.trail.length) * 0.6;
            ctx.strokeStyle = p.type === 'glow' ? `rgba(56, 189, 248, ${alpha})` : (p.type === 'bouncer' ? `rgba(244, 63, 94, ${alpha})` : `rgba(243, 201, 143, ${alpha})`);
            ctx.lineWidth = p.r * 1.5 * (i / p.trail.length);
            ctx.beginPath();
            ctx.moveTo(p.trail[i - 1].x, p.trail[i - 1].y);
            ctx.lineTo(p.trail[i].x, p.trail[i].y);
            ctx.stroke();
          }
          ctx.restore();
        }

        // Projectile Body
        ctx.save();
        const pGrad = ctx.createRadialGradient(p.x - 2, p.y - 2, 1, p.x, p.y, p.r);
        pGrad.addColorStop(0, '#ffffff');
        pGrad.addColorStop(0.5, p.color);
        pGrad.addColorStop(1, '#0f172a');
        ctx.fillStyle = pGrad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 10. Trajectory Prediction Dots (When aiming slingshot)
      if (grab && grab.type === 'slingshot') {
        const pullVec = { x: sling.rest.x - sling.pouch.x, y: sling.rest.y - sling.pouch.y };
        const pullLen = Math.hypot(pullVec.x, pullVec.y);

        if (pullLen > 10) {
          const clampedLen = Math.min(pullLen, sling.maxPull);
          const nx = pullVec.x / pullLen;
          const ny = pullVec.y / pullLen;
          let simX = sling.rest.x;
          let simY = sling.rest.y;
          let simVx = nx * clampedLen * sling.launchMultiplier;
          let simVy = ny * clampedLen * sling.launchMultiplier;
          const simDt = 0.025;

          ctx.save();
          for (let i = 0; i < 22; i++) {
            simX += simVx * simDt;
            simY += simVy * simDt;
            simVy += G * simDt;

            const alpha = 0.6 * (1 - i / 22);
            ctx.fillStyle = `rgba(243, 201, 143, ${alpha})`;
            ctx.beginPath();
            ctx.arc(simX, simY, 2.5, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      // 11. Tactile Slingshot (Exact Slingshot Lamp Craftsmanship)
      drawTactileSlingshot();

      // 12. Dual Lighting Overlay
      renderLight();

      ctx.restore();
    }

    function drawChandelier() {
      const o = { x: lamp.ax + Math.sin(lamp.theta) * lamp.len, y: lamp.ay + Math.cos(lamp.theta) * lamp.len };

      ctx.save();
      // Ceiling chain
      ctx.strokeStyle = 'rgba(212, 175, 55, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(lamp.ax, lamp.ay);
      ctx.lineTo(o.x, o.y);
      ctx.stroke();

      ctx.translate(o.x, o.y);
      ctx.rotate(lamp.theta);

      // Bronze Shade
      const shadeGrad = ctx.createLinearGradient(-35, 0, 35, 0);
      shadeGrad.addColorStop(0, '#78350f');
      shadeGrad.addColorStop(0.5, '#d97706');
      shadeGrad.addColorStop(1, '#451a03');
      ctx.fillStyle = shadeGrad;
      ctx.beginPath();
      ctx.moveTo(-35, 12);
      ctx.lineTo(35, 12);
      ctx.lineTo(24, -14);
      ctx.lineTo(-24, -14);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 1.5; ctx.stroke();

      // Light Bulb inside shade
      if (!lamp.bulbBroken) {
        const I = lamp.lightI;
        const bGrad = ctx.createRadialGradient(0, 16, 2, 0, 16, 14);
        bGrad.addColorStop(0, `rgba(255, 255, 240, ${0.2 + 0.8 * I})`);
        bGrad.addColorStop(0.6, `rgba(255, 200, 120, ${0.2 + 0.6 * I})`);
        bGrad.addColorStop(1, `rgba(255, 160, 80, ${0.1 + 0.3 * I})`);
        ctx.fillStyle = bGrad;
        ctx.beginPath();
        ctx.arc(0, 16, 12, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Shattered bulb socket
        ctx.fillStyle = 'rgba(200,215,230,0.3)';
        ctx.beginPath();
        ctx.arc(0, 8, 5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawTactileSlingshot() {
      const { forkL, forkR, pouch, rest } = sling;
      const stretch = clamp(Math.hypot(pouch.x - rest.x, pouch.y - rest.y) / sling.maxPull, 0, 1);
      const bandW = 4.2 - stretch * 2.2;

      ctx.save();
      // Back Rubber Band (Left prong to pouch)
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#7a2e22';
      ctx.lineWidth = bandW;
      ctx.beginPath();
      ctx.moveTo(forkL.x, forkL.y);
      ctx.lineTo(pouch.x - 6, pouch.y);
      ctx.stroke();

      // Carved Wooden Fork & Handle (Rich Woodgrain Gradient from Slingshot Lamp)
      const woodGrad = ctx.createLinearGradient(sling.x - 32, 0, sling.x + 32, 0);
      woodGrad.addColorStop(0, '#3b2616');
      woodGrad.addColorStop(0.45, '#8a5a34');
      woodGrad.addColorStop(1, '#3a2515');
      ctx.strokeStyle = woodGrad;
      ctx.lineWidth = 12;
      ctx.beginPath();
      ctx.moveTo(sling.x, H + 10);
      ctx.lineTo(sling.x, H - 65);
      ctx.quadraticCurveTo(sling.x - 4, H - 90, forkL.x, forkL.y);
      ctx.moveTo(sling.x, H - 65);
      ctx.quadraticCurveTo(sling.x + 4, H - 90, forkR.x, forkR.y);
      ctx.stroke();

      // Specular Highlight
      ctx.strokeStyle = 'rgba(255,220,180,0.14)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(sling.x - 2, H);
      ctx.lineTo(sling.x - 2, H - 65);
      ctx.stroke();

      // Brass Prong Caps
      ctx.fillStyle = '#2a1a0f';
      [forkL, forkR].forEach(t => {
        ctx.beginPath(); ctx.ellipse(t.x, t.y, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
      });

      // Rotating Leather Pouch
      const pullAngle = Math.atan2(pouch.y - rest.y, pouch.x - rest.x);
      ctx.fillStyle = '#4a2c1c';
      ctx.beginPath();
      ctx.ellipse(pouch.x, pouch.y, 11, 7, pullAngle, 0, Math.PI * 2);
      ctx.fill();

      // Loaded Ammo Ball in Pouch
      if (sling.loaded) {
        const ammoColor = currentAmmo === 'steel' ? '#cbd5e1' : (currentAmmo === 'glow' ? '#38bdf8' : (currentAmmo === 'bouncer' ? '#f43f5e' : '#a9a49b'));
        const aGrad = ctx.createRadialGradient(pouch.x - 2, pouch.y - 2, 1, pouch.x, pouch.y, 8);
        aGrad.addColorStop(0, '#fff');
        aGrad.addColorStop(0.6, ammoColor);
        aGrad.addColorStop(1, '#1e293b');
        ctx.fillStyle = aGrad;
        ctx.beginPath();
        ctx.arc(pouch.x, pouch.y, 7.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Front Rubber Band (Right prong to pouch)
      ctx.strokeStyle = '#8e3627';
      ctx.lineWidth = bandW;
      ctx.beginPath();
      ctx.moveTo(forkR.x, forkR.y);
      ctx.lineTo(pouch.x + 6, pouch.y);
      ctx.stroke();

      ctx.restore();
    }

    /* ==========================================================================
       INPUT & POINTER EVENT HANDLING
       ========================================================================== */
    function getPointerPos(e) {
      return { x: e.clientX, y: e.clientY };
    }

    canvas.addEventListener('pointerdown', e => {
      sfx.init();
      const p = getPointerPos(e);

      // Check grabbing slingshot pouch
      const dToPouch = Math.hypot(p.x - sling.pouch.x, p.y - sling.pouch.y);
      if (dToPouch < 45) {
        grab = { type: 'slingshot', pointerId: e.pointerId };
        canvas.setPointerCapture(e.pointerId);
        sfx.creak();
        return;
      }

      // In Sandbox mode, click on empty space spawns a crystal bottle
      if (currentStage === 'sandbox') {
        const colors = ['#10b981', '#f59e0b', '#3b82f6', '#8b5cf6', '#06b6d4'];
        bottles.push(new CrystalBottle(p.x, p.y, 'wine', colors[Math.floor(Math.random() * colors.length)]));
        sfx.woodClack(0.5);
      }
    });

    canvas.addEventListener('pointermove', e => {
      const p = getPointerPos(e);

      if (grab && grab.type === 'slingshot') {
        // Restrict pull distance
        const dx = p.x - sling.rest.x;
        const dy = p.y - sling.rest.y;
        const dist = Math.hypot(dx, dy);

        if (dist > sling.maxPull) {
          const ratio = sling.maxPull / dist;
          sling.pouch.x = sling.rest.x + dx * ratio;
          sling.pouch.y = sling.rest.y + dy * ratio;
        } else {
          sling.pouch.x = p.x;
          sling.pouch.y = p.y;
        }

        // Creaking sound when pulling
        const now = Date.now();
        if (now - sling.creakCooldown > 80) {
          sfx.creak();
          sling.creakCooldown = now;
        }
      }
    });

    function releaseSlingshot() {
      if (grab && grab.type === 'slingshot') {
        const pullVec = { x: sling.rest.x - sling.pouch.x, y: sling.rest.y - sling.pouch.y };
        const pullLen = Math.hypot(pullVec.x, pullVec.y);

        if (pullLen > 15 && sling.loaded) {
          const clamped = Math.min(pullLen, sling.maxPull);
          const nx = pullVec.x / pullLen;
          const ny = pullVec.y / pullLen;
          const launchVx = nx * clamped * sling.launchMultiplier;
          const launchVy = ny * clamped * sling.launchMultiplier;

          // Fire projectile
          projectiles.push(new Projectile(sling.pouch.x, sling.pouch.y, launchVx, launchVy, currentAmmo));
          sling.loaded = false;
          shotsCount++;
          updateHUD();

          sfx.snap(clamped / sling.maxPull);
        }

        grab = null;
      }
    }

    canvas.addEventListener('pointerup', releaseSlingshot);
    canvas.addEventListener('pointercancel', releaseSlingshot);

    /* ==========================================================================
       WALL SWITCH INTERACTION
       ========================================================================== */
    function toggleLightSwitch() {
      lamp.lightOn = !lamp.lightOn;
      switchEl.setAttribute('aria-checked', lamp.lightOn ? 'true' : 'false');
      sfx.switchClick();
      showToast(lamp.lightOn ? '💡 Alley Lights ON' : '🌑 Alley Lights OFF');
    }
    switchEl.addEventListener('click', toggleLightSwitch);

    /* ==========================================================================
       HUD BUTTONS & AMMO SELECTORS
       ========================================================================== */
    function updateHUD() {
      document.getElementById('stat-shots').textContent = shotsCount;
      document.getElementById('stat-smashed').textContent = smashedCount;
      document.getElementById('stat-bells').textContent = bellsCount;
      document.getElementById('stat-score').textContent = score;
    }

    function showToast(text) {
      const t = document.getElementById('toast');
      t.textContent = text;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 1600);
    }

    // Stage buttons
    document.querySelectorAll('.stage-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        buildStage(btn.dataset.stage);
        sfx.init();
      });
    });

    // Ammo buttons
    document.querySelectorAll('.ammo-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.ammo-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentAmmo = btn.dataset.ammo;
        sfx.creak();
      });
    });

    // Sound toggle
    const soundBtn = document.getElementById('soundBtn');
    soundBtn.addEventListener('click', () => {
      sfx.enabled = !sfx.enabled;
      soundBtn.textContent = sfx.enabled ? '🔊 Audio: On' : '🔇 Audio: Muted';
    });

    // Slow-Mo toggle
    const slowBtn = document.getElementById('slowBtn');
    slowBtn.addEventListener('click', () => {
      timeScale = timeScale === 1.0 ? 0.35 : 1.0;
      slowBtn.textContent = timeScale === 1.0 ? '⏱️ Normal' : '⏳ Slow-Mo';
    });

    // Restock button
    document.getElementById('restockBtn').addEventListener('click', () => {
      lamp.bulbBroken = false;
      lamp.lightOn = true;
      switchEl.setAttribute('aria-checked', 'true');
      buildStage(currentStage);
      sfx.woodClack(0.8);
      showToast('🔄 Alley Restocked with Fresh Glassware!');
    });

    /* ==========================================================================
       MAIN GAME ANIMATION LOOP (120HZ SUB-STEPPED)
       ========================================================================== */
    let lastTime = performance.now();
    let accumulator = 0;

    function loop(now) {
      const delta = Math.min((now - lastTime) / 1000, 0.08) * timeScale;
      lastTime = now;
      accumulator += delta;

      while (accumulator >= STEP) {
        updatePhysics(STEP);
        accumulator -= STEP;
      }

      draw();
      requestAnimationFrame(loop);
    }

    // Launch Application
    window.addEventListener('DOMContentLoaded', () => {
      resize();
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
