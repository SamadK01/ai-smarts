<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galaxy Giggles — AI Smarts</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Funnel+Display:wght@700;800&display=swap');
*{box-sizing:border-box}html,body,canvas{width:100%;height:100%;margin:0}body{overflow:hidden;background:#03060e;color:#ece9df;font-family:Arial,sans-serif;touch-action:none}canvas{position:fixed;inset:0;display:block}.top,.bottom{position:fixed;z-index:2;font:11px 'DM Mono',monospace;pointer-events:none}.top{top:20px;left:22px;right:22px;display:flex;justify-content:space-between}.home,.sound{pointer-events:auto;color:#ece9df;text-decoration:none;background:none;border:0;font:inherit;cursor:pointer}.home:before{content:'← ';color:#f3a859}.sound{border:1px solid #ffffff2b;border-radius:100px;padding:7px 11px;color:#aeb9c8}.copy{position:fixed;z-index:1;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:opacity .55s}.copy h1{font:800 clamp(54px,9vw,124px)/.82 'Funnel Display',sans-serif;letter-spacing:-.075em;margin:0;text-shadow:0 0 45px #816de044}.copy em{font-style:normal;color:#b1a3ff}.copy p{font-size:14px;color:#aeb4c0;margin:23px 0 0}.copy.hide{opacity:0}.bottom{bottom:20px;left:0;right:0;text-align:center;color:#7d8795}.badge{position:fixed;z-index:2;top:20px;left:50%;transform:translateX(-50%);color:#9ca6b2;font:11px 'DM Mono',monospace}.badge b{font-weight:400;color:#f3a859}@media(max-width:600px){.top{top:14px;left:15px;right:15px}.bottom{bottom:14px;padding:0 20px;line-height:1.4}.copy h1{font-size:62px}.copy p{max-width:250px}.badge{top:17px;font-size:10px}}
</style></head><body><canvas id="galaxy"></canvas><header class="top"><a class="home" href="index.html">all experiments</a><button class="sound" id="sound">sound: on</button></header><div class="badge">planet pals <b id="worlds">0</b></div><section class="copy" id="copy"><h1>Galaxy<br><em>giggles.</em></h1><p>Tap the sky to make a silly planet.<br>Drag a planet to send it zooming around.</p></section><p class="bottom">tap the galaxy · make planet pals · poke the sun for a surprise</p><script>
const canvas=document.querySelector('#galaxy'),ctx=canvas.getContext('2d'),copy=document.querySelector('#copy'),worlds=document.querySelector('#worlds'),soundButton=document.querySelector('#sound');let W,H,DPR,cx,cy,stars=[],dust=[],planets=[],muted=false,started=false,drag=null,last=performance.now(),audio;
function size(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);cx=W/2;cy=H/2;seed();}addEventListener('resize',size);
function rand(a,b){return a+Math.random()*(b-a)}function seed(){stars=Array.from({length:Math.min(750,Math.floor(W*H/1700))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.15,a:rand(.18,.9),tw:rand(0,6)}));dust=[];for(let i=0;i<900;i++){let arm=i%2,rad=Math.pow(Math.random(),.58)*Math.min(W,H)*.48,angle=rad*.012+arm*Math.PI+rand(-.38,.38);dust.push({r:rad,a:angle,s:rand(.25,1.8),h:rand(205,285),alpha:rand(.04,.5)});}}
function tone(f=.1){if(muted)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio??=new A();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.18)}
function addPlanet(x,y){started=true;copy.classList.add('hide');let r=Math.max(75,Math.min(Math.min(W,H)*.47,Math.hypot(x-cx,y-cy))),a=Math.atan2(y-cy,x-cx),h=Math.floor(rand(15,350));planets.push({r,a,h,size:rand(10,17),speed:rand(.16,.44)*(Math.random()<.5?-1:1),ring:Math.random()>.7,drag:false,face:Math.floor(Math.random()*3),bounce:1});worlds.textContent=planets.length;tone(240+planets.length*28)}
function planetAt(x,y){return planets.find(p=>Math.hypot(x-(cx+Math.cos(p.a)*p.r),y-(cy+Math.sin(p.a)*p.r))<p.size+15)}
function pointer(e){return {x:e.clientX,y:e.clientY}}canvas.addEventListener('pointerdown',e=>{let p=pointer(e),hit=planetAt(p.x,p.y);canvas.setPointerCapture(e.pointerId);if(hit){drag=hit;hit.drag=true;hit.bounce=1.8;tone(160)}else if(Math.hypot(p.x-cx,p.y-cy)<50){planets.forEach(q=>q.speed*=-1.8);tone(600,.24)}else addPlanet(p.x,p.y)});canvas.addEventListener('pointermove',e=>{if(!drag)return;let p=pointer(e);drag.r=Math.max(58,Math.min(Math.min(W,H)*.48,Math.hypot(p.x-cx,p.y-cy)));drag.a=Math.atan2(p.y-cy,p.x-cx)});function release(){if(drag){drag.drag=false;drag.bounce=1.7;tone(350)}drag=null}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
soundButton.onclick=()=>{muted=!muted;soundButton.textContent=`sound: ${muted?'off':'on'}`};
function glow(x,y,r,color,a){let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color.replace(')',`,`+a+')').replace('rgb','rgba'));g.addColorStop(1,color.replace(')',',0)').replace('rgb','rgba'));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function draw(t){ctx.fillStyle='#03060e';ctx.fillRect(0,0,W,H);stars.forEach(s=>{let a=s.a*(.65+.35*Math.sin(t*.001+s.tw));ctx.fillStyle=`rgba(210,225,255,${a})`;ctx.fillRect(s.x,s.y,s.r,s.r)});ctx.save();ctx.translate(cx,cy);ctx.globalCompositeOperation='lighter';dust.forEach(d=>{let a=d.a+t*.000025*(d.r/120);let x=Math.cos(a)*d.r,y=Math.sin(a)*d.r*.52;ctx.fillStyle=`hsla(${d.h},80%,72%,${d.alpha})`;ctx.fillRect(x,y,d.s,d.s)});ctx.restore();glow(cx,cy,135,'rgb(112,88,255)',.22);glow(cx,cy,58,'rgb(255,159,88)',.62);ctx.fillStyle='#fff0ca';ctx.beginPath();ctx.arc(cx,cy,17,0,Math.PI*2);ctx.fill();planets.forEach(p=>{if(!p.drag)p.a+=p.speed*.012/p.r*150;p.bounce+=(1-p.bounce)*.08;let x=cx+Math.cos(p.a)*p.r,y=cy+Math.sin(p.a)*p.r,sz=p.size*p.bounce;ctx.strokeStyle=`hsla(${p.h},75%,74%,.12)`;ctx.beginPath();ctx.ellipse(cx,cy,p.r,p.r*.53,0,0,Math.PI*2);ctx.stroke();glow(x,y,sz*3,`rgb(${p.h<100?255:130},${p.h<100?150:190},${p.h>230?255:205})`,.2);ctx.fillStyle=`hsl(${p.h},72%,${p.drag?74:63}%)`;ctx.beginPath();ctx.arc(x,y,sz,0,Math.PI*2);ctx.fill();ctx.fillStyle='#172030';ctx.beginPath();ctx.arc(x-sz*.3,y-sz*.12,Math.max(1.5,sz*.13),0,Math.PI*2);ctx.arc(x+sz*.3,y-sz*.12,Math.max(1.5,sz*.13),0,Math.PI*2);ctx.fill();ctx.strokeStyle='#172030';ctx.lineWidth=Math.max(1,sz*.1);ctx.beginPath();if(p.face===0){ctx.arc(x,y+sz*.05,sz*.34,0,Math.PI)}else if(p.face===1){ctx.moveTo(x-sz*.35,y+sz*.28);ctx.lineTo(x+sz*.35,y+sz*.28)}else{ctx.arc(x,y+sz*.35,sz*.25,Math.PI,0)}ctx.stroke();if(p.ring){ctx.strokeStyle=`hsla(${p.h},75%,78%,.75)`;ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(x,y,sz*1.7,sz*.48,-.35,0,Math.PI*2);ctx.stroke()}});requestAnimationFrame(draw)}size();addPlanet(cx+150,cy);addPlanet(cx-235,cy-55);requestAnimationFrame(draw);
</script></body></html>
